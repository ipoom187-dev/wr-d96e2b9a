<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Wizard Royale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@600&display=swap">
<style>
/* Layout: one-screen battle table — rivals across the top, the market in the middle, your hand at the bottom, battle log on the right */
:root{
  --bg:#141019; --panel:#1f1826; --panel2:#2a2032; --line:#3b2f46;
  --ink:#efe6d6; --mute:#a99bb0; --accent:#ff7a3d; --gold:#f0c35a;
  --hp:#e5485f; --def:#59c2c7; --paper:#efe3c8; --paper-ink:#2a1f1a;
  --felt1:#33203f; --felt2:#160d1c; --wood:#4a2d1c;
  --t-starter:#8a8079; --t-spell:#d4502f; --t-creature:#4f9a4a; --t-treasure:#c99a2e;
  --t-wizard:#6a5bd1; --t-location:#2f8f93; --t-legend:#a3243b; --t-wild:#c23f9a;
  --t-bent:#6b5a45; --t-familiar:#d0679b; --t-chaos:#26202b;
  --f-display:"Pirata One", "Georgia", serif;
  --f-body:"Chakra Petch", "Tahoma", "Leelawadee UI", sans-serif;
  --f-thname:"Kanit", "Chakra Petch", "Tahoma", sans-serif; /* Thai card names */
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(ellipse at 50% -20%, #3a1d2e 0%, transparent 60%);}
button{font-family:inherit}
.app{display:flex;flex-direction:column;gap:12px;padding:4px 16px 12px;min-height:100%}
/* settings: a gear on the board's top-right corner opens a small menu (AI speed, sound, music, art, rules, new game) */
.settings{position:fixed;top:6px;right:8px;z-index:48;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:#1a1220e6;color:var(--gold);font-size:19px;line-height:1;
  cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px #000a}
.gear:hover,.gear[aria-expanded="true"]{background:var(--gold);color:#2a1d05}
.setmenu{display:flex;flex-direction:column;gap:6px;min-width:190px;padding:10px;border-radius:10px;background:var(--panel);
  border:1px solid var(--gold);box-shadow:0 12px 40px #000c}
.setmenu .btn{text-align:left;width:100%}
.setmenu .vol{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;color:var(--mute);padding:4px 2px 0}
.setmenu .vol span{color:var(--gold);font-variant-numeric:tabular-nums}
.setmenu .vol input{width:100%;accent-color:var(--gold)}
.sm-title{font-family:var(--f-display);font-size:20px;color:var(--gold);line-height:1;margin-bottom:2px}
.btn{background:var(--accent);color:#1a0f0a;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.sect-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
/* tabletop, scrolling layout (phones and small windows): the board, then the rivals' panels, then your mat.
   Desktop screens use the one-screen stage instead: see the "one-screen stage" block at the end of this sheet. */
.table{display:grid;gap:12px;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "seats" "you";align-content:start}
.seats{grid-area:seats;display:flex;flex-wrap:wrap;gap:10px;min-width:0;padding-top:6px}
.seats .rival{flex:1 1 230px;min-width:0;padding:8px 10px;flex-direction:row;align-items:center;gap:10px}
.seats .rival>.turnpill{position:absolute;top:-9px;right:8px;z-index:2}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stage-bg,.you-gap{display:none}
.midrow,.hand-zone .slot,.ong-zone .slot{display:contents}
.chal .ct{margin-right:4px}
.chal .cs{display:none}
/* whose turn it is: that panel lifts, glows and gets a "กำลังร่ายเวท" pill */
.seats .rival{transition:transform .25s,background .25s}
.seats .rival.active{transform:translateY(-6px);border-color:var(--accent);border-width:2px 2px 2px 5px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 24%, var(--panel)), var(--panel) 85%)}
.turnpill{font-size:11px;font-weight:700;color:#1a0f0a;background:var(--accent);border-radius:999px;padding:1px 9px;white-space:nowrap}
.rival .rname{flex-wrap:wrap;align-items:center}
.rival .rbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rival .rbtns .linkbtn{padding:2px 8px}
.ongmark{border:0;border-radius:999px;background:#2f8f93;color:#fff;font:inherit;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer}
.ongmark:hover{background:#3aa9ae}
.seats .rival{position:relative}
/* the token count sits on the panel's top-right corner, half over its border, so it never pushes the name row */
.hprow{display:flex;align-items:center;gap:8px}
.hprow .hpbar{flex:1}
.trait.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rival{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rival.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 0 24px #ff7a3d33}
.seatdir{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rival .ong{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.linkbtn:hover{border-color:var(--gold);color:var(--gold)}
.boardc{grid-area:board;min-width:0;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2));
  border:10px solid var(--wood);box-shadow:0 0 0 2px var(--gold) inset,0 10px 40px #000a}
.arena{border:1px solid color-mix(in srgb, var(--gold) 28%, transparent);border-radius:14px;padding:10px 12px;
  background:radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);transition:box-shadow .3s}
.arena.busy{box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 32px color-mix(in srgb, var(--accent) 22%, transparent)}
.goldbox{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:10px;padding:8px 12px;
  border-radius:12px;border:2px solid var(--gold);background:radial-gradient(ellipse at 30% 30%, #f0c35a33, #1a1220 75%);
  box-shadow:0 0 22px #f0c35a55, 0 0 0 1px #000 inset}
.goldbox .coin{grid-row:1/3;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff6c8, #f0c35a 45%, #a8741c 100%);box-shadow:0 0 0 2px #7a520f inset,0 2px 6px #000a}
.goldbox .arena-pw{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.9;color:var(--gold);text-shadow:0 0 14px #f0c35a99,0 2px 0 #000;
  font-variant-numeric:tabular-nums}
.goldbox small{font-size:11px;letter-spacing:.06em;color:#f3e2b5}
.goldbox.bump{animation:goldbump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes goldbump{0%{transform:scale(1)}40%{transform:scale(1.14);box-shadow:0 0 40px #f0c35acc}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.goldbox.bump{animation:none}}
/* casting arena keeps one fixed size: one row of cards that are all --arena-h tall (long ability text shrinks to fit,
   see fitNames); the ✲ button sits over the bottom of its card; when the row is full the cards overlap instead of wrapping */
.arena{--arena-h:var(--card-h)}
.arena{display:flex;align-items:center;gap:14px}
.arena .cards.played{flex:1;min-width:0;flex-wrap:nowrap;align-items:flex-start;height:var(--arena-h);gap:6px;
  /* the last slot is squeezed to 12px but its card is a full --card-w wide: keep that room inside the row, and clip
     anything beyond it, so stacked cards never spill onto the gold counter, the ✲ buttons or End Turn */
  padding-right:calc(var(--card-w) - 12px);overflow-x:clip;overflow-y:visible}
.arena-actions{flex:none;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:150px;position:relative;z-index:6}
.arena-actions .btn{white-space:normal}
.arena-actions .end-btn{padding:14px 10px;font-size:17px}
.arena .act-wrap{position:relative}
.arena .act-wrap .act-btn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.arena .cards.played>.slot{flex:0 1 var(--card-w);min-width:12px;position:relative}
.arena .cards.played>.slot:hover{z-index:5}
.arena .cards.played>.slot>.card,.arena .cards.played>.slot>.act-wrap{width:var(--card-w)}
.arena .cards.played .card{height:var(--arena-h);min-height:0;overflow:hidden}
.arena .cards.played .card .c-text{overflow:hidden}
.arena .cards.played>.empty{align-self:center}
/* the line between the shop and the arena: arena title (whose turn, power, events) on the left, pile counts on the right */
.boardbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px}
.boardbar .arena-title{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.boardbar .ev-btn{padding-top:2px;padding-bottom:2px;align-self:center}
.ev-btn{background:#3a2a1a;border-color:var(--gold);color:var(--gold);font-weight:700}
.ev-btn:hover{background:var(--gold);color:#2a1d05}
/* events viewer: one block per turn, this turn highlighted */
.ev-turn{border-top:1px solid var(--line);padding-top:10px}
.ev-turn.now h4{color:var(--accent)}
.ev-sub{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:6px 0 4px}
.boardbar .piles{margin:0 0 0 auto;justify-content:flex-end;gap:6px 8px}
.pile-chip,.piles .pile-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:linear-gradient(#2a1d34f2,#160e1cf2);
  border:1px solid #c8a14a99;color:#f3e7cf;font-size:14px;font-weight:600;line-height:1.3}
.pile-chip b,.piles .pile-chip b{color:var(--gold);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
button.pile-chip{cursor:pointer}
button.pile-chip:hover{border-color:var(--gold);background:linear-gradient(#3a2a44,#20142a)}
/* "what happened" strip: each affected card with a coloured caption */
.cards.events{gap:12px}
.ev{display:flex;flex-direction:column;align-items:center;gap:4px}
.ev-cap{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);max-width:112px;text-align:center;line-height:1.3}
.ev-gain .ev-cap{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.ev-bad .ev-cap{background:#5b2a7a;color:#fff;border-color:#8c4bb8}
.ev-discard .ev-cap{background:#3a3340;color:var(--ink)}
.ev-destroy .ev-cap{background:var(--hp);color:#fff;border-color:var(--hp)}
.ev-reveal .ev-cap,.ev-defend .ev-cap{background:var(--def);color:#06282a;border-color:var(--def)}
.ev-act .ev-cap{background:var(--accent);color:#1a0f0a;border-color:var(--accent)}
/* centre-screen pop-up of the latest affected cards (does not block clicks) */
#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;display:flex;gap:16px;flex-wrap:nowrap;justify-content:center;max-width:96vw}
@media (max-width:760px){
  #pop{gap:8px} #pop .card{width:118px} #pop .card{--nf:14px} #pop .card .c-text{font-size:10px}
  #pop .ev-cap{font-size:11px;max-width:118px} #pop .pop-item:nth-last-child(n+4){display:none} /* latest 3 only */
}
#pop .pop-item{display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .32s cubic-bezier(.2,1.3,.4,1)}
#pop.out .pop-item{animation:popout .3s forwards}
#pop .ev-cap{font-size:15px;max-width:220px;padding:4px 12px;box-shadow:0 4px 14px #000a}
#pop .card{width:200px;box-shadow:0 18px 50px #000d}
#pop .card{--nf:21px}
#pop .card .c-text{font-size:13px}
@keyframes popin{from{transform:scale(.7) translateY(30px)}to{transform:none}} /* no opacity: visible even if animations are paused */
@keyframes popout{to{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#pop .pop-item,#pop.out .pop-item{animation:none}}
/* revealed cards (showReveal): a captioned row per reveal, upper middle of the screen, above the move pop-ups */
/* tutorial: a coach bubble over everything, and a spotlight (a hole in a dim layer) that lets clicks through */
#rev{position:fixed;left:2vw;right:2vw;top:9vh;z-index:41;pointer-events:none;display:flex;flex-direction:column;gap:10px;align-items:center}
#rev .rev-group{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:0 0 0 1px var(--def),0 16px 40px #000c;animation:popin .32s cubic-bezier(.2,1.3,.4,1)}
#rev .ev-cap{background:var(--def);color:#06282a;border-color:var(--def);font-size:14px;max-width:none;padding:3px 12px}
#rev .rev-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:92vw}
#rev .card{width:118px}
#rev .rev-cards.many{gap:4px}
#rev .rev-cards.many .card{width:78px}
#rev .rev-cards.many .card .c-text,#rev .rev-cards.many .card .c-cost{display:none} /* many cards: the name is what matters */
#rev.out .rev-group{animation:popout .3s forwards}
@media (max-width:760px){#rev .card{width:92px}#rev .card .c-text{font-size:9px}#rev .rev-cards.many .card{width:62px}}
@media (prefers-reduced-motion:reduce){#rev .rev-group,#rev.out .rev-group{animation:none}}
.arena .card.fresh{animation:deal .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{0%{transform:translateY(-50px) rotate(-8deg) scale(1.3);opacity:0;filter:brightness(2.4)}
  55%{transform:translateY(4px) rotate(1deg) scale(1.03);opacity:1;filter:brightness(1.4);box-shadow:0 0 0 3px var(--gold),0 0 44px var(--band)}
  100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.arena .card.fresh{animation:none}}
/* a new Line-Up card flies over from the main pile, face down, and turns over as it lands (animateLineup) */
.market .card.refill{position:relative;z-index:40;pointer-events:none;animation:linein .7s cubic-bezier(.35,.35,.6,1) backwards}
@keyframes linein{0%{transform:translate(var(--fx),var(--fy)) perspective(800px) rotateY(180deg) scale(.35);opacity:0;filter:brightness(.2)}
  12%{opacity:1}
  58%{transform:translate(0,-16px) perspective(800px) rotateY(90deg) scale(1.08);opacity:1;filter:brightness(.45)}
  80%{transform:translate(0,0) perspective(800px) rotateY(-7deg) scale(1.06);filter:brightness(1.45);box-shadow:0 0 0 3px var(--gold),0 0 36px var(--gold)}
  100%{transform:translate(0,0) perspective(800px) rotateY(0) scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.market .card.refill{animation:none}}
.arena-title{font-family:var(--f-display);font-size:22px;color:var(--gold);margin-bottom:8px}
.arena-title span{font-family:var(--f-body);font-size:13px;color:var(--ink)}
.rival .rname{display:flex;align-items:baseline;gap:8px}
.rival .rname b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--pc,var(--ink))}
.pname{font-weight:600}
.trait{font-size:11px;color:var(--gold)}
.hpbar{height:10px;background:#000a;border-radius:5px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s;position:relative;z-index:1}
.hpbar .hpghost{position:absolute;left:0;top:0;bottom:0;background:#fff4e0;box-shadow:0 0 8px #ffffffaa;animation:hpdrain 1.1s ease-in forwards}
@keyframes hpdrain{0%,35%{width:var(--from)}100%{width:var(--to)}}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px);background:#5a1a26}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
/* market: the board's top row holds every card for sale — 3 Stars and the 5-card Line-Up. The 9 cards
   share the row's width (up to 140px each, at least 96px; below that the row wraps, e.g. on phones) */
.market{container-type:inline-size;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:center;
  --card-w:max(96px, min(140px, calc((100cqw - 100px) / 9)));--card-h:calc(var(--card-w) * 1.8)}
.market .cards{gap:8px}
/* phones: three cards per line instead of two */
@container (max-width:640px){.market .mgroup{--card-w:calc((100cqw - 32px) / 3);--card-h:calc(var(--card-w) * 1.8)}}
.market .card{--nf:clamp(12px, calc(var(--card-w) * 0.12), 17px)} /* narrower cards get a smaller name and header */
/* shop cards drop the footer (its tags repeat the ability text): VP moves to a badge on the picture, leaving the text more room */
.market .card:not(.t-chaos) .c-type{max-width:calc(100% - 40px)}
.mgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.mgroup .cap{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgroup .cap b{color:var(--gold)}
/* the Stars sit on their own tinted tile so they read apart from the Line-Up */
.mg-legend{padding:4px 6px 6px;margin:-4px 0 -6px -6px;border-radius:10px;
  border:1px solid color-mix(in srgb, var(--t-legend) 60%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--t-legend) 26%, transparent), transparent 90%)}
/* pile counts (in .boardbar) */
.piles{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;justify-content:center}
.piles b{color:var(--ink)}
.piles .final-tag{color:#2a1d05;background:var(--gold);border-radius:999px;padding:1px 10px;font-weight:700}
/* cards */
.cards{display:flex;gap:8px;flex-wrap:wrap}
/* every card (hand, market, pop-ups, dialogs, zoom…) has one shape, 1 wide : 1.8 tall, like the zoomed card */
.card{--nf:17px;width:132px;aspect-ratio:1/1.8;min-height:0;overflow:hidden;background:var(--paper);color:var(--paper-ink);border-radius:8px;display:flex;flex-direction:column;
  border:3px solid var(--band,#888);position:relative;cursor:default;user-select:none;transition:transform .12s}
.card .c-head{display:flex;align-items:center;gap:6px;background:var(--band);color:#fff;padding:4px 6px}
/* the header is always two name-lines tall (--nf = the name's font size), so 1- and 2-line names line up */
.card:not(.t-chaos) .c-head{height:calc(var(--nf) * var(--hl, 2.1) + 8px);flex:none}
.card .c-cost{min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1d05;display:grid;place-items:center;font-weight:700;font-size:13px}
.card .c-cost:empty{display:none}
.card .c-name{font-family:var(--f-display);font-size:var(--nf);line-height:1.05}
.card .c-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;color:#6d5c52;border-bottom:1px dashed #c9b894}
.card .c-text{font-size:10.5px;line-height:1.3;padding:5px 6px;flex:1;overflow:hidden;min-height:0;position:relative}
.card .c-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;gap:4px}
/* the square picture carries the type label over its bottom edge, which leaves the ability text more room.
   fitNames() shrinks long ability text, and text that still does not fit ends in an "อ่านเพิ่มเติม" button (opens the zoom) */
.card:not(.t-chaos) .c-art{flex:none}
.card:not(.t-chaos) .c-type{font-size:9px;height:2.1em;line-height:2.1em;margin-top:-2.1em;padding:0 7px;align-self:flex-start;position:relative;z-index:1;
  border:0;border-radius:0 6px 0 0;background:#000b;color:#f3e7cf;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* board cards (Stars, Line-Up, casting arena) share one width */
.boardc{--card-w:140px;--card-h:calc(var(--card-w) * 1.8)}
.boardc .card:not(.t-chaos):not(.mini){width:var(--card-w);height:var(--card-h)}
.card .more-btn{position:absolute;right:0;bottom:0;border:0;padding:1px 6px 0 20px;cursor:zoom-in;
  background:linear-gradient(90deg,transparent,var(--paper) 16px);color:#5a1d14;font:inherit;font-size:10.5px;font-weight:700;text-decoration:underline}

/* card names: at most 2 lines; fitNames() shrinks the font of longer ones */
.card .c-name{display:block;overflow:hidden;max-height:calc(2em * 1.05 + 1px);overflow-wrap:anywhere}
/* Thai names: Pirata One has no Thai, so they use Kanit. Thai vowels and tone marks (ไ ใ โ ู ุ ่ ้ ์) reach far above
   and below the letters, so the lines are taller, the header gets a little taller (--hl) and the name is never clipped
   (padding inside the clipped box leaves room for the marks; fitNames shrinks the text until it fits the header) */

/* characters (avatarHTML): breathe in step with --ph, flinch when hit, stand in a light cone on their turn */

/* ---------------- one-screen stage (desktop / laptop; STAGE_MQ in the script uses the same condition) ----------------
   The table is exactly one window tall. A 3 x 3 grid: rivals' characters stand in the four corners, the shop is the top
   middle, the casting arena spans the middle row, your mat is the bottom middle. Card size comes from the window's width
   AND height (--card-w); the arena and your hand take what height is left (--arena-h, --hand-h). */
@media (min-width:1200px) and (min-height:600px){
html,body{overflow:hidden}
.app{padding:0;gap:0;height:100dvh;min-height:0}
.table{--cw:clamp(104px,8.5vw,170px);--vfix:186px;

  position:relative;isolation:isolate;height:100dvh;min-height:0!important;padding:18px 22px 14px;gap:6px 10px;
  grid-template-columns:var(--cw) minmax(0,1fr) var(--cw);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"tl market tr" "mid mid mid" "bl you br";align-content:stretch}
.stage-bg{display:block;position:absolute;inset:3px;z-index:-1;border-radius:18px;background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2));
  background-size:cover;background-position:center;border:8px solid var(--wood);box-shadow:0 0 0 2px var(--gold) inset}
.boardc,.seats{display:contents}
.boardc{--card-w:inherit;--card-h:inherit}
/* shop row */
.market{grid-area:market;align-self:start;container-type:normal;flex-wrap:nowrap;gap:12px;--card-w:inherit;--card-h:inherit}
.market .mgroup{flex:none}
.star-wrap{position:relative;gap:3px}
.chal{display:block;height:34px;padding:3px 5px;font-size:clamp(10px, calc(var(--card-w) * .1), 12.5px);line-height:14px;overflow:hidden;cursor:help}

.midrow{grid-area:mid;display:grid;grid-template-columns:var(--cw) minmax(0,1fr);gap:10px;align-items:center;min-height:0}

<script>
"use strict";
const $ = s => document.querySelector(s);
// sleep(0) yields through a MessageChannel instead of setTimeout: a hidden tab clamps timers to ~1 s, which made
// all-AI test games (AI_DELAY 0) crawl; a message tick still lets the page paint between steps
const zeroTick = (() => { const ch = new MessageChannel(), q = []; ch.port1.onmessage = () => q.shift()(); return f => { q.push(f); ch.port2.postMessage(0); }; })();
const sleep = ms => new Promise(r => ms > 0 ? setTimeout(r, ms) : zeroTick(r));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let G = null, uidc = 1, AI_DELAY = 650;
const statEvent = () => {}; // no visitor stats in this build
// ME = the seat this browser shows and controls: 0 offline and for the host of an online room, the guest's own seat otherwise
let ME = 0;
const meP = () => G.players[ME];

// card types: the code keeps its own keys (creature, treasure …); players see these names
const TYPE_TH = { starter:'การ์ดเริ่มต้น', spell:'คาถา · Spell', creature:'ปีศาจ · Demon', treasure:'ไอเทมเวท · Magic Item',
  wizard:'นักเวท · Mage', location:'สนามประลอง · Arena', legend:'ดาวเด่น · Star', familiar:'ภูติคู่ใจ · Companion', chaos:'เหตุการณ์สด · Live Event' };
const TYPE_SHORT = { starter:'เริ่มต้น', spell:'คาถา', creature:'ปีศาจ', treasure:'ไอเทมเวท', wizard:'นักเวท', location:'สนามประลอง',
  legend:'ดาวเด่น', familiar:'ภูติคู่ใจ', chaos:'เหตุการณ์สด' };

/* ---------------- card definitions ----------------
   Main-pile cards are all designed. Cards still blank (a picture art/<id>.jpg and a type) use placeholder numbers
   (ดาวเด่น 10 / 4 since 2026-11-09, สนามประลอง 3 / 1) so the table runs while their abilities are designed.
   To give a card an ability: add name, text, power / atk / def … and play: async p => {…} to its def. */
const DEFS = {};
const DUP_IDS = []; // a second def() with the same id silently replaces the first card: simulate() reports these
function def(id, o) {
  if (DEFS[id]) DUP_IDS.push(id); DEFS[id] = { id, name: '', cost: 0, vp: 0, text: '', ...o }; }
function make(id) { return { ...DEFS[id], uid: uidc++ }; }
const P = (p, n) => { G.turn.power += n; if (n > 0) G.turn.gold = (G.turn.gold || 0) + n; }; // gold: earned this turn (Star challenges)
// a card's display name: its own name once it has one, otherwise its type and id (logs and prompts only)
const cn = c => !c ? '' : c.name || `${TYPE_SHORT[c.type] || ''} ${c.id}`;

// starting deck (DESIGN.md): 6 fee + 2 rehearse + the 2 cards of the player's School (setSchool swaps them in)
def('fee', { name:'ค่าตัวนักแข่ง', type:'starter', power:1, text:'+1 ทอง' });
// junk: a knocked-out player gets one (kill). Starter type so it never counts as a card type played; unlimited, not in MAIN
def('leak', { name:'คลิปหลุด', type:'starter', junk:1, vp:-1, typeText:'ขยะ · Junk', text:'ไม่มีผล<br>จบเกม -1 VP<br>ทำลายทิ้งได้ด้วยการ์ดที่ทำลาย' });
def('rehearse', { name:'ซ้อมบนเวที', type:'starter', power:1, playFirst:1, text:'+1 ทอง<br>ถ้าเป็นการ์ดใบแรกที่คุณเล่นในเทิร์นนี้ +1 กระแส',
  play: async p => { if (G.turn.shown.length === 1) addHype(p, 1, cn(DEFS.rehearse)); } });
def('sc_blaze', { name:'ซ้อมยิงไฟ', type:'starter', power:1, atk:1, school:1, text:'+1 ทอง<br><b>โจมตี:</b> คนทางซ้ายรับ 1 ดาเมจ',
  play: async p => attack(p, { to:'left', dmg:1 }) });
def('sc_brew', { name:'การบ้านปรุงยา', type:'starter', power:1, school:1, text:'+1 ทอง<br>ฟื้น 2 HP', play: async p => heal(p, 2) });
def('sc_coin', { name:'คืนค่าเทอม', type:'starter', power:1, school:1, playLate:1, text:'+1 ทอง<br>ถ้าเทิร์นนี้คุณมีทองอย่างน้อย 6 +1 ทอง',
  play: async p => { if (G.turn.power >= 6) P(p, 1); } }); // threshold 7 → 5 → 6 (2026-11-10): balance runs
def('sc_clown', { name:'เบาะผายลมเวท', type:'starter', power:1, school:1, text:'+1 ทอง<br>ทิ้งการ์ดในมือได้ 1 ใบ ถ้าทิ้ง จั่ว 1 ใบ',
  play: async p => {
    if (!p.hand.length) return;
    const c = p.isAI ? p.hand.find(x => x.type === 'starter' && !x.parts) || null
      : await humanChoose(p, `${cn(DEFS.sc_clown)}: ทิ้งการ์ด 1 ใบแล้วจั่ว 1?`, [...p.hand.map(x => ({ card: x, value: x })), { label: 'ไม่ทิ้ง', value: null, ghost: true }]);
    if (!c) return;
    p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); log(`${p.name} ทิ้ง ${cn(c)}`); await draw(p, 1);
  } });
// sc_puppet works on the top of the target's deck, never the hand: a starter card that cut hands from turn 1 was too harsh (2026-11-11)
def('sc_puppet', { name:'ด้ายหุ่นเชิด', type:'starter', power:1, atk:1, school:1,
  text:'+1 ทอง<br><b>โจมตี:</b> เปิดการ์ดบนสุดของเด็คเป้าหมาย คุณเลือกให้ทิ้งหรือวางคืน ถ้าทิ้งการ์ดเริ่มต้น คุณ +1 กระแส ถ้าทิ้งใบอื่น คุณ +1 ทอง',
  play: async p => attack(p, { to:'choose', dmgText:'เปิดการ์ดบนสุดของเด็ค แล้วอาจถูกทิ้ง', dmg: async t => {
    const c = revealTop(t); if (!c) return 0;
    const toss = p.isAI ? true : await humanChoose(p, `${cn(DEFS.sc_puppet)}: การ์ดบนสุดของ ${t.name} · ทิ้งไหม?`,
      [{ card: c, label: 'ทิ้ง', value: 'toss' }, { label: 'วางคืนบนเด็ค', value: 'keep', ghost: true }]) === 'toss';
    if (!toss) { log(`${cn(c)} ถูกวางคืนบนเด็ค ${t.name}`); return 0; }
    t.deck.splice(t.deck.lastIndexOf(c), 1); t.discard.push(c);
    log(`${t.name} ทิ้ง ${cn(c)} จากบนเด็ค`); AUD.play('discard');
    if (c.type === 'starter' && !c.parts) addHype(p, 1, cn(DEFS.sc_puppet)); else P(p, 1);
    puppetHype(p, t);
    return 0;
  } }) });
def('sc_tamer', { name:'ขนมล่อภูติ', type:'starter', power:1, school:1, text:'+1 ทอง<br>ถ้าภูติคู่ใจของคุณเลเวล 2 ขึ้นไป +1 ทอง',
  play: async p => { if ((p.famLv || 1) >= 2) P(p, 1); } });
// a fused card (Fusion): makeFused() fills in parts, name, text and numbers; playing it plays every part in order,
// then its recipe's bonus (RECIPES; a 'pure' one never explodes)
// An unstable one (EXPLODE_AT+ parts, not 'pure') carries heat (self.heat, 0–heatMax): heat in 6 to explode when played,
// +1 ทอง per heat when it doesn't, then +1 heat. From heat 2 its owner may pay 1 Hype to cool it back to 0 first.
def('fused', { type:'spell', play: async (p, self) => {
  if (unstable(self)) {
    const h = self.heat || 0;
    if (h >= 2 && (p.hype || 0) >= 1) {
      const cool = p.isAI ? h >= 3 || (p.hype || 0) >= 6
        : await humanChoose(p, `🔥 ${cn(self)} ร้อน ${h}/${heatMax(p)}`, [
          { label: `❄ ระบายความร้อน · จ่าย 1 กระแส (ความร้อนกลับเป็น 0 ไม่ระเบิด)`, value: true },
          { label: `🔥 เสี่ยงต่อ · +${h} ทอง (โอกาสระเบิด ${h} ใน 6)`, value: false, ghost: true }],
          'ยิ่งร้อนยิ่งได้ทองมาก แต่ก็ยิ่งเสี่ยงระเบิด · ถ้าระเบิด คุณเล็งแรงระเบิดใส่ศัตรูได้ 1 คน');
      if (cool) { addHype(p, -1, 'ระบายความร้อน'); self.heat = 0; log(`❄ ${p.name} ระบายความร้อน ${cn(self)}`); }
    }
    if (!inSchool(p, 'brew') && Math.random() < (self.heat || 0) / 6) return explode(p, self);
  }
  for (const c of self.parts) if (c.play) await c.play(p, c);
  const r = recipeById(self.recipe); if (r && r.run) { G.curLabel = `สูตร${r.name}`; await r.run(p, self); }
  if (unstable(self)) {
    if (self.heat) { P(p, self.heat); log(`🔥 ${cn(self)} ร้อน ${self.heat}: +${self.heat} ทอง`); }
    self.heat = Math.min(heatMax(p), (self.heat || 0) + 1);
  }
} });
// Live Events (เหตุการณ์สด): they share one picture (art/chaos.jpg). When one turns up everyone votes for option a or b
// (liveEvent). ai(p) = how good the option is for p, for the AI's vote. Damage goes through attack(null, …), so it can be defended.
const isTopHype = p => (p.hype || 0) === Math.max(...G.players.map(x => x.hype || 0));
const EVENTS = {
  ev01: { name:'ข่าวด่วนกลางรายการ',
    a: { text:'คนที่กระแสสูงสุดรับ 3 ดาเมจ', ai: p => isTopHype(p) ? -3 : 2,
      run: async () => { await attack(null, { to:'where', where: isTopHype, dmg:3, chaos:true }); } },
    b: { text:'ทุกคน +1 กระแส', ai: () => 1, run: async () => { G.players.forEach(p => addHype(p, 1, 'ข่าวด่วน')); } } },
  ev02: { name:'แจกของรางวัลผู้ชม',
    a: { text:'ทุกคนจั่ว 1 ใบ', ai: () => 2, run: async () => { for (const p of turnOrder()) await draw(p, 1); } },
    b: { text:'ทุกคนฟื้น 3 HP', ai: p => p.hp <= 12 ? 3 : 1, run: async () => { turnOrder().forEach(p => heal(p, 3)); } } },
  ev03: { name:'ผู้ชมอยากเห็นเลือด',
    a: { text:'ทุกคนรับ 2 ดาเมจ', ai: () => -2, run: async () => { await attack(null, { to:'all', dmg:2, chaos:true }); } },
    b: { text:'คนที่ HP มากที่สุดรับ 4 ดาเมจ', ai: p => p.hp === Math.max(...G.players.map(x => x.hp)) ? -4 : 0,
      run: async () => { const m = Math.max(...G.players.map(x => x.hp)); await attack(null, { to:'where', where: t => t.hp === m, dmg:4, chaos:true }); } } },
  ev04: { name:'สปอนเซอร์ถอนตัวกะทันหัน',
    a: { text:'สัญญาสปอนเซอร์ทุกใบถูกยกเลิก ไม่มีค่าปรับ', ai: p => p.contract ? 0 : .5,
      run: async () => { G.players.forEach(p => endContract(p, 'สปอนเซอร์ถอนตัว')); } },
    b: { text:'คนที่ถือสัญญาสปอนเซอร์อยู่ +1 กระแส', ai: p => p.contract ? 1 : 0,
      run: async () => { G.players.filter(p => p.contract).forEach(p => addHype(p, 1, 'สปอนเซอร์ยังอยู่')); } } },
  ev05: { name:'รื้อเวที',
    a: { text:'สนามประลองถูกรื้อ กลับไปกองทิ้งของเจ้าบ้าน', ai: p => isHost(p) ? -2 : 1, run: async () => { clearArena('รื้อเวที'); } },
    b: { text:'เจ้าบ้านสนามประลองเสีย 2 กระแส', ai: p => isHost(p) ? -2 : .5,
      run: async () => { const h = arenaHost(); if (h) addHype(h, -2, 'รื้อเวที'); } } },
  ev06: { name:'โหวตดาวรุ่ง',
    a: { text:'คนที่คะแนนต่ำสุด +2 กระแส', ai: p => scoreOf(p) === Math.min(...G.players.map(scoreOf)) ? 2 : 0,
      run: async () => { const m = Math.min(...G.players.map(scoreOf)); G.players.filter(p => scoreOf(p) === m).forEach(p => addHype(p, 2, 'ดาวรุ่ง')); } },
    b: { text:'คนที่มีไฮไลต์มากที่สุดเสีย 2 กระแส', ai: p => p.highlights && p.highlights === Math.max(...G.players.map(x => x.highlights || 0)) ? -2 : .5,
      run: async () => { const m = Math.max(...G.players.map(x => x.highlights || 0)); if (m) G.players.filter(p => (p.highlights || 0) === m).forEach(p => addHype(p, -2, 'ดาวรุ่ง')); } } },
  ev07: { name:'ช่วงโฆษณาคั่นรายการ',
    a: { text:'ทุกคนจั่ว 2 ใบ แล้วทิ้งการ์ดในมือ 1 ใบ', ai: () => 1.5,
      run: async () => { for (const p of turnOrder()) { await draw(p, 2); await discardFromHand(p, 1); if (!G) return; } } },
    b: { text:'ทุกคน +1 กระแส · คนที่กระแสต่ำสุด +2 แทน', ai: p => (p.hype || 0) === Math.min(...G.players.map(x => x.hype || 0)) ? 2 : 1,
      run: async () => { const m = Math.min(...G.players.map(x => x.hype || 0)); G.players.forEach(p => addHype(p, (p.hype || 0) === m ? 2 : 1, 'ช่วงโฆษณา')); } } },
  ev08: { name:'ภูติคู่ใจขึ้นเวที',
    a: { text:'ภูติของคนที่เลเวลภูติต่ำสุดขึ้น 1 เลเวลฟรี', ai: p => (p.famLv || 1) < 3 && (p.famLv || 1) === minFamLv() ? 3 : 0,
      run: async () => { const m = minFamLv(); if (m >= 3) return;
        for (const p of G.players.filter(x => (x.famLv || 1) === m && x.familiar)) {
          p.famLv = m + 1; log(`⬆ ภูติคู่ใจของ ${p.name} ขึ้นเลเวล ${p.famLv} ฟรี: ${famLevels(p.familiar)[p.famLv - 1].text}`, 'good'); }
        AUD.play('legendUp'); } },
    b: { text:'ทุกคนที่ภูติเลเวล 3 เสีย 2 กระแส', ai: p => (p.famLv || 1) >= 3 ? -2 : .5,
      run: async () => { G.players.filter(p => (p.famLv || 1) >= 3).forEach(p => addHype(p, -2, 'ภูติขึ้นเวที')); } } },
  ev09: { name:'ไฟดับกลางรายการ',
    a: { text:'ทุกคนทิ้งการ์ดแบบสุ่มจากมือ 1 ใบ', ai: () => -1,
      run: async () => { for (const p of turnOrder()) { if (!p.hand.length) continue;
        const c = p.hand.splice(rnd(p.hand.length), 1)[0]; p.discard.push(c); log(`${p.name} ทำ ${cn(c)} หล่นในความมืด`); showRandDiscard(p, [c]); } } },
    b: { text:'เทิร์นนี้ไม่มีใครป้องกันการโจมตีได้', ai: p => p === cur() ? 2 : -1,
      run: async () => { G.turn.noDefense = G.players.slice(); log('เทิร์นนี้ไม่มีใครป้องกันการโจมตีได้'); } } },
  ev10: { name:'สัมภาษณ์ดาวเด่น',
    a: { text:'คนที่มีดาวเด่นมากที่สุดเสีย 2 กระแส', ai: p => starsOf(p) && starsOf(p) === Math.max(...G.players.map(starsOf)) ? -2 : .5,
      run: async () => { const m = Math.max(...G.players.map(starsOf)); if (m) G.players.filter(p => starsOf(p) === m).forEach(p => addHype(p, -2, 'สัมภาษณ์ดาวเด่น')); } },
    b: { text:'คนที่ยังไม่มีดาวเด่นเลย +2 กระแส', ai: p => starsOf(p) ? 0 : 2,
      run: async () => { G.players.filter(p => !starsOf(p)).forEach(p => addHype(p, 2, 'สัมภาษณ์ดาวเด่น')); } } },
  ev11: { name:'ห้องทดลองเปิดให้ชม',
    a: { text:'เทิร์นนี้หลอมการ์ดฟรี', ai: p => p === cur() ? 2 : 0, run: async () => { G.turn.freeFuse = true; log('เทิร์นนี้หลอมการ์ดฟรี'); } },
    b: { text:'ทุกคนที่มีการ์ดหลอม +1 กระแส', ai: p => allCards(p).some(c => c.parts) ? 1 : 0,
      run: async () => { G.players.filter(p => allCards(p).some(c => c.parts)).forEach(p => addHype(p, 1, 'ห้องทดลอง')); } } },
  ev12: { name:'ผู้ชมเปลี่ยนข้าง',
    a: { text:'คนที่กระแสสูงสุดให้ 2 กระแสแก่คนที่กระแสต่ำสุด', ai: p => isTopHype(p) ? -2 : (p.hype || 0) === Math.min(...G.players.map(x => x.hype || 0)) ? 2 : 0,
      run: async () => { const hi = G.players.filter(isTopHype), lo = Math.min(...G.players.map(x => x.hype || 0));
        if ((hi[0].hype || 0) === lo) return;
        const from = hi[rnd(hi.length)], to = G.players.filter(p => (p.hype || 0) === lo), to1 = to[rnd(to.length)];
        const n = Math.min(2, from.hype || 0); addHype(from, -n, 'ผู้ชมเปลี่ยนข้าง'); addHype(to1, n, 'ผู้ชมเปลี่ยนข้าง'); } },

// HP paid or lost (not damage); dropping below 1 kills with no killer
async function loseHP(t, n) {
  if (n <= 0) return;
  t.hp -= n; t.hitFlash = true; log(`${t.name} เสีย ${n} HP (${Math.max(t.hp, 0)} HP)`, 'dmg'); render();
  if (t.hp < 1) await kill(t, null);
}

/* ---------------- helpers ---------------- */
// the battle log is no longer shown on the page (removed 2026-10-16); G.log still keeps the last 200 lines for debugging
function log(msg, cls = '') { G.log.unshift({ msg, cls }); if (G.log.length > 200) G.log.pop(); NET.dirty(); }

const opps = p => G.players.filter(x => x !== p);
const leftOf = p => G.players[(G.players.indexOf(p) + 1) % G.players.length];
const rightOf = p => G.players[(G.players.indexOf(p) - 1 + G.players.length) % G.players.length];
const allCards = p => [...p.deck, ...p.hand, ...p.discard, ...p.ongoing, ...(p === cur() && G.turn ? G.turn.played : [])];
const wait = () => sleep(cur().isAI ? AI_DELAY : 0);

function drawTop(p) {
  if (!p.deck.length) { if (!p.discard.length) return null; p.deck = shuffle(p.discard); p.discard = []; }
  return p.deck.pop();
}
// look at the top card of a deck and leave it there

  const a = await pick('⚗ หลอมการ์ด: เลือกใบแรก', fusable());
  if (!a) return;
  // each partner shows which recipe the pair would make
  const list = fusable().filter(c => c !== a && fuseFits(p, a, c) && fuseCost(p, a, c) <= G.turn.power);
  const b = await humanChoose(p, `⚗ หลอม ${cn(a)} กับใบไหน?`, [...list.map(c => { const r = recipeOf([...partsOf(a), ...partsOf(c)]);
    const sec = secretsHit(p, fusePreview([...partsOf(a), ...partsOf(c)])).map(x => `<span class="fuse-secret">🔒 ${x.by ? 'ตามรอย' : 'ไข'}สูตรลับ: ${secretDef(x.id).text}</span>`).join('');
    return { card: c, value: c, label: (r ? `<span class="fuse-recipe" style="--rc:${r.col}">⚗ สูตร${r.name}: ${r.text}</span>` : '<span class="fuse-none">ไม่เข้าสูตร</span>') + sec }; }),
    { label: 'ยกเลิก', value: null, ghost: true }], 'สูตรขึ้นกับประเภทของการ์ดที่หลอมด้วยกัน · การ์ดหลอมลงกองทิ้งเป็นใบเดียวตอนจบเทิร์น และอยู่ในเด็คถาวร');

// AI: once the deck has grown, merge two starter fees (a thinner deck), otherwise sometimes its two best cards
function aiFuse(p) {
  if (!canFuse(p) || allCards(p).length < 12) return;
  const list = fusable(), fees = list.filter(c => c.id === 'fee');
  if (fees.length >= 2 && fuseCards(p, fees[0], fees[1])) return;
  // otherwise the best pair it can afford, with a recipe counting extra; a 'pure' recipe is safe at 3 parts
  const best = list.filter(c => aiVal(c) > 0);
  let top = null, topScore = -1;
  for (let i = 0; i < best.length; i++) for (let j = i + 1; j < best.length; j++) {
    const a = best[i], b = best[j], parts = [...partsOf(a), ...partsOf(b)], r = recipeOf(parts);
    if (!fuseFits(p, a, b) || fuseCost(p, a, b) > G.turn.power || (parts.length >= EXPLODE_AT && !(r && r.id === 'pure'))) continue;
    const sc = aiVal(a) + aiVal(b) + (r ? 4 : 0) + secretsHit(p, fusePreview(parts)).length * 3;
    if (sc > topScore) { top = [a, b, r]; topScore = sc; }
  }
  if (top && (top[2] || Math.random() < .6)) fuseCards(p, top[0], top[1]);
}

const sponsorOf = id => SPONSORS.find(s => s.id === id);

const canSponsor = (p, i) => p === cur() && !p.contract && i < Math.min(SPONSOR_SHOW, G.sponsors.length) && G.turn.power >= SPONSOR_COST;
async function signSponsor(p, i) {

  G.turn.power -= SPONSOR_COST;

  log(`📜 ${p.name} เซ็นสัญญากับ ${s.name} (${SPONSOR_COST} ทอง)`, 'sys');

function endContract(p, why) {

    endContract(p); log(`📜 ${p.name} ทำสัญญา ${s.name} ครบ!`, 'good'); addHype(p, 1, 'ทำสัญญาครบ');

// a Live Event vote: everyone at once (humans in their own dialog), each vote weighs 1 + 1 per 4 Hype; a tie goes the
// way the turn player voted
const voteWeight = p => 1 + Math.floor((p.hype || 0) / 4) + (inSchool(p, 'puppet') ? 1 : 0);
// the vote dialog dressed as a live broadcast: a LIVE badge, the event name as the headline, A and B as two game-show
// podiums (.vote-pick in the sub switches the dialog's look, on guests' screens too)
function voteSub(p) {
  const h = Math.floor((p.hype || 0) / 4), why = ['1', h ? `${h} จากกระแส` : '', inSchool(p, 'puppet') ? '1 หุ่นเชิด' : ''].filter(Boolean).join(' + ');
  return `<div class="vote-pick"><div class="vp-kick">เหตุการณ์สด · ทุกคนโหวตพร้อมกัน</div>
    <div class="vp-weight">เสียงของคุณ <b>×${voteWeight(p)}</b> <small>(${why} · ทุก 4 กระแส +1 เสียง)</small></div></div>`;
}
const voteOpt = (k, text) => `<span class="vo-letter">${k}</span><span class="vo-text">${text}</span><span class="vo-go">โหวต ${k}</span>`;
async function liveEvent(id) {
  const ev = EVENTS[id];
  const votes = await Promise.all(G.players.map(async p => {
    if (p.isAI) return ev.a.ai(p) >= ev.b.ai(p) ? 'a' : 'b';
    const v = await humanChoose(p, ev.name, [{ label: voteOpt('A', ev.a.text), value:'a' }, { label: voteOpt('B', ev.b.text), value:'b' }], voteSub(p));
    return v || (ev.a.ai(p) >= ev.b.ai(p) ? 'a' : 'b'); // a guest who left votes like the AI
  }));
  if (!G) return;
  const sum = k => G.players.reduce((s, p, i) => s + (votes[i] === k ? voteWeight(p) : 0), 0);
  const sa = sum('a'), sb = sum('b'), win = sa > sb ? 'a' : sb > sa ? 'b' : votes[G.cur];
  const opt = ev[win];
  log(`🗳 โหวต ${ev.name}: A ${sa} · B ${sb} → ${win.toUpperCase()} · ${opt.text}`, 'sys');
  await FX.vote({ name: ev.name, a: ev.a.text, b: ev.b.text, sa, sb, win, tie: sa === sb,
    voters: G.players.map((p, i) => ({ n: p.name, c: p.color, v: votes[i], w: voteWeight(p) })) });

  await opt.run();
  render();
}

  /* music: a war-film score in D minor, 16 bars (~46 s) in four 4-bar sections that build up:
     A strings ostinato + choir (war horn call) · B + taiko, snare fills, low pedal, men's choir, timpani rolls ·
     C + horn theme, braam, war horn, trombones, war drum, violin 16ths · D climax (Gm–Bb–A–A) + brass stabs.

  const STEP = 60 / 84 / 2;                                  // one 8th note
  const CH = {                                               // r = bass root, tri = choir voicing
    Dm: { r: 38, tri: [62, 65, 69] }, Bb: { r: 34, tri: [62, 65, 70] }, F: { r: 41, tri: [60, 65, 69] },
    C: { r: 36, tri: [60, 64, 67] }, Gm: { r: 43, tri: [62, 67, 70] }, A: { r: 45, tri: [61, 64, 69] },

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.setValueAtTime(v, t + a + h); g.gain.exponentialRampToValueAtTime(.0001, t + a + h + r);

    noise({ t, d: .14, v: v * .45, filter: 'lowpass', f0: 800, f1: 90, b: 'mus', w: .4 });
  }
  function snare(t, v) {
    noise({ t, a: .002, d: .13, v, filter: 'bandpass', f0: 2600, q: .8, b: 'mus', w: .3 });
    tone('triangle', 230, { t, to: 160, d: .07, v: v * .4, b: 'mus', w: .2 });
  }
  function musicStep(t, s) {
    const cb = Math.floor(s / 8) % 16, sec = cb >> 2, bar = cb % 4, b = s % 8, battle = !!(G && !G.over);

      if (lv >= 2) choir(ch.tri.map(m => m - 12), t, STEP * 8, lv >= 3 ? .045 : .035, 'mus');
      if (lv >= 3) [ch.r, ch.r + 7, ch.r + 12].forEach(m => [-6, 6].forEach(dt =>

        [-5, 5].forEach(dt => held('sawtooth', N(ch.r + 12 + iv), { t: t + at * STEP, a: .15, h: len * STEP, r: .9, v: .035, f0: 300, f1: 1100, q: 1.6, detune: dt, w: .9 })));
      // section start: timpani boom, crash, and a brass "braam" from section C on
      if (bar === 0 && lv >= 2) {
        tone('sine', 62, { t, to: 31, d: 2.2, v: .55, b: 'mus', w: .5 });
        if (lv >= 3) {
          cymbal(t, .1, 'mus');
          [0, 7, 12].forEach(m => [-8, 8].forEach(dt => held('sawtooth', N(ch.r + m), { t, a: .12, h: STEP * 10, r: 1.6, v: .028, f0: 160, f1: 1500, q: 2, detune: dt, w: .6 })));
        }

      if (bar === 3 && lv >= 2) noise({ t, a: STEP * 8 - .05, d: .12, v: .1, filter: 'bandpass', f0: 500, f1: 7000, q: .7, b: 'mus', w: .6 });

      if (sec >= 2) {

        for (const [m, len] of THEME[(sec - 2) * 4 + bar]) {
          const o = { t: t + at * STEP, a: .07, h: len * STEP - .1, r: .35, f0: 450, f1: 1500, q: 1.2, w: .6 };
          [m, m - 12].forEach(n => [-7, 7].forEach(dt => held('sawtooth', N(n), { ...o, v: .03 * loud, detune: dt })));
          if (lv >= 4) held('sawtooth', N(m + 12), { ...o, v: .012, f0: 900, f1: 2600 });
          at += len;

      }
    }
    // driving low-string 16ths, brighter and louder as the sections build
    for (let k = 0; k < 2; k++) {
      const i = b * 2 + k, tt = t + k * STEP / 2;
      tone('sawtooth', N(ch.r + 12 + OST[i]), { t: tt, a: .006, d: .15, v: (ACC[i] ? .055 : .03) * (lv >= 2 ? 1 : .7), filter: 'lowpass', f0: 600 + lv * 450, f1: 220, b: 'mus', w: .15 });
      if (lv >= 2) {
        const tv = TAIKO[i] || (lv >= 4 && TAIKO4[i]) || (bar === 3 && i >= 12 && .3 + (i - 12) * .13);
        if (tv) taiko(tt, tv);
      }
      if (lv >= 3 && SNARE[i]) snare(tt, SNARE[i]);
      // a huge war drum under the taiko on the downbeats from C
      if (lv >= 3 && (i === 0 || i === 8)) tone('sine', 58, { t: tt, to: 28, d: 1.1, v: .5, b: 'mus', w: .6 });
      // violins: fast 16th arpeggios high above from C (louder in the climax)
      if (lv >= 3) tone('sawtooth', N(ch.tri[[0, 1, 2, 1][i % 4]] + 12 + (i >= 8 ? 12 : 0) * (lv >= 4 ? 1 : 0)), { t: tt, a: .004, d: .09, v: lv >= 4 ? .02 : .014, filter: 'lowpass', f0: 3200, f1: 1500, b: 'mus', w: .5 });
      // brass stabs on the 3+3+2 accents in the climax
      if (lv >= 4 && k === 0 && (b === 0 || b === 3 || b === 6)) brass(ch.tri.map(m => m - 12), tt, .22, .05, 'mus');
      // timpani roll into every section from B
      if (lv >= 2 && bar === 3 && i >= 8) tone('sine', N(ch.r), { t: tt, to: N(ch.r) * .8, d: .18, v: .12 + (i - 8) * .04, b: 'mus', w: .4 });
      if (lv >= 3 && bar === 3 && i >= 8) snare(tt, .05 + (i - 8) * .025);  // snare roll into the next section
    }

/* ---------------- visual FX ---------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)');

// drifting embers behind the table; surge() makes them flare on big moments
const Embers = (() => {
  const cv = $('#embers'), cx = cv.getContext('2d');
  let boost = 0, last = 0;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const mk = y => ({ x: Math.random() * cv.width, y: y != null ? y : cv.height + 10, r: .6 + Math.random() * 2, v: .2 + Math.random() * .6,
    sw: Math.random() * 6.28, h: 12 + Math.random() * 30, a: .3 + Math.random() * .5 });

    requestAnimationFrame(frame);
    if (document.hidden) return;
    if (RM.matches) { if (last) { cx.clearRect(0, 0, cv.width, cv.height); last = 0; } return; }
    const dt = Math.min(3, (now - last) / 16.7 || 1); last = now;

      if (p.y < -10) Object.assign(p, mk());
      const fl = .6 + .4 * Math.sin(now / 180 + p.sw * 7), R = p.r * (1 + boost) * 4;
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, `hsla(${p.h},100%,65%,${p.a * fl})`); g.addColorStop(1, `hsla(${p.h},100%,50%,0)`);
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, R, 0, 6.283); cx.fill();
    }

  requestAnimationFrame(frame);
  return { surge() { boost = 1.5; } };
})();

// one-shot effects drawn on #fx; awaited ones pace the game, slower/faster with the AI speed setting
const FX = (() => {
  const pace = () => { const p = G && cur(); return p && p.isAI ? Math.max(.25, Math.min(1.6, AI_DELAY / 650)) : 1; };
  const T = ms => Math.round(ms * pace());
  // attack shots (FX.strike, windup, bolt) run slower than the other effects so they can be followed by eye
  const ATK_SLOW = 1.7, TA = ms => T(ms * ATK_SLOW);
  const px = v => typeof v === 'number' ? v + 'px' : v;
  let chaosOpen = null; // resolves when this screen's Live Event showcase is closed
  // a big showcase waits for a left click; online it also closes by itself, or one player away from the screen would hold
  // up the whole table (the host's game waits for the host's own click)
  const SHOW_ONLINE_MS = 6000;
  const showHint = () => NET.role ? 'คลิกเพื่อปิด หรือรอ 6 วินาที' : 'คลิกซ้ายที่ใดก็ได้เพื่อปิด';
  const closed = box => new Promise(r => {
    box.addEventListener('pointerdown', e => { if (e.button === 0) r(); });
    if (NET.role) setTimeout(r, SHOW_ONLINE_MS);
  });
  const chaosZoom = () => Math.max(1.2, Math.min(2.4, innerHeight * .55 / 190, innerWidth * .8 / 132)).toFixed(2);
  function spawn(cls, x, y, text) {
    const el = document.createElement('div');
    el.className = 'fx ' + cls; el.style.left = px(x); el.style.top = px(y);
    if (text != null) el.textContent = text;
    $('#fx').appendChild(el);
    return el;
  }
  function fire(el, kf, o) {
    const done = () => el.remove();
    el.animate(kf, { fill: 'both', ...o }).onfinish = done;
    setTimeout(done, o.duration + (o.delay || 0) + 400); // backstop if the animation never finishes (hidden tab)
  }
  const clampPt = (x, y) => ({ x: Math.min(innerWidth - 40, Math.max(40, x)), y: Math.min(innerHeight - 40, Math.max(40, y)) });
  const seat = p => p && G ? document.querySelector(`[data-pi="${G.players.indexOf(p)}"]`) : null;
  function at(p) {
    const s = seat(p), el = s || $('.market');
    if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
    const r = el.getBoundingClientRect();
    return clampPt(r.left + r.width / 2, s ? r.top + r.height / 2 : r.top + 60);
  }
  // a spray of streaking sparks plus a few soft glows (canvas); rise > 0 floats them up instead of letting them fall
  function sparks(x, y, color, n = 14, spread = 90, size = 8, rise = 0) {
    VFX.burst(x, y, { n: Math.ceil(n * .8), color: [color, color, '#fff3d6'], speed: spread * 3.4, size: size * .3, life: .6, g: rise ? -rise * 3 : 380, drag: .9 });
    VFX.burst(x, y, { n: Math.ceil(n * .35), color, kind: 'glow', speed: spread * 1.4, size: size * 1.1, life: .5, g: -rise * 2, drag: .9, grow: .3 });
  }
  function shake(n) {
    if (RM.matches || n <= 0) return;
    const k = [];
    for (let i = 0; i < 7; i++) { const f = n * (1 - i / 7); k.push({ transform: `translate(${(Math.random() - .5) * 2 * f}px,${(Math.random() - .5) * 2 * f}px)` }); }
    k.push({ transform: 'none' });
    $('#app').animate(k, { duration: 420, easing: 'ease-out' });
  }
  function seatFlash(p, color) {
    const el = seat(p); if (!el) return;
    const r = el.getBoundingClientRect(), f = spawn('seatflash', r.left, r.top);
    f.style.width = r.width + 'px'; f.style.height = r.height + 'px'; f.style.background = color;
    fire(f, [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 0 }], { duration: 650 });
  }
  function float(p, text, cls, size) {
    const { x, y } = at(p), el = spawn('float ' + cls, x + (Math.random() - .5) * 40, y - 10, text);
    if (size) el.style.fontSize = size + 'px';
    fire(el, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: 'translate(-50%,-80%) scale(1.35)', opacity: 1, offset: .15 },
      { transform: 'translate(-50%,-110%) scale(1)', opacity: 1, offset: .6 },
      { transform: 'translate(-50%,-190%) scale(.9)', opacity: 0 }], { duration: 1700, easing: 'ease-out' });
    return el;
  }
  const screen = (cls, kf, ms) => fire(spawn('screen ' + cls, 0, 0), kf, { duration: ms });
  const pulse = [{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 0 }];
  function banner(title, sub, kind, ms) {
    const el = spawn('banner ' + kind, 0, '42%');
    const t = document.createElement('div'); t.className = 'b-title'; t.textContent = title; el.appendChild(t);
    if (sub) { const s = document.createElement('div'); s.className = 'b-sub'; s.textContent = sub; el.appendChild(s); }
    fire(el, [{ opacity: 0, transform: 'translateY(-50%) scaleY(.2)' }, { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .12 },
      { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .8 }, { opacity: 0, transform: 'translateY(-50%) scaleY(1.1)' }],
      { duration: ms, easing: 'ease-out' });
    return sleep(ms * .8);
  }

  // full-screen storm canvas: slanted rain + branching lightning strikes (each with thunder + flash); returns stop()
  function storm() {
    const cv = document.createElement('canvas');
    cv.className = 'fx storm-cv'; cv.width = innerWidth; cv.height = innerHeight;
    $('#fx').appendChild(cv);
    const g = cv.getContext('2d'), W = cv.width, H = cv.height;
    const rain = Array.from({ length: 180 }, () => ({ x: Math.random() * W * 1.2, y: Math.random() * H, l: 14 + Math.random() * 18, v: 16 + Math.random() * 12 }));
    const bolts = [];
    // midpoint displacement gives the jagged lightning shape
    function path(x0, y0, x1, y1, spread) {
      let pts = [[x0, y0], [x1, y1]];
      for (let gen = 0; gen < 6; gen++, spread /= 2) {
        const n = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          n.push([(ax + bx) / 2 + (Math.random() - .5) * spread, (ay + by) / 2 + (Math.random() - .5) * spread * .3], pts[i]);
        }
        pts = n;
      }
      return pts;
    }
    function strike(now) {
      // half the strikes land around the showcased card in the middle
      const near = Math.random() < .5;
      const x0 = Math.random() * W, x1 = near ? W / 2 + (Math.random() - .5) * Math.min(W * .5, 420) : Math.random() * W;
      const y1 = near ? H * (.3 + Math.random() * .4) : H * (.65 + Math.random() * .35);
      const main = path(x0, -10, x1, y1, Math.min(260, W * .25));
      const lines = [main];
      for (let b = 0; b < 1 + Math.floor(Math.random() * 3); b++) {
        const [sx, sy] = main[8 + Math.floor(Math.random() * (main.length - 16))];
        lines.push(path(sx, sy, sx + (Math.random() - .5) * 320, sy + 80 + Math.random() * 180, 90));
      }
      bolts.push({ lines, born: now, life: 380 });
      AUD.play('thunder', near);
      screen('flash', [{ opacity: 0 }, { opacity: near ? .45 : .28, offset: .1 }, { opacity: 0 }], 260);
      if (near) shake(7);
    }
    let next = performance.now() + 150, stopping = 0, raf;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!stopping && now >= next) { strike(now); next = now + 220 + Math.random() * 520; }
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(190,180,255,.28)'; g.lineWidth = 1.2; g.beginPath();
      for (const d of rain) {
        d.y += d.v; d.x -= d.v * .25;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * W * 1.2; }
        g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .25, d.y - d.l);
      }
      g.stroke();
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i], age = now - b.born;
        if (age > b.life) { bolts.splice(i, 1); continue; }
        const a = (1 - age / b.life) * (age < 70 || Math.random() > .35 ? 1 : .35); // flicker
        b.lines.forEach((pts, k) => {
          for (const [w, col] of [[k ? 5 : 10, `rgba(170,110,255,${a * .35})`], [k ? 1.2 : 2.6, `rgba(255,255,255,${a})`]]) {
            g.lineWidth = w; g.strokeStyle = col; g.shadowColor = '#c9a0ff'; g.shadowBlur = 24;
            g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          }
        });
        g.shadowBlur = 0;
      }
    }
    raf = requestAnimationFrame(frame);
    return () => {
      stopping = 1;
      cv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => { cancelAnimationFrame(raf); cv.remove(); };
      setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 900);
    };
  }

  // --- attack styles for FX.strike (from: {x,y}, to: {x,y}, t: the target player) ---
  // a player's attack looks like their School's magic; attacks with no attacker (Stars, Live Events) keep the meteor / lightning
  const { rnd2, pick, rgba } = VFX, TAU = Math.PI * 2;
  const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  // the shared hit: white-hot flash, a shockwave ring, streaking sparks and a few soft glows (k scales it)
  function impact(b, col, hot = '#fff3c4', k = 1) {
    VFX.flash(b.x, b.y, 70 * k, col, .32); VFX.flash(b.x, b.y, 28 * k, '#ffffff', .16);
    VFX.ring(b.x, b.y, { r0: 10, r1: 95 * k, color: col, width: 6 * k, life: .45 });
    VFX.burst(b.x, b.y, { n: 22 * k, color: [col, col, hot], speed: 560 * k, size: 2.6, life: .55, g: 380 });
    VFX.burst(b.x, b.y, { n: 7 * k, color: col, kind: 'glow', speed: 150, size: 14, life: .5, grow: .2 });
  }
  // part of a quadratic curve a → c → b, from 0 to k, as points (wobble: a shiver in px)
  const qPts = (a, c, b, k, wob = 0, t = 0) => Array.from({ length: 25 }, (_, j) => {
    const u = j / 24 * k, s = Math.sin(j * .9 + t * 40) * wob * Math.sin(Math.PI * j / 24);
    return [(1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * c.x + u * u * b.x + s, (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * c.y + u * u * b.y + s];
  });
  const stroke = (g, pts, col, w) => {
    for (const [lw, c] of [[w * 3, rgba(col, .3)], [w, rgba(col, 1)], [w * .35, '#fff']]) {
      g.lineWidth = lw; g.strokeStyle = c; g.lineCap = g.lineJoin = 'round';
      g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    }
  };
  // a quick rake of slashes across a point (a = angle); used by the spirit beast and big hits
  function slashes(b, col, n = 3, ang = -.9, len = 80, gap = 18) {
    for (let i = 0; i < n; i++) {
      const ox = (i - (n - 1) / 2) * gap * Math.sin(ang + Math.PI / 2), oy = (i - (n - 1) / 2) * gap * -Math.cos(ang + Math.PI / 2);
      const dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
      VFX.add({ x: b.x + ox, y: b.y + oy, life: .38, delay: i * .045, fade: 1.5, draw(g, p, u) {
        const k = Math.min(1, u * 4), w = 7 * (1 - u * .7);
        stroke(g, [[p.x - dx, p.y - dy], [p.x - dx + dx * 2 * k, p.y - dy + dy * 2 * k]], col, w);
      } });
    }
  }
  const SCHOOL_COL = { blaze: '#ff7a2a', brew: '#5dd36a', coin: '#f0c35a', clown: '#ff6fb5', puppet: '#b46cff', tamer: '#4fe0b8' };

  async function fireball(a, b) {                        // Blaze: a roaring fireball with a smoky flame tail, then an explosion
    AUD.local('zap');
    await VFX.travel(a, b, TA(480), { lift: Math.min(120, dist(a, b) * .22), ease: u => u * u * (1.7 - .7 * u), head(x, y) {
      VFX.add({ x, y, kind: 'glow', color: '#ff7a1f', size: 30, grow: .15, life: .32 });
      VFX.add({ x, y, kind: 'glow', color: '#ffd27a', size: 13, grow: .1, life: .14 });
      if (Math.random() < .4) VFX.add({ x: x + rnd2(-8, 8), y: y + rnd2(-8, 8), vx: rnd2(-40, 40), vy: rnd2(-70, -10), kind: 'glow', color: pick(['#ff5a1f', '#ffa53d']), size: 8, grow: .1, life: .55 });
      if (Math.random() < .1) VFX.smoke(x, y, { n: 1, size: 14, life: .8, a: .55, rise: 40, speed: 20, color: '#2a1a14' });
    } });
    AUD.local('boom');
    impact(b, '#ff7a2a', '#ffe08a', 1.15);
    VFX.smoke(b.x, b.y, { n: 7, color: '#2b1d1a', size: 30, rise: 50, speed: 90 });
    VFX.burst(b.x, b.y, { n: 16, kind: 'glow', color: ['#ff9a3d', '#ffcf6a'], speed: 140, size: 5, g: -170, life: 1.3, drag: .95 });
    shake(5);
  }
  async function potion(a, b) {                          // Brew: a spinning flask lobbed high; it smashes in a splash of glass and bubbling brew
    AUD.local('whoosh');
    const fl = VFX.add({ x: a.x, y: a.y, kind: 'bottle', color: '#5dd36a', size: 18, keep: 1, life: 9, vr: 9, fade: 0, add: false });
    await VFX.travel(a, b, TA(580), { lift: Math.min(220, dist(a, b) * .5), head(x, y) {
      fl.x = x; fl.y = y;
      VFX.add({ x, y, kind: 'glow', color: '#5dd36a', size: 22, grow: .3, life: .22 });
      if (Math.random() < .6) VFX.add({ x, y, vx: rnd2(-30, 30), vy: rnd2(-30, 30), kind: 'star', color: '#9dffb0', size: 2.2, life: .5 });
    } });
    fl.life = 0; AUD.local('shatter');
    impact(b, '#5dd36a', '#e6ffd6', .9);
    VFX.burst(b.x, b.y, { n: 12, kind: 'shard', color: '#c8ffd8', speed: 380, size: 6, g: 900, life: .8, add: false, spin: 12 });
    VFX.burst(b.x, b.y, { n: 26, color: ['#5dd36a', '#9dff7a'], speed: 460, size: 3, g: 1000, life: .8, dir: -Math.PI / 2, spread: 2.6 });
    VFX.ring(b.x, b.y + 18, { r0: 10, r1: 110, color: '#5dd36a', width: 5, life: .55, flat: .35 });
    VFX.smoke(b.x, b.y, { n: 6, color: '#3f9a4a', size: 30, a: .5, rise: 35 });
    VFX.burst(b.x, b.y, { n: 12, kind: 'bubble', color: '#9dffb0', speed: 70, size: 5, g: -110, life: 1.5, drag: .96, add: false, jitter: 30 });
  }
  async function coinVolley(a, b) {                      // Coin: a volley of spinning gold coins pelting the target
    AUD.local('whoosh');
    const d = dist(a, b);
    await Promise.all(Array.from({ length: 6 }, (_, i) => sleep(TA(i * 55)).then(() => {
      const c = VFX.add({ x: a.x, y: a.y, kind: 'coin', size: 13, keep: 1, life: 9, vr: 14, fade: 0, add: false });
      const to = { x: b.x + rnd2(-26, 26), y: b.y + rnd2(-18, 18) };
      return VFX.travel(a, to, TA(420), { lift: d * (.12 + i * .06), ease: u => u * u, head(x, y) {
        c.x = x; c.y = y;
        VFX.add({ x, y, kind: 'glow', color: '#f0c35a', size: 16, grow: .3, life: .2 });
        if (Math.random() < .3) VFX.add({ x, y, kind: 'star', color: '#ffe39a', size: 2.4, life: .45, vx: rnd2(-20, 20), vy: rnd2(-20, 20) });
      } }).then(() => {
        c.life = 0; AUD.local('coin');
        VFX.flash(to.x, to.y, 24, '#f0c35a', .2);
        VFX.burst(to.x, to.y, { n: 6, color: ['#ffe39a', '#f0c35a'], speed: 280, size: 2, life: .35, g: 300 });
      });
    })));
    impact(b, '#f0c35a', '#fff3c4', .8);
    VFX.burst(b.x, b.y, { n: 12, kind: 'star', color: ['#ffe39a', '#ffffff'], speed: 240, size: 3.5, life: .8, drag: .9 });
    VFX.burst(b.x, b.y, { n: 7, kind: 'coin', speed: 300, size: 6, g: 1100, life: .9, spin: 16, add: false, dir: -Math.PI / 2, spread: 2.4 });
  }
  async function cardToss(a, b) {                        // Clown: three playing cards fanned out and flung, then a confetti "ta-da"
    AUD.local('whoosh');
    const d = dist(a, b);
    await Promise.all([0, 1, 2].map(i => sleep(TA(i * 70)).then(() => {
      const c = VFX.add({ x: a.x, y: a.y, kind: 'card', size: 20, keep: 1, color: ['#ff6fb5', '#ffd27a', '#7ad7ff'][i], suit: i, life: 9, vr: i % 2 ? 12 : -12, fade: 0, add: false });
      const to = { x: b.x + (i - 1) * 26, y: b.y + rnd2(-12, 12) };
      return VFX.travel(a, to, TA(480), { lift: d * (.16 + i * .08) + 30, wave: 16, head(x, y) {
        c.x = x; c.y = y;
        VFX.add({ x, y, kind: 'glow', color: c.color, size: 14, life: .3, grow: .2 });
      } }).then(() => { c.life = 0; });
    })));
    AUD.local('boom');
    impact(b, '#ff6fb5', '#ffffff', .85);
    VFX.burst(b.x, b.y, { n: 48, kind: 'confetti', color: ['#ff6fb5', '#ffd23f', '#5ad1ff', '#8cff6a', '#c58bff'], speed: 560, size: 5, g: 560, drag: .93, life: 1.7, add: false, spin: 4, fade: .6, dir: -Math.PI / 2, spread: 3.4 });
    VFX.smoke(b.x, b.y, { n: 6, color: '#ff9fd0', size: 26, a: .5, rise: 20 });
  }
  async function strings(a, b) {                         // Puppet: glowing puppet strings reach out, catch the target and yank
    AUD.local('beam');
    const col = '#b46cff', reach = TA(380) / 1000;
    for (let i = 0; i < 3; i++) {
      const to = { x: b.x + (i - 1) * 24, y: b.y - 6 + rnd2(-8, 8) };
      const c = { x: (a.x + to.x) / 2 + rnd2(-70, 70), y: Math.min(a.y, to.y) - 70 - i * 35 };
      VFX.add({ x: 0, y: 0, life: reach + .45, fade: .7, draw(g, p) {
        const k = Math.min(1, p.t / reach), pts = qPts(a, c, to, k, k < 1 ? 3 : 1.2 + (p.t - reach) * 8, p.t);
        stroke(g, pts, col, 2.2);
        const [hx, hy] = pts[pts.length - 1];
        g.fillStyle = '#fff'; g.beginPath(); g.arc(hx, hy, 3.5, 0, TAU); g.fill();
      } });
    }
    await sleep(TA(380));
    AUD.local('slash');
    impact(b, col, '#f1d9ff', 1);
    VFX.sigil(b.x, b.y + 14, { r: 62, color: col, life: .9, flat: .45 });
    VFX.smoke(b.x, b.y, { n: 8, color: '#3a1458', size: 28, a: .75, rise: 40 });
    VFX.burst(b.x, b.y, { n: 10, kind: 'glow', color: '#d6a8ff', speed: 90, size: 6, g: -130, life: 1.1, drag: .95 });
    shake(4);
  }
  async function spirit(a, b) {                          // Tamer: a glowing spirit beast weaves through the air, rakes with its claws, leaves scatter
    AUD.local('whoosh');
    await VFX.travel(a, b, TA(640), { lift: 50, wave: 46, waves: 3, ease: u => u * u * (3 - 2 * u), head(x, y) {
      VFX.add({ x, y, kind: 'glow', color: '#5ef0c8', size: 24, grow: .1, life: .26 });
      if (Math.random() < .35) VFX.add({ x: x + rnd2(-6, 6), y: y + rnd2(-6, 6), vx: rnd2(-25, 25), vy: rnd2(-25, 25), kind: 'glow', color: '#b6ffe6', size: 6, grow: .2, life: .7 });
      if (Math.random() < .05) VFX.add({ x, y, kind: 'leaf', color: pick(['#5fae4a', '#8fd16a', '#3d8a3a']), size: 6, vx: rnd2(-40, 40), vy: rnd2(-20, 20), g: 60, drag: .97, vr: rnd2(-4, 4), life: 1.2, add: false });
    } });
    AUD.local('slash');
    slashes(b, '#4fe0b8');
    impact(b, '#4fe0b8', '#eafff6', .85);
    VFX.burst(b.x, b.y, { n: 14, kind: 'leaf', color: ['#5fae4a', '#8fd16a', '#3d8a3a'], speed: 320, size: 6, g: 220, drag: .94, life: 1.5, add: false, spin: 5, fade: .6 });
    VFX.burst(b.x, b.y, { n: 10, kind: 'glow', color: '#d8ff7a', speed: 80, size: 4, g: -15, life: 2, drag: .97, jitter: 20 });
  }
  async function orbShot(a, b, t, color) {               // no School: a sparkling magic orb on an arc
    AUD.local('zap');
    await VFX.travel(a, b, TA(440), { lift: Math.min(180, dist(a, b) * .35), ease: u => u * u, head(x, y) {
      VFX.add({ x, y, kind: 'glow', color, size: 20, grow: .2, life: .25 });
      if (Math.random() < .6) VFX.add({ x, y, vx: rnd2(-30, 30), vy: rnd2(-30, 30), kind: 'star', color: pick([color, '#ffffff']), size: 2.2, life: .45 });
    } });
    impact(b, color, '#ffffff', .9);
  }
  async function meteor(a, b) {                          // a Star's attack: a meteor drops from the top of the screen with a fire trail
    const s = { x: b.x + (b.x < innerWidth / 2 ? -240 : 240), y: -60 };
    AUD.local('fall');
    await VFX.travel(s, b, TA(560), { ease: u => u * u, head(x, y) {
      VFX.add({ x, y, kind: 'glow', color: '#ff5a2a', size: 40, grow: .2, life: .4 });

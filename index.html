async function pickTarget(p, list, spec) {
  if (list.length === 1) return list[0];
  if (p.isAI) {
    if (list.length > 1) list = list.filter(t => t !== p); // the AI never targets itself
    const d = typeof spec.dmg === 'number' ? spec.dmg : 0;
    const killable = list.filter(t => t.hp <= d);
    const pool = killable.length ? killable : list;
    return pool.slice().sort((a, b) => a.hp - b.hp || (b.isAI ? -1 : 1))[0];
  }
  return humanChoose(p, spec.label || `เลือกเป้าหมาย (${G.curLabel})`, list.map(t => ({ label: `${t === p ? 'ตัวคุณเอง' : t.name} · ${t.hp} HP`, value: t })));
}

async function attack(src, spec) {
  const pool = src && !spec.includeSelf ? opps(src) : G.players.slice(); // includeSelf: the attacker may pick themself
  let targets = [];
  switch (spec.to) {
    case 'choose': targets = [await pickTarget(src, spec.among ? pool.filter(spec.among) : pool, spec)]; break; // among: limit who can be picked
    case 'left': targets = [leftOf(src)]; break;
    case 'right': targets = [rightOf(src)]; break;
    case 'random': targets = [pool[rnd(pool.length)]]; break;
    case 'where': targets = pool.filter(spec.where); break; // every opponent matching spec.where(t)
    case 'lr': { const l = leftOf(src), r = rightOf(src); targets = l === r ? [l] : [l, r]; break; }
    case 'each': case 'all': targets = pool; break;
    case 'strongest': case 'weakest': {
      const f = spec.to === 'strongest' ? Math.max : Math.min;
      const m = f(...pool.map(x => x.hp)); const c = pool.filter(x => x.hp === m);
      targets = [src && c.length > 1 ? await pickTarget(src, c, spec) : c[0]]; break;
    }
  }
  targets = targets.filter(Boolean);
  if (src && src === cur()) G.turn.attacked = true;
  const color = !spec.dmg ? '#59c2c7' : spec.chaos ? '#c27dff' : src ? '#ff7a3d' : '#ff3355';
  if (src && G.curCard) await FX.windup(G.curCard);
  // what the shot looks like follows what attacked (see FX.strike); hitting everyone (or 3+) is one shockwave
  const atkCard = src ? G.curCard : null;
  const kind = !src ? (spec.chaos ? 'chaos' : 'legend')
    : !atkCard ? 'spell' : atkCard.type === 'legend' ? 'legend' : atkCard.type === 'familiar' ? 'creature'
    : ['spell', 'creature', 'wizard', 'treasure'].find(ty => isType(atkCard, ty)) || 'spell';
  const wave = targets.length > 1 && (spec.to === 'each' || spec.to === 'all' || targets.length >= 3);
  // big: 4+ damage known up front (a dmg worked out per target can't be told before defence)
  await FX.strike(src, targets, kind, color, atkCard, wave, typeof spec.dmg === 'number' && spec.dmg + (atkCard && atkCard.recipe === 'combo' ? 1 : 0) >= 4);
  let kills = 0, dealtTotal = 0;
  // unblockable: this attack can't be dodged; G.turn.nextUnblockable: the next attack this turn can't be
  let unblock = spec.unblockable;
  if (!unblock && src && src === cur() && G.turn.nextUnblockable) { unblock = true; G.turn.nextUnblockable = false; log('การโจมตีนี้หลบไม่ได้!', 'sys'); }
  for (const t of targets) {
    const d = unblock ? null : await tryDefend(t, src, spec);
    if (d && spec.onDodge) await spec.onDodge(t); // onDodge(t): target avoided or reflected the attack
    if (d === 'avoid') continue;
    // spec.dmg may be a function: damage worked out per target, after defence (e.g. revealed card's cost)
    const dmgFor = async who => typeof spec.dmg === 'function' ? await spec.dmg(who) : (spec.dmg || 0);
    if (d === 'redirect' && spec.noRedirect) continue; // noRedirect: it can be dodged but never reflected
    if (d === 'redirect') {
      // the whole effect bounces back to the attacker (redirectTimes: more than once)
      for (let k = 1; k < (G.redirectTimes || 1); k++) {
        const n2 = await dmgFor(src);
        if (n2) { log(`${t.name} สะท้อน ${n2} ดาเมจกลับไปหา ${src.name}!`, 'dmg'); await damage(src, n2, t); }
        if (spec.discard) await discardFromHand(src, spec.discard);
      }
      if (spec.discard) await discardFromHand(src, spec.discard);
      const n = await dmgFor(src);
      if (n) { log(`${t.name} สะท้อน ${n} ดาเมจกลับไปหา ${src.name}!`, 'dmg'); await FX.bolt(t, src, '#59c2c7'); await damage(src, n, t); }
      continue;
    }
    let n = await dmgFor(t);
    if (n > 0 && src && arenaRule().dmg) n += arenaRule().dmg; // an Arena may add damage to attacks
    if (n > 0 && src && src === cur() && G.turn.atkBonus) n += G.turn.atkBonus; // this turn's attack bonus (e.g. fm14)
    if (n > 0 && src && G.curCard && G.curCard.recipe === 'combo') n += 1; // a fused card's combo recipe
    t.lastDmg = 0;
    if (n && await damage(t, n, src || spec.by)) { kills++; if (spec.onKill) await spec.onKill(t); }
    if (spec.onHit && t.lastDmg) await spec.onHit(t, t.lastDmg); // onHit(t, dealt): after damage lands
    dealtTotal += t.lastDmg || 0;
    if (spec.discard && t.hand.length) {
      await discardFromHand(t, spec.discard);
      puppetHype(src, t);
    }
    render(); await sleep(AI_DELAY / 3);
  }
  return kills;
}

function describe(spec) {
  const a = [];
  if (spec.dmgText) a.push(spec.dmgText);
  else if (spec.dmg) a.push(`${spec.dmg} ดาเมจ`);
  if (spec.discard) a.push(`ทิ้งการ์ด ${spec.discard} ใบ`);
  return a.join(' + ');
}

async function tryDefend(t, src, spec) {
  if (t.isAI && spec.benign) return null; // benign: an 'attack' that helps the target, so the AI lets it through
  if (G.turn.noDefense && G.turn.noDefense.includes(t)) return null; // G.turn.noDefense: these players can't defend this turn
  // each defence card works once per turn (G.turn is replaced at the start of every turn)
  const used = G.turn.defUsed ||= [];
  // defInPlay: an Ongoing card that defends from the table (leaves play to the discard pile)
  const defs = [...t.hand.filter(c => c.def), ...t.ongoing.filter(c => c.defInPlay)].filter(c => !used.includes(c))
    .filter(c => !t.isAI || !c.aiDefOk || c.aiDefOk(t, src, spec)); // aiDefOk: a costly defence the AI should skip
  if (!defs.length) return null;
  let choice;
  if (t.isAI) {
    // prefer reflecting; keep cards on the table (e.g. a VP set) as the last resort
    choice = defs.slice().sort((a, b) => ((b.redirect && src ? 1 : 0) - (a.redirect && src ? 1 : 0)) || ((a.defInPlay ? 1 : 0) - (b.defInPlay ? 1 : 0)))[0];
  } else {
    const who = src ? src.name : (G.curLabel || 'เหตุการณ์สด');
    choice = await humanChoose(t, `${who} โจมตีคุณ!`, [
      ...defs.map(c => ({ card: c, value: c })), { label: 'ไม่ป้องกัน รับการโจมตี', value: null, ghost: true }],
      `${G.curLabel}: ${describe(spec)} · เลือกการ์ดป้องกันจากมือหรือในสนาม (ใช้ได้ 1 ใบต่อการโจมตี · แต่ละใบใช้ได้ครั้งเดียวต่อเทิร์น)`);
  }
  if (!choice) return null;
  used.push(choice);
  log(`${t.name} ป้องกันด้วย ${choice.name}`, 'good');
  showEvent(choice, `${t.name} ป้องกัน`, 'defend');
  AUD.play(choice.redirect && src ? 'reflect' : 'shield'); FX.shield(t, !!(choice.redirect && src));
  if (choice.defDiscard) { t.hand.splice(t.hand.indexOf(choice), 1); t.discard.push(choice); }
  if (choice.defInPlay && t.ongoing.includes(choice)) { t.ongoing.splice(t.ongoing.indexOf(choice), 1); t.discard.push(choice); log(`${choice.name} ออกจากสนามของ ${t.name}`); }
  // defTopdeck: the card goes face up on top of the deck, so it comes back with the next draw
  if (choice.defTopdeck) { t.hand.splice(t.hand.indexOf(choice), 1); t.deck.push(choice); log(`${choice.name} หงายอยู่บนสุดของเด็ค ${t.name}`); }
  // defBottom: the card goes to the bottom of the deck
  if (choice.defBottom) { t.hand.splice(t.hand.indexOf(choice), 1); t.deck.unshift(choice); log(`${choice.name} ไปอยู่ใต้เด็ค ${t.name}`); }
  G.redirectTimes = choice.redirectTimes || 1; // a defence that reflects more than once
  if (choice.defDraw) await draw(t, 1); // self-discarding defence that draws 1 before its own effect
  if (choice.onDefend) await choice.onDefend(t, src, choice, spec);
  return choice.redirect && src ? 'redirect' : 'avoid';
}

async function damage(t, n, killer) {
  t.lastDmg = Math.max(0, n); // damage actually dealt, read by spec.onHit
  if (n <= 0) return false;
  t.hp -= n; t.hitFlash = true;
  if (killer && killer !== t && killer === cur()) { // the turn player's damage to others (Star challenges)
    const T = G.turn, i = G.players.indexOf(t);
    T.dmgDealt = (T.dmgDealt || 0) + n; T.hit ||= []; if (!T.hit.includes(i)) T.hit.push(i);
  }
  log(`${t.name} รับ ${n} ดาเมจ (${Math.max(t.hp, 0)} HP)`, 'dmg');
  render();
  AUD.play('impact', n); FX.hit(t, n);
  hypeOnHit(t, killer);
  if (t.hp < 1) { await kill(t, killer); return true; }
  return false;
}

// knockout: back to 20 HP, keeping every card (Ongoing too), half the Hype (rounded up) is lost and one extra card is drawn
// next turn (comeback); the killer takes it plus 3 Hype and a Highlight. With no killer the Hype is simply lost.
async function kill(t, killer) {
  if (killer === t) killer = null;
  if (killer && killer === cur()) { // Star challenges: knockouts this turn, and whether the victim had the most Hype (ties count)
    G.turn.kos = (G.turn.kos || 0) + 1;
    if ((t.hype || 0) >= Math.max(...G.players.filter(x => x !== t).map(x => x.hype || 0))) G.turn.koTop = true;
  }
  t.hp = 20; t.comeback = true;
  t.discard.push(make('leak')); // the penalty: a junk card (until 2026-11-13 a knockout also drew 1 extra card next turn)
  endContract(t, 'ถูกน็อกเอาต์');
  const lost = Math.ceil((t.hype || 0) / 2);
  t.hype = (t.hype || 0) - lost;
  log(`☠ ${t.name} ถูกน็อกเอาต์!${killer ? ` (โดย ${killer.name})` : ''} · กลับมาที่ ${t.hp} HP · ได้ ${cn(DEFS.leak)} (-1 VP)${lost ? ` · เสีย ${lost} กระแส` : ''}`, 'kill');
  AUD.play('kill'); render(); await FX.kill(t, null, killer);
  if (!G) return;
  if (killer) {
    awardHighlight(killer);
    addHype(killer, 3 + lost + (arenaRule().koHype || 0), lost ? `น็อกเอาต์ + แย่งกระแส ${lost}` : 'น็อกเอาต์');
  }
  render();
}

async function discardFromHand(t, n) {
  for (let i = 0; i < n && t.hand.length; i++) {
    let c;
    if (t.isAI) c = t.hand.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
    else c = await humanChoose(t, 'ทิ้งการ์ดจากมือ 1 ใบ', t.hand.map(x => ({ card: x, value: x })));
    t.hand.splice(t.hand.indexOf(c), 1); t.discard.push(c);
    log(`${t.name} ทิ้ง ${cn(c)}`); AUD.play('discard');
  }
}

// junk the AI is happy to destroy: junk cards (คลิปหลุด) always, starter cards once the deck is big enough
const isJunk = p => x => x.junk || (x.type === 'starter' && !x.parts && allCards(p).length > 16);
const junkPick = (p, list) => list.find(x => x.junk) || list.find(isJunk(p)) || null;
// destroy up to n cards from p's hand, one at a time; the human may stop early
async function destroyFromHand(p, n) {
  for (let k = 0; k < n && p.hand.length; k++) {
    const c = p.isAI ? junkPick(p, p.hand)
      : await humanChoose(p, `ทำลายการ์ดในมือ (${k + 1}/${n})`, [...p.hand.map(x => ({ card: x, value: x })), { label: 'พอแล้ว', value: null, ghost: true }],
        'การ์ดที่ถูกทำลายจะออกจากเกมถาวร');
    if (!c) break;
    p.hand.splice(p.hand.indexOf(c), 1); G.destroyed.push(c);
    log(`${p.name} ทำลาย ${cn(c)}`); AUD.play('destroy'); render();
  }
}
// Ongoing cards with sacrifice(): destroy the card itself to use its effect, any time on your turn
async function sacrificeCard(p, uid) {
  const c = p.ongoing.find(x => x.uid === uid && x.sacrifice);
  if (!c) return false;
  p.ongoing.splice(p.ongoing.indexOf(c), 1); G.destroyed.push(c);
  G.curLabel = cn(c); log(`${p.name} ทำลาย ${cn(c)} เพื่อใช้ผล`, 'sys'); AUD.play('destroy'); render();
  await c.sacrifice(p, c);
  render();
  return true;
}
async function destroyOwn(p, { discardOnly = false } = {}) {
  const pool = discardOnly ? [...p.discard] : [...p.hand, ...p.discard];
  if (!pool.length) return null;
  let c;
  if (p.isAI) c = junkPick(p, pool);
  else c = await humanChoose(p, `ทำลายการ์ด 1 ใบ (${discardOnly ? 'จากกองทิ้ง' : 'จากมือหรือกองทิ้ง'})`, [...pool.map(x => ({ card: x, value: x })), { label: 'ไม่ทำลาย', value: null, ghost: true }],
    'การ์ดที่ถูกทำลายจะออกจากเกมถาวร');
  if (!c) return null;
  const arr = p.hand.includes(c) ? p.hand : p.discard;
  arr.splice(arr.indexOf(c), 1); G.destroyed.push(c);
  log(`${p.name} ทำลาย ${cn(c)}`); AUD.play('destroy');
  render();
  return c;
}

async function destroyOngoing(t) {
  if (!t.ongoing.length) return;
  let c;
  if (t.isAI) c = t.ongoing.slice().sort((a, b) => a.cost - b.cost)[0];
  else c = await humanChoose(t, 'แผ่นดินไหว! ทำลายการ์ดต่อเนื่อง 1 ใบ', t.ongoing.map(x => ({ card: x, value: x })));
  t.ongoing.splice(t.ongoing.indexOf(c), 1); G.destroyed.push(c);
  log(`${t.name} เสีย ${cn(c)}`, 'dmg'); AUD.play('destroy');
}

// a free card of one type (cost ≤ max) from the Line-Up; returns false when there is none
async function gainTypeFromLineup(p, type, max) {
  const opts = G.lineup.map((c, i) => ({ c, i })).filter(o => o.c && isType(o.c, type) && o.c.cost <= max && canOwn(p, o.c));
  if (!opts.length) return false;
  const pick = p.isAI ? opts.sort((a, b) => b.c.cost + b.c.vp - a.c.cost - a.c.vp)[0]
    : await humanChoose(p, `${G.curLabel}: รับ${TYPE_SHORT[type]}ใบไหนฟรี?`, opts.map(o => ({ card: o.c, value: o })));
  G.lineup[pick.i] = null; await placeGained(p, pick.c); log(`${p.name} รับ ${cn(pick.c)} ฟรี`, 'good');
  return true;
}
async function gainFromLineup(p, max) {
  const opts = G.lineup.map((c, i) => ({ c, i })).filter(o => o.c && o.c.cost <= max && canOwn(p, o.c));
  if (!opts.length) { log('ไม่มีการ์ดใน Line-Up ที่รับได้'); return; }
  let pick;
  if (p.isAI) pick = opts.sort((a, b) => b.c.cost + b.c.vp - a.c.cost - a.c.vp)[0];
  else pick = await humanChoose(p, `รับการ์ดราคาไม่เกิน ${max} ฟรี`, opts.map(o => ({ card: o.c, value: o })));
  G.lineup[pick.i] = null; await placeGained(p, pick.c);
  log(`${p.name} รับ ${cn(pick.c)} ฟรี`, 'good');
}

/* ✲ เปิดใช้: text before ✲ resolves on play; the ✲ part (card.activate) can be used once, whenever the
   player chooses later that turn, if card.canActivate(p) allows it. Unused abilities lapse at end of turn. */
const canUse = (p, c) => !c.canActivate || c.canActivate(p);
async function activateCard(p, uid) {
  const c = (G.turn.ready || []).find(x => x.uid === uid);
  if (!c || !canUse(p, c)) return false;
  G.turn.ready.splice(G.turn.ready.indexOf(c), 1);
  G.curLabel = cn(c);
  log(`${p.name} ✲ เปิดใช้ ${cn(c)}`, 'sys'); AUD.play('power');
  showEvent(c, `${p.name} เปิดใช้ ✲`, 'act');
  render();
  await c.activate(p, c);
  render();
  return true;
}
async function playCard(p, card, { fromOther = null } = {}) {
  if (!fromOther) p.hand.splice(p.hand.indexOf(card), 1);
  G.turn.nPlayed = (G.turn.nPlayed || 0) + 1;
  G.turn.types[card.type] = (G.turn.types[card.type] || 0) + 1;
  if (card.alsoType) G.turn.types[card.alsoType] = (G.turn.types[card.alsoType] || 0) + 1; // e.g. a Star that is also a Wizard
  if (card.allTypes) for (const ty of ['spell', 'creature', 'treasure', 'wizard', 'location']) if (ty !== card.type) G.turn.types[ty] = (G.turn.types[ty] || 0) + 1;
  G.curLabel = cn(card);
  G.curCard = card; // the card whose effect is resolving (cleared after it resolves)
  G.turn.shown.push(card);
  log(`${p.name} ใช้ ${cn(card)}`);
  AUD.play('card');
  if (card.power) { P(p, card.power); AUD.play('power'); }
  // an Arena played from hand goes back up only onto an empty table (otherwise it is just played and discarded)
  if (card.type === 'location' && !fromOther && !G.arena) setArena(p, card);
  else if (card.ongoing && !fromOther) p.ongoing.push(card); else if (!fromOther) G.turn.played.push(card);
  render();
  FX.cast(card);
  if (card.play) await card.play(p, card);
  if (card.activate) (G.turn.ready ||= []).push(card); // ✲ ability: usable once, any time later this turn
  // Ongoing cards that react to their owner playing a card (onCardPlayed)
  G.curCard = null;
  for (const o of p.ongoing.slice()) if (o.onCardPlayed && o !== card) await o.onCardPlayed(p, card);
  if (!fromOther && arenaRule().onPlay && G.arena !== card) await arenaRule().onPlay(p, card, isHost(p)); // an Arena reacting to plays
  if (fromOther) fromOther.discard.push(card); // a card played from someone else's pile goes back to them
  render();
}

async function buy(p, src, i) {
  let card;
  if (src === 'lineup') card = G.lineup[i];
  else if (src === 'legend') card = G.legendRow[i];
  if (!card) return false;
  if (!canOwn(p, card)) { if (!p.isAI) log(`มี ${cn(card)} ได้คนละ 1 ใบเท่านั้น`); return false; }
  const k = costFor(p, card);
  if (k > G.turn.power) return false;
  const slot = document.querySelector(src === 'lineup' || src === 'legend' ? `[data-src="${src}"][data-i="${i}"]` : `[data-src="${src}"]`);
  const from = slot && slot.getBoundingClientRect();
  G.turn.power -= k;
  if (src === 'lineup') G.lineup[i] = null;
  G.turn.bought = (G.turn.bought || 0) + 1;
  if (src === 'legend') {
    G.legendRow[i] = null; // refilled from the face-down stack at end of turn
    const was = starRamp(); G.starsBought = (G.starsBought || 0) + 1;
    if (starRamp() > was) log(`⭐ ดาวเด่นดังขึ้น! ค่าตัวดาวเด่นทุกใบ +${starRamp()} ทอง`, 'sys');
  }
  if (card.type === 'location') setArena(p, card); else await placeGained(p, card); // a bought Arena goes straight up on the table
  log(`${p.name} ซื้อ ${cn(card)} (${k})`, src === 'legend' ? 'sys' : '');
  if (src === 'legend') { log(`${p.name} ล้มดาวเด่น ${cn(card)} ได้!`, 'sys'); AUD.play('legendWin'); render(); await FX.legendWin(p, card); }
  else { AUD.play('buy'); FX.coins(from, p); }
  // Coin school: the first buy of cost 5+ each turn gives +1 Hype (was 6+ until 2026-11-10; a 1 ทอง cashback was tried and made it win 6 of 8)
  if (card.cost >= 5 && inSchool(p, 'coin') && !G.turn.hypeCoin) { G.turn.hypeCoin = true; addHype(p, 1, schoolOf(p).name); }
  render();
  return true;
}

/* ---------------- turn flow ---------------- */
async function refillLineup() {
  // one card at a time so each one flies out on its own, then a pause for the last to land (no pause when nothing moved)
  let landing = false;
  const land = async () => { if (landing) { landing = false; await sleep(Math.min(LINE_MS - LINE_GAP, AI_DELAY)); } };
  for (let i = 0; i < 5; i++) {
    while (!G.lineup[i]) {
      if (!G.main.length) { await land(); return; } // an empty main pile leaves gaps in the Line-Up (it ended the game until 2026-11-13)
      const c = G.main.pop();
      if (c.type === 'chaos') {
        await land();
        G.curLabel = cn(c);
        log(`เหตุการณ์สด! ${cn(c)}: ${c.text.replace(/<[^>]+>/g, '')}`, 'sys');
        // it lands in the Line-Up like any card, then the big showcase; closing that sends it to the destroyed pile,
        // and only then does it take effect
        G.lineup[i] = c;
        if (AI_DELAY) { render(); AUD.play('draw'); await sleep(LINE_MS + 450); }
        AUD.play('chaos'); await FX.chaos(c);
        G.lineup[i] = null; G.destroyed.push(c);
        render(); await FX.chaosToPile(c);
        if (inSchool(cur(), 'clown')) addHype(cur(), 1, schoolOf(cur()).name);
        await c.chaos();
      } else {
        G.lineup[i] = c;
        if (AI_DELAY) { render(); AUD.play('draw'); landing = true; await sleep(LINE_GAP); }
      }
    }
  }
  await land();
}

async function startTurn(p) {
  // part of the ทอง left over last turn carries into this one (carryGold: 1/3 rounded down, at least 1 if any was left)
  const kept = p.savedPower || 0; p.savedPower = 0;
  G.turn = { power: kept, played: [], shown: [], types: {}, attacked: false };
  log(`เทิร์นของ ${p.name}`, 'turn');
  if (kept) log(`${p.name} มีทองเก็บไว้จากเทิร์นก่อน +${kept} ทอง`);
  render();
  await refillLineup(); if (G.instantWinner) return;
  await FX.turn(p);
  for (const c of p.ongoing.slice()) if (c.onStart) { G.curLabel = cn(c); await c.onStart(p); }
  for (const l of famUnlocked(p)) if (l.onStart) { G.curLabel = cn(p.familiar); await l.onStart(p); }
  if (inSchool(p, 'brew') && p.hp < 20) { G.curLabel = schoolOf(p).name; heal(p, 1); }
  const ar = arenaRule();
  if (ar.start || (ar.hostStart && isHost(p))) {
    G.curLabel = cn(G.arena);
    if (ar.start) await ar.start(p, isHost(p));
    if (ar.hostStart && isHost(p)) await ar.hostStart(p);
  }
  p.comeback = false; // read by start-of-turn effects above (e.g. a familiar: +2 ทอง after a knockout)
  render();
}

// ทอง carried to a player's next turn: 1/3 of what is left (rounded down), but 1 when only 1-2 is left
const carryGold = left => left <= 0 ? 0 : Math.max(1, Math.floor(left / 3));
async function endTurn(p) {
  await checkContract(p); // sponsor contract: checked against this turn's counters before they are cleared
  if (!G) return;
  G.quietMoves = true; // cleanup and the new hand are not news
  p.lastPlayed = G.turn.shown.slice();
  // turn history for the "เกิดอะไรขึ้นบ้าง" viewer: newest first, the last 12 turns (plain data, sent to guests)
  (G.history ||= []).unshift({ name: p.name, pi: G.players.indexOf(p), played: G.turn.shown.slice(), events: (G.turn.events || []).slice() });
  if (G.history.length > 12) G.history.length = 12;
  // endBottom: the card goes to the bottom of its player's deck instead of the discard pile
  const bottom = G.turn.played.filter(c => c.endBottom); p.deck.unshift(...bottom);
  p.discard.push(...p.hand, ...G.turn.played.filter(c => !c.endBottom)); p.hand = []; G.turn.played = [];
  p.savedPower = carryGold(G.turn.power); // carried into this player's next turn
  if (p.savedPower) log(`${p.name} เก็บทอง ${p.savedPower} ไว้ใช้เทิร์นหน้า`);
  G.turn.power = 0;
  const ah = arenaRule().hand, handSize = 5 + (typeof ah === 'function' ? ah(p, isHost(p)) : ah || 0) - (p.drawPenalty || 0); // drawPenalty: one fewer card, once
  p.drawPenalty = 0;
  await draw(p, handSize);
  trackMoves(); G.quietMoves = false; // remember the cleaned-up table, then report moves again
  // refill empty Star slots from the face-down stack; a new Star's gattack (if it has one) runs as it appears
  for (let i = 0; i < G.legendRow.length && !G.ending; i++) {
    if (G.legendRow[i]) continue;
    if (!G.legends.length) { if (!G.finalRound) G.ending = 'ล้มดาวเด่นครบทุกตนแล้ว'; break; }
    const L = G.legends.shift();
    G.legendRow[i] = L;
    G.curLabel = cn(L);
    log(`ดาวเด่น ${cn(L)} ปรากฏ!${L.gattack ? ` ${L.group}` : ''}`, 'sys');
    render(); AUD.play('legendUp'); await FX.legend(L);
    if (L.gattack) await L.gattack();
  }
  render();
}

async function aiTurn(p) {
  await wait();
  // levels before Hype is needed elsewhere (not in the final round, where Hype is worth more as VP)
  while (!G.finalRound && famUp(p)) await wait();
  for (const c of p.ongoing.slice()) if (c.sacrifice && c.aiSacrifice && c.aiSacrifice(p)) { await sacrificeCard(p, c.uid); await wait(); }
  const pri = c => c.playFirst ? -1 : c.playLate ? 3 : c.draws ? 0 : c.atk ? 2 : 1;
  do {
    while (p.hand.length) {
      const c = p.hand.slice().sort((a, b) => pri(a) - pri(b))[0];
      await playCard(p, c); await wait();
    }
    for (const c of (G.turn.ready || []).slice()) if (canUse(p, c)) { await activateCard(p, c.uid); await wait(); }
  } while (p.hand.length);
  aiFuse(p); await wait();
  // a sponsor first when gold is short of anything worth buying (contracts it thinks it can keep)
  if (!p.contract && G.turn.power >= SPONSOR_COST && G.turn.power < 5) {
    const i = G.sponsors.slice(0, SPONSOR_SHOW).findIndex(id => sponsorOf(id).aiOk(p));
    if (i >= 0) { await signSponsor(p, i); await wait(); }
  }
  if (canFamAct(p) && (famAbility(p).aiUse || (() => true))(p)) { await famAct(p); await wait(); }
  // buying: a Star is weighed against the best handful of Line-Up cards the same gold buys. While the first half of
  // the Star stack is left, Line-Up cards count 1.2× (building the deck first), so Stars come mostly later in the game
  const early = G.legends.length > (G.starTotal || 23) / 2;
  while (true) {
    const line = [], stars = [];
    G.lineup.forEach((c, i) => { if (c && canOwn(p, c) && costFor(p, c) <= G.turn.power)
      line.push({ src:'lineup', i, k: costFor(p, c), s: (vpIfBought(c, p) * 3 + c.cost * 2 + (c.atk ? 2 : 0) + (c.def ? 1 : 0)) * (early ? 1.2 : 1) }); });
    G.legendRow.forEach((L, i) => { if (L && canOwn(p, L) && costFor(p, L) <= G.turn.power)
      stars.push({ src:'legend', i, s: vpIfBought(L, p) * 3 + L.cost * 2 + 4 }); });
    if (!line.length && !stars.length) break;
    line.sort((a, b) => b.s - a.s); stars.sort((a, b) => b.s - a.s);
    let gold = G.turn.power, combo = 0;
    for (const o of line) if (o.k <= gold) { gold -= o.k; combo += o.s; }
    const pick = stars.length && stars[0].s > combo ? stars[0] : line[0];
    if (!(await buy(p, pick.src, pick.i))) break;
    await wait();
    if (pick.src === 'legend') break; // a Star is the big buy of the turn
  }
}

function humanTurn() {
  return new Promise(res => { G.endTurnResolve = res; render(); });
}

async function runGame() {
  const myGame = G;
  // the end of the game was triggered: play on until everyone has had the same number of turns (only an outright win stops at once)
  const finalRound = async () => {
    if (!G.ending || G.instantWinner) return;
    G.finalRound = G.ending; G.ending = null;
    const left = (G.firstSeat - G.cur - 1 + G.players.length) % G.players.length;
    if (!left) return;
    log(`${G.finalRound} · รอบสุดท้าย: เล่นต่ออีก ${left} คนให้ทุกคนได้เทิร์นเท่ากัน แล้วเกมจบ`, 'sys');
    render(); await FX.finalRound(`เกมจบเพราะ${G.finalRound}`, `เล่นต่ออีก ${left} คนให้ทุกคนได้เทิร์นเท่ากัน`);
  };
  while (G === myGame) {
    const p = cur();
    await startTurn(p);
    if (G !== myGame) return;
    await finalRound(); // triggered at the start of this turn: the player still takes it
    if (G !== myGame) return;
    if (!G.ending) { if (p.isAI) await aiTurn(p); else await humanTurn(p); }
    if (G !== myGame) return;
    await endTurn(p);
    if (G !== myGame) return;
    await finalRound();
    if (G !== myGame) return;
    if (G.ending) return finish();
    if (G.finalRound && (G.cur + 1) % G.players.length === G.firstSeat) { G.ending = G.finalRound; return finish(); }
    G.cur = (G.cur + 1) % G.players.length;
  }
}

function finish() {
  G.over = true;
  if (G.players.some(p => !p.isAI || p.away)) statEvent('game-finish', 'เล่นจบเกม'); // not the all-AI test games
  const rows = finalRows();
  log(`เกมจบ: ${G.ending}`, 'sys');
  render();
  NET.flush(); NET.send({ t: 'finish' }); // the final snapshot shows every card, so guests can score it
  showFinal(rows);
}
// the score table: the host works it out in finish(); a guest from its last snapshot (all cards are visible once G.over)
function finalRows() {
  return G.players.map(p => ({ p, cards: cardVP(p), hl: p.highlights || 0, hype: hypeVP(p), total: scoreOf(p) }))
    .sort((a, b) => (b.p === G.instantWinner) - (a.p === G.instantWinner) || b.total - a.total || b.hl - a.hl); // G.instantWinner wins outright
}
function showFinal(rows = finalRows()) {
  const win = rows[0].p === meP();
  AUD.play(win ? 'victory' : 'defeat'); FX.victory(win, rows[0].p.name);
  const m = $('#modal'); m.hidden = false; titleMode(false);
  $('#m-title').textContent = `${rows[0].p.name} ชนะ!`;
  $('#m-sub').innerHTML = `เกมจบเพราะ${G.ending}`;
  $('#m-opts').innerHTML = `<div class="tablewrap" style="width:100%"><table class="score"><tr><th>พ่อมด</th><th>VP การ์ด</th><th>ไฮไลต์</th><th>กระแส</th><th>รวม</th></tr>
    ${rows.map((r, i) => `<tr class="${i === 0 ? 'win' : ''}"><td>${r.p.name}</td><td>${r.cards}</td><td>${r.hl} × ${HL_VP}</td><td>+${r.hype}</td><td>${r.total}</td></tr>`).join('')}</table></div>
    ${NET.role === 'guest' ? '<div class="msub">รอเจ้าภาพเริ่มเกมใหม่ หรือ</div><button class="btn ghost" id="leave">ออกจากห้อง</button>'
      : `<button class="btn" id="again">${NET.role === 'host' ? 'กลับไปที่ห้อง เล่นอีกรอบ' : 'เล่นอีกครั้ง'}</button>`}`;
  $('#m-opts').onclick = e => {
    if (e.target.id === 'again') { m.hidden = true; if (NET.role === 'host') NET.showLobby(); else showSetup(); }
    if (e.target.id === 'leave') NET.leave();
  };
}

/* ---------------- setup ---------------- */
// One colour per seat (you first): seat border + name, your panel, names in the battle log and arena title.
const PLAYER_COLORS = ['#f4f1ea', '#ff6b6b', '#7ee081', '#c792ea', '#ffcb47'];
const pcName = p => `<span class="pname" style="color:${p.color || 'inherit'}">${p.name}</span>`;

// name = seat 0; more = other human players' names (online room), seated after you; then nAI computer players
function newGame(name, nAI, more = []) {
  const humans = [name, ...more];
  ZOOMS.clear();
  uidc = 1;
  const fams = shuffle(FAMILIARS.slice());
  const aiNames = shuffle(['ลุงเคราดก', 'ป้ามะลิ', 'เจ๊ฟ้าแลบ', 'น้องหม้อไฟ']);
  const players = [], colors = shuffle(PLAYER_COLORS.slice()); // a different random colour for each player, every game
  const schools = shuffle(SCHOOLS.slice()); // everyone starts with a random School; humans pick their own in startGame
  for (let i = 0; i < humans.length + nAI; i++) {
    const school = schools[i % schools.length];
    const deck = [];
    for (let k = 0; k < 6; k++) deck.push(make('fee'));
    deck.push(make('rehearse'), make('rehearse'), make(school.card), make(school.card));
    const human = i < humans.length;
    players.push({ name: human ? humans[i] : aiNames[i - humans.length], color: colors[i % colors.length], isAI: !human, hp: 20, deck: shuffle(deck), hand: [], discard: [], ongoing: [],
      hype: 0, highlights: 0, school: school.id,
      famChoices: [0, 1, 2].map(k => make(fams[i * 3 + k])), familiar: null, famLv: 1 });
    players[i].famChoices.forEach(c => { c.owner = players[i]; }); // companions remember their owner
  }
  const main = [];
  for (const [id, n] of Object.entries(MAIN)) for (let k = 0; k < n; k++) main.push(make(id));
  shuffle(main);
  const nLeg = STARS_PER_PLAYER * players.length - 3; // face-down Star stack; the game ends when it runs out
  G = { players, cur: 0, main, lineup: [null, null, null, null, null], destroyed: [], log: [],
    // 3 face-up Stars to buy over a face-down stack
    legendRow: null, legends: shuffle(LEGENDS.slice()).slice(0, nLeg + 3).map(make), starTotal: nLeg + 3,
    turn: { power: 0, played: [], shown: [], types: {} }, ending: null, busy: false, curLabel: '',
    highlights: HL_PER_PLAYER * players.length };
  // each Star gets a challenge, dealt round the shuffled pool so the 3 face-up ones differ
  const chs = shuffle(CHALLENGES.map(c => c.id));
  G.legends.forEach((L, k) => { L.ch ||= chs[k % chs.length]; });
  G.legendRow = [G.legends.shift(), G.legends.shift(), G.legends.shift()]; // flipped at setup: nothing happens
  // Arenas without a rule of their own get a placeholder one; no Arena on the table yet; the sponsor pile
  const rules = shuffle(ARENA_RULES.map(r => r.id));
  G.main.filter(c => c.type === 'location' && !DEFS[c.id].arena).forEach((c, k) => { c.rule = rules[k % rules.length]; c.text = arenaText(c); });
  G.arena = null; G.arenaHost = null;
  G.sponsors = shuffle(SPONSORS.map(s => s.id));
  G.secrets = shuffle(SECRETS.map(s => s.id)).slice(0, 2).map(id => ({ id, by: null }));
  // the first Line-Up has no Live Event
  const chaos = [];
  while (G.lineup.includes(null)) {
    const c = G.main.pop();
    if (c.type === 'chaos') chaos.push(c); else G.lineup[G.lineup.indexOf(null)] = c;
  }
  G.main.push(...chaos); shuffle(G.main);
  players.forEach(p => { for (let k = 0; k < 5; k++) p.hand.push(p.deck.pop()); });
  G.cur = G.firstSeat = rnd(players.length);
}

// the School you were dealt, for the familiar dialog: its character standing in a glow of the School's colour, its name
// and one line per rule (a missing picture just hides itself)
const schoolPanel = sc => `<div class="fp-school" style="--sc:${sc.col}">
  <div class="fp-tag">🏫 โรงเรียนของคุณ (สุ่ม)</div>
  <div class="fp-stage"><div class="fp-halo"></div>${avArt(sc.id, 'idle') ? `<img class="fp-av" src="${avArt(sc.id, 'idle')}" alt="" onerror="this.remove()">` : ''}</div>
  <div class="fp-sname">${sc.name}</div>
  <ul class="fp-rules">${sc.text.split(' · ').map(t => `<li>${t}</li>`).join('')}</ul></div>`;

// guests = online players [{ name, peer }] (host only); they take the seats after yours
async function startGame(name, nAI, guests = []) {
  newGame(name, nAI, guests.map(g => g.name));
  ME = 0;
  statEvent(guests.length ? 'game-start-online' : 'game-start', `เริ่มเกม ${G.players.length} คน${guests.length ? ` (เพื่อนออนไลน์ ${guests.length})` : ''}`);
  if (guests.length) { G.online = true; guests.forEach((g, k) => { G.players[k + 1].peer = g.peer; }); }
  for (const p of G.players) {
    if (p.isAI) p.familiar = p.famChoices[rnd(3)];
  }
  render();
  // every human picks at the same time (online, each in their own browser)
  await Promise.all(G.players.filter(p => !p.isAI).map(async p => {
    // the School is dealt at random in newGame (no pick since 2026-11-14); the familiar dialog tells the player which one
    p.familiar = await humanChoose(p, 'เลือกภูติคู่ใจของคุณ', p.famChoices.map(c => ({ card: c, value: c, label: famBadges(c) })),
      // .fam-pick in the sub switches the dialog to its big, centred layout (CSS :has), on guests' screens too
      `<div class="fam-pick"><div class="fp-kick">ก่อนการแข่งขันจะเริ่ม · ${escHTML(p.name)}</div>
        ${schoolPanel(schoolOf(p))}
        <div class="fp-note">เลือกภูติคู่ใจ <b>1 ตัว</b> · อยู่ข้างตัวคุณตลอดเกม ไม่เข้าเด็ค · ใช้กระแสอัปเลเวล (Lv2 🔥${FAM_UP[1] - (inSchool(p, 'tamer') ? 1 : 0)} · Lv3 🔥${FAM_UP[2] - (inSchool(p, 'tamer') ? 1 : 0)})</div></div>`);
    if (p.isAI && !p.famChoices.includes(p.familiar)) p.familiar = p.famChoices[0]; // left during the pick
  }));
  log(`เริ่มเกม! ${G.players[G.cur].name} เล่นก่อน`, 'sys');
  runGame();
}

// title screens (start, join, host lobby, guest waiting room, connecting): the big Wizard Royale logo over the tavern

const avatar = n => `<span class="av" aria-hidden="true">${escHTML([...String(n || '?').trim()][0] || '?')}</span>`;

let modalStack = null;
// who = the player who decides. Online, the host sends the question to that player's browser and waits for the answer;
// everyone else sees "รอ … ตัดสินใจ" while it is open.
async function humanChoose(who, title, options, sub = '') {
  if (!G || !G.online || !who) return localChoose(title, options, sub);
  (G.waiting ||= []).push(who.name); render();
  try { return who.peer ? await NET.askRemote(who, title, options, sub) : await localChoose(title, options, sub); }
  finally { if (G && G.waiting) { G.waiting.splice(G.waiting.indexOf(who.name), 1); render(); } }
}
// familiar pick: what a familiar is good at, as badges under its card, plus the pick button
function famBadges(c) {
  return `<div class="fam-kit">${famKitHTML(c, 1)}</div><span class="fam-go">เลือกตัวนี้</span>`;
}
function localChoose(title, options, sub = '') {
  return new Promise(res => {
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide'); titleMode(false);
    $('#m-title').textContent = title; $('#m-sub').innerHTML = sub;
    const box = $('#m-opts');
    box.innerHTML = options.map((o, i) => o.card
      ? `<div class="opt-card" data-i="${i}">${cardHTML(o.card)}${o.label ? `<div class="opt-extra">${o.label}</div>` : ''}</div>`
      : `<button class="btn ${o.ghost ? 'ghost' : ''}" data-i="${i}">${o.label}</button>`).join('');
    box.onclick = e => {
      const el = e.target.closest('[data-i]'); if (!el) return;
      m.hidden = true; box.onclick = null; res(options[+el.dataset.i].value);
    };
  });
}

// a card affected by an effect: logged into this turn's "what happened" strip and popped up in the middle of
// the screen for a moment. kind: gain · bad · discard · destroy · reveal · defend · act. Only use for public info.
const POP = { items: [], timer: null };
function showEvent(card, label, kind = 'gain') {
  if (!G || !card || !G.turn) return;
  if (NET.role !== 'guest') (G.turn.events ||= []).push({ card, label, kind });
  if (NET.role === 'host' && !NET.tracking) NET.fx('ev', [card, label, kind]); // trackMoves pop-ups are worked out by each guest itself
  if (AI_DELAY === 0) return; // test helpers / instant mode: record only
  POP.items.push({ card, label, kind }); if (POP.items.length > 4) POP.items.shift();
  const el = $('#pop');
  el.innerHTML = POP.items.map(it => `<div class="pop-item ev-${it.kind}"><span class="ev-cap">${it.label}</span>${cardHTML(it.card, { noZoom: true })}</div>`).join('');
  el.classList.remove('out'); el.hidden = false;
  clearTimeout(POP.timer);
  POP.timer = setTimeout(() => { el.classList.add('out'); POP.timer = setTimeout(() => { el.hidden = true; POP.items = []; }, 300); },
    Math.max(POP.items.some(it => it.kind === 'reveal') ? 2400 : 1100, AI_DELAY * 2.4)); // a revealed card stays long enough to read
}

// ---- card-move tracker ----
// Every redraw compares where each card is now with where it was last time, and shows public moves with
// showEvent: received, passed between players, discarded, destroyed, taken from the discard pile, put on a deck.

function cardLocations() {
  const m = new Map();
  // seats are stored by index: online guests rebuild every object from each snapshot, so identities don't survive
  const put = (list, p, z) => { const pi = p ? G.players.indexOf(p) : -1; for (const c of list || []) if (c && c.uid != null) m.set(c.uid, { c, p, pi, z }); };
  for (const p of G.players) {

    if (p.familiar) put([p.familiar], p, 'fam');

  if (G.turn) put(G.turn.played, cur(), 'played');
  put(G.lineup, null, 'lineup'); put(G.legendRow, null, 'legendRow'); put(G.legends, null, 'legends');

}

}
function trackDiff(now, before) {

  const add = (key, card, label, kind) => { const g = groups.get(key); if (g) g.cards.push(card); else groups.set(key, { key, cards: [card], label, kind }); };
  const shownU = new Set(((G.turn && G.turn.shown) || []).map(c => c.uid)), defU = new Set(((G.turn && G.turn.defUsed) || []).map(c => c.uid));
  for (const [uid, loc] of now) {
    const was = before.get(uid), p = loc.p;
    // a card that went into a zone hidden from this guest (a rival's hand or deck): show it as it was last seen
    const c = loc.c.hidden ? (was && !was.c.hidden ? was.c : null) : loc.c;
    if (!c) continue;
    if (c.type === 'chaos') continue;                                        // Live Event cards have their own showcase
    if (was && was.pi === loc.pi && was.z === loc.z) continue;               // didn't move
    const bad = 'gain';
    if (loc.z === 'destroyed') {
      if (!was) continue;
      if (G.turn && (G.turn.randDestroyed || []).includes(uid)) continue;    // already shown by showRandDestroy
      const wp = G.players[was.pi];
      add(`x-${wp ? wp.name : ''}`, c, wp ? `${wp.name} ทำลาย` : 'ถูกทำลาย', 'destroy');
      continue;
    }
    if (!p) continue;                                                        // refills of the Line-Up / Star row
    if (!was || was.pi < 0) { if (loc.z !== 'fam') add(`g-${p.name}-${c.uid}`, c, `${p.name} ได้รับ`, bad); continue; } // new or bought
    if (was.pi !== loc.pi) { add(`t-${p.name}-${c.uid}`, c, `${p.name} ได้รับจาก ${G.players[was.pi].name}`, bad); continue; }       // passed between players
    const from = was.z, to = loc.z;
    if (to === 'played' || to === 'ongoing' && from === 'hand') continue;   // played: shown in the arena
    if (from === 'fam') { add(`g-${p.name}-${c.uid}`, c, `${p.name} ได้รับ`, 'gain'); continue; }                  // bought own familiar
    if (to === 'discard' && shownU.has(c.uid)) continue;                     // a played/stolen card going home
    if (to === 'discard' && G.turn && (G.turn.randDestroyed || []).includes(uid)) continue; // already shown by showRandDiscard
    if (to === 'discard' && from === 'hand' && defU.has(c.uid)) continue; // already shown as a defence
    if (to === 'discard' && from === 'hand') add(`d-${p.name}`, c, `${p.name} ทิ้ง`, 'discard');
    else if (to === 'discard' && from === 'deck') add(`dd-${p.name}`, c, `${p.name} ทิ้งจากเด็ค`, 'discard');
    else if (to === 'discard' && from === 'ongoing') add(`do-${p.name}-${c.uid}`, c, `${p.name} นำออกจากสนาม`, 'discard');
    else if (to === 'hand' && from === 'discard') add(`h-${p.name}-${c.uid}`, c, `${p.name} นำขึ้นมือ`, 'gain');
    else if (to === 'deck' && (from === 'discard' || from === 'ongoing')) add(`k-${p.name}`, c, `${p.name} วางบนเด็ค`, 'reveal');

  }

    const n = g.cards.length;
    if (g.label.endsWith('วางบนเด็ค') && n > 3) continue;                    // a reshuffle of the discard pile
    // several cards, or cards off the top of a deck nobody chose: a row showing exactly which ones
    if (n > 1 || g.key.startsWith('dd-')) showReveal(g.cards, n > 1 ? `${g.label} ${n} ใบ` : `${g.label}: ${cn(g.cards[0])}`);
    else showEvent(g.cards[0], g.label, g.kind);
  }
}

// Card names may use at most 2 lines: a longer one gets a smaller font (down to 55% of its normal size).
function fitNames(root = document) {
  root.querySelectorAll('.card .c-name').forEach(el => {
    el.style.fontSize = '';

    // the one-line Live Event logo only has to fit the header's width (minus its padding and the skew/glow);
    // its tall display glyphs always poke a few px past the line, so its height is not checked
    const fits = el.closest('.t-chaos') ? () => el.scrollWidth <= el.parentElement.clientWidth - 22
      : () => el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1;
    for (let s = base; !fits() && s > base * (el.closest('.t-chaos') ? 0.3 : 0.55); s -= 0.5) el.style.fontSize = (s - 0.5) + 'px';
  });

  // with an "อ่านเพิ่มเติม" button that opens the zoomed card
  root.querySelectorAll('.card:not(.t-chaos):not(.mini) .c-text').forEach(el => {
    el.style.fontSize = el.style.height = el.style.flex = ''; el.querySelector('.more-btn')?.remove();
    const base = parseFloat(getComputedStyle(el).fontSize), over = () => el.scrollHeight > el.clientHeight + 1;

    if (cut) { el.style.flex = 'none'; el.style.height = (cut - top) + 'px'; }
    el.insertAdjacentHTML('beforeend', '<button type="button" class="more-btn" title="ดูการ์ดขยาย">…อ่านเพิ่มเติม</button>');

// Line-Up refill: render() compares each slot with the last render, so guests get this from their snapshots too. render()
// also rebuilds the board, so a card in flight keeps its start time and carries on from there instead of restarting
const LINE_MS = 700, LINE_GAP = 160;
let lineSeen = [], lineStart = {}, lineLast = 0;
function animateLineup() {
  const now = performance.now(), pile = $('.main-pile');
  G.lineup.forEach((c, i) => {
    if (!c) return;
    if (lineSeen[i] !== c.uid && AI_DELAY && pile) lineStart[c.uid] = lineLast = Math.max(now, lineLast + LINE_GAP);
    const t = lineStart[c.uid];
    if (t === undefined) return;
    if (now - t >= LINE_MS) { delete lineStart[c.uid]; return; }
    const el = $(`[data-src="lineup"][data-i="${i}"]`), a = pile.getBoundingClientRect(), b = el.getBoundingClientRect();
    el.classList.add('refill');
    el.style.setProperty('--fx', `${a.x + a.width / 2 - b.x - b.width / 2}px`);
    el.style.setProperty('--fy', `${a.y + a.height / 2 - b.y - b.height / 2}px`);
    el.style.animationDelay = `${t - now}ms`;
  });
  lineSeen = G.lineup.map(c => c && c.uid);
}
// landed: back to normal, so a card you can afford starts its usual glow
document.addEventListener('animationend', e => {
  if (e.animationName === 'linein') { e.target.classList.remove('refill'); e.target.style.animationDelay = ''; }
});

const TYPE_ORDER = ['legend','familiar','wizard','spell','creature','treasure','location','starter','chaos'];
function groupCards(list) {
  const m = new Map();
  for (const c of list) { const g = m.get(c.id); if (g) g.n++; else m.set(c.id, { c, n: 1 }); }
  return [...m.values()];
}
function cardsBlock(list, { group = false, sort = false } = {}) {
  if (!list.length) return '<div class="empty">ไม่มีการ์ด</div>';
  let items = group ? groupCards(list) : list.map(c => ({ c, n: 1 }));
  if (sort) items.sort((a, b) => TYPE_ORDER.indexOf(a.c.type) - TYPE_ORDER.indexOf(b.c.type) || b.c.cost - a.c.cost || a.c.id.localeCompare(b.c.id));
  return `<div class="cards">${items.map(({ c, n }) => `<div style="position:relative">${cardHTML(c)}${n > 1 ? `<span class="count-badge">×${n}</span>` : ''}</div>`).join('')}</div>`;
}

document.addEventListener('click', async e => {

  const act = el.dataset.act;
  if (act === 'rules') { if ($('#modal').hidden) showRules(false); return; }
  if (act === 'speed') {
    const steps = [[650, 'AI: ปกติ'], [1400, 'AI: ช้า'], [150, 'AI: เร็ว']];
    const k = (steps.findIndex(s => s[0] === AI_DELAY) + 1) % steps.length;
    AI_DELAY = steps[k][0]; el.textContent = steps[k][1]; return;
  }
  if (act === 'fxlite') {

    el.textContent = FXLITE ? 'เอฟเฟกต์: น้อย' : 'เอฟเฟกต์: เต็ม'; return;
  }
  if (act === 'sfx' || act === 'music') { el.textContent = audioLabel(act, AUD.toggle(act)); if (act === 'sfx') AUD.play('buy'); return; }
  if (act === 'artedit') { openArtEditor(); return; }
  if (act === 'art-pick') { artTarget = el.dataset.id; $('#art-file').value = ''; $('#art-file').click(); return; }
  if (act === 'art-clear') { delete ART[el.dataset.id]; saveArt(); openArtEditor(); return; }
  if (act === 'view') { if (G) openViewer(el.dataset.what, el.dataset.p != null ? +el.dataset.p : null); return; }
  if (act === 'vclose') { $('#viewer').hidden = true; viewerState = null; return; }
  if (act === 'newgame') { if (NET.role) NET.leave(); else location.reload(); return; }
  if (!G || G.over || !G.players) return;
  const a = { act, i: el.dataset.i, src: el.dataset.src, uid: el.dataset.uid, id: el.dataset.id };
  if (NET.role === 'guest') { if (cur() === meP() && G.endTurnResolve) NET.send({ t: 'act', a }); return; } // the host runs the game
  await doAction(meP(), a);
});
// a turn action by player p: a click here, or (online, on the host) a message from that player's browser
async function doAction(p, a) {
  if (!G || G.busy || G.over || cur() !== p || !G.endTurnResolve) return;
  const act = a.act;
  G.busy = true;
  try {
    if (act === 'play') { const c = p.hand[+a.i]; if (c) await playCard(p, c); }
    else if (act === 'activate') { await activateCard(p, +a.uid); }
    else if (act === 'sacrifice') { await sacrificeCard(p, +a.uid); }
    else if (act === 'playall') { while (p.hand.length && cur() === p && !G.over) await playCard(p, p.hand[0]); }
    else if (act === 'buy') { await buy(p, a.src, +a.i); }
    else if (act === 'fuse') { await humanFuse(p); }
    else if (act === 'famact') { await famAct(p); }
    else if (act === 'famup') { famUp(p); }
    else if (act === 'sponsor') { await signSponsor(p, +a.i); }
    else if (act === 'end') { const r = G.endTurnResolve; G.endTurnResolve = null; G.busy = false; r(); return; }
  } finally { if (G) { G.busy = false; render(); } }
  // an outright win (G.instantWinner) ends the turn and the game at once
  if (G && G.instantWinner && G.endTurnResolve && !G.over) { const r = G.endTurnResolve; G.endTurnResolve = null; r(); }
}

/* ---------------- card art ----------------

   2) Folder: put art/<card-id>.png or .jpg next to this HTML file (works when opened from disk). */
const ART_KEY = 'wizardroyale-art';

if (ART_FOLDER) for (const ext of ['jpg', 'png', 'webp']) {
  const im = new Image();
  im.onload = () => { if (!BOARD_FILE) { BOARD_FILE = `art/board.${ext}`; buildArtCSS(); } };
  im.src = `art/board.${ext}`;
}
let MAT_FILE = null; // art/mat.(jpg|png): rug under your own seat panel (hand, familiars, log)
if (ART_FOLDER) for (const ext of ['jpg', 'png', 'webp']) {
  const im = new Image();
  im.onload = () => { if (!MAT_FILE) { MAT_FILE = `art/mat.${ext}`; buildArtCSS(); } };
  im.src = `art/mat.${ext}`;
}
function boardCSS() {
  const src = ART.__board ? ART.__board : BOARD_FILE;
  if (!src) return '';
  const dim = (ART.__dim != null ? ART.__dim : 45) / 100;
  return `.boardc,.stage-bg,.board-preview{background-image:linear-gradient(rgba(10,6,14,${dim}),rgba(10,6,14,${dim})),url("${src}");background-size:cover;background-position:center}`;
}
function matCSS() {
  if (!MAT_FILE) return '';
  const dim = (ART.__dim != null ? ART.__dim : 45) / 100;
  return `.you{background-image:linear-gradient(rgba(10,6,14,${dim}),rgba(10,6,14,${dim})),url("${MAT_FILE}");background-size:cover;background-position:center}`;
}
// every Live Event shares one picture: art/chaos.jpg (or the 'chaos' image uploaded in the art editor)
const artKey = d => d.type === 'chaos' ? 'chaos' : d.id;
function buildArtCSS() {
  const rules = [boardCSS(), matCSS(), ...Object.keys(DEFS).map(id => {
    const key = artKey(DEFS[id]), layers = [];
    if (ART[key]) layers.push(`url("${ART[key]}")`);
    if (ART_FOLDER) layers.push(`url("art/${key}.png")`, `url("art/${key}.jpg")`);
    if (!layers.length) return '';
    layers.push('linear-gradient(135deg,var(--band),#00000055)');
    return `.card .c-art.art-${id}{background-image:${layers.join(',')}}`;
  })];
  $('#art-css').textContent = rules.join('\n');
}
function saveArt() {
  let ok = true;
  try { localStorage.setItem(ART_KEY, JSON.stringify(ART)); } catch (e) { ok = false; }
  buildArtCSS();

}

/* ---------------- online play ----------------
   One browser is the host: it creates a room, runs the whole game (rules, AI seats) and sends every other
   player a snapshot of the table after each change. Guests only draw that snapshot, send their clicks
   (play / buy / end turn …) back as actions, and answer the questions the host forwards to them (humanChoose).
   Transport: PeerJS (WebRTC, free public broker, no sign-up), loaded only when someone goes online.
   Testing: add ?net=bc to the URL and every tab in the same browser talks over a BroadcastChannel instead. */
const PEERJS_URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const ROOM_PREFIX = 'wizardroyale-room-';
const NOOP = () => {};
const escHTML = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

// stand-in for PeerJS over a BroadcastChannel (?net=bc): same small API, same browser only
class BCPeer {
  constructor(id) {
    this.id = id || 'bc-' + Math.random().toString(36).slice(2, 9); this.h = {}; this.conns = {};
    this.bc = new BroadcastChannel('wizardroyale-net');
    this.bc.onmessage = e => this.msg(e.data);
    setTimeout(() => this.emit('open', this.id), 10);
  }
  on(e, f) { this.h[e] = f; return this; }
  emit(e, ...a) { if (this.h[e]) this.h[e](...a); }
  connect(to) {
    const c = new BCConn(this, to, Math.random().toString(36).slice(2)); this.conns[c.cid] = c;
    this.bc.postMessage({ k: 'hello', from: this.id, to, cid: c.cid });
    return c;
  }
  msg(m) {
    if (m.to !== this.id) return;
    if (m.k === 'hello') {
      const c = new BCConn(this, m.from, m.cid); this.conns[m.cid] = c;
      this.emit('connection', c);
      setTimeout(() => { c.emit('open'); this.bc.postMessage({ k: 'ok', from: this.id, to: m.from, cid: m.cid }); }, 10);
      return;
    }
    const c = this.conns[m.cid]; if (!c) return;
    if (m.k === 'ok') c.emit('open');
    else if (m.k === 'd') c.emit('data', m.d);
    else if (m.k === 'x') { delete this.conns[m.cid]; c.open = false; c.emit('close'); }
  }
  destroy() { for (const c of Object.values(this.conns)) c.close(); this.bc.close(); }
}
class BCConn {
  constructor(p, peer, cid) { this.p = p; this.peer = peer; this.cid = cid; this.h = {}; this.open = false; }
  on(e, f) { this.h[e] = f; return this; }
  emit(e, ...a) { if (e === 'open') this.open = true; if (this.h[e]) this.h[e](...a); }
  send(d) { if (this.open) this.p.bc.postMessage({ k: 'd', from: this.p.id, to: this.peer, cid: this.cid, d }); }
  close() { if (!this.p.conns[this.cid]) return; this.p.bc.postMessage({ k: 'x', from: this.p.id, to: this.peer, cid: this.cid }); delete this.p.conns[this.cid]; this.open = false; this.emit('close'); }
}

const NET = {
  role: null,        // null = offline · 'host' · 'guest'
  phase: 'lobby',    // host: 'lobby' while players gather, 'game' once dealt
  peer: null, code: '', name: '',
  conns: new Map(),  // host: peer id → connection
  guests: [],        // host lobby: [{ cid, name, peer }]
  host: null,        // guest: connection to the host
  lobbyNames: [],    // guest: names shown in the waiting room
  asks: new Map(), askSeq: 0,
  tracking: false, quiet: 0, timer: null,

  isTest: () => new URLSearchParams(location.search).get('net') === 'bc',
  cid() {
    let id = null;
    try { id = sessionStorage.getItem('wizardroyale-cid'); } catch (e) {}
    if (!id) { id = Math.random().toString(36).slice(2, 12); try { sessionStorage.setItem('wizardroyale-cid', id); } catch (e) {} }
    return id;
  },
  savedName() { try { return localStorage.getItem('wizardroyale-name') || ''; } catch (e) { return ''; } },
  saveName(n) { try { localStorage.setItem('wizardroyale-name', n); } catch (e) {} },
  roomLink(code) {

  loadPeer() {

  newPeer(id) {

  },
  sendConn(conn, msg) { try { if (conn && conn.open) conn.send(JSON.stringify(msg)); } catch (e) { console.warn('send failed', e); } },
  send(msg) { // host → every guest · guest → host

  sendTo(p, msg) { if (NET.role === 'host' && p && p.peer) NET.sendConn(NET.conns.get(p.peer), msg); },

  /* ---- snapshots: the table as JSON. Cards go as their id plus whatever differs from the

  pack(root, viewer) {

      if (v === undefined) return null;
      if (v === null) return null;

      if (ids.has(v)) return { $r: ids.get(v) };

      const pi = PL.get(v);

      if ('$a' in x) { const a = []; T[x.$a] = a; for (const e of x.v) a.push(up(e)); return a; }
      const o = x.$c && DEFS[x.$c] ? { ...DEFS[x.$c] } : {};

  packArg(a) {

  unpackArg(a) {

  /* ---- host side ---- */

  flush() {

  fx(k, args) { // an animation / sound / pop-up: guests replay it right after the snapshot it belongs to

  wrapFX() { // host: every FX call and sound is also sent to the guests (not the end-of-game ones: guests work those out)

  async createRoom(name) {

    const tryOpen = (left) => {

        <li>${avatar(NET.name)}<b>${escHTML(NET.name)}</b> <span class="seattag">เจ้าภาพ (คุณ)</span></li>
        ${NET.guests.map(g => `<li>${avatar(g.name)}<b>${escHTML(g.name)}</b> <span class="seattag">เพื่อน</span></li>`).join('')}
        ${humans < 2 ? '<li class="waiting">รอเพื่อนเข้าห้อง…</li>' : ''}
      </ol>
      <label class="fld" for="lob-ai">เติมผู้เล่น AI<select id="lob-ai">${Array.from({ length: maxAI + 1 }, (_, k) => `<option value="${k}" ${k === aiSel ? 'selected' : ''}>${k === 0 ? 'ไม่เติม' : k + ' ตัว'} (รวม ${humans + k} ผู้เล่น)</option>`).join('')}</select></label>
      <div class="ts-row"><button class="btn xl" id="lob-start">เริ่มเกม</button><button class="btn ghost xl" id="lob-close">ปิดห้อง</button></div>
      <div class="msub" id="lob-msg"></div>
    </div>`;
    const check = () => { const ok = humans + +$('#lob-ai').value >= 2; $('#lob-start').disabled = !ok; $('#lob-msg').textContent = ok ? '' : 'ต้องมีอย่างน้อย 2 ผู้เล่น: รอเพื่อน หรือเติม AI'; };
    $('#lob-ai').onchange = check; check();
    $('#m-opts').onclick = e => {
      if (e.target.id === 'lob-copy') {
        const txt = link || NET.code;
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { e.target.textContent = 'คัดลอกแล้ว ✓'; },
          () => { const i = $('#lob-link'); if (i) { i.select(); document.execCommand('copy'); e.target.textContent = 'คัดลอกแล้ว ✓'; } });
      } else if (e.target.id === 'lob-start' && !e.target.disabled) NET.startOnline(+$('#lob-ai').value);
      else if (e.target.id === 'lob-close') NET.leave();
    };
  },
  startOnline(nAI) {
    NET.phase = 'game';
    const guests = NET.guests.filter(g => NET.conns.has(g.peer));
    $('#modal').hidden = true; $('#m-opts').onclick = null;
    guests.forEach((g, k) => NET.sendConn(NET.conns.get(g.peer), { t: 'seat', seat: k + 1 }));
    G = null;
    startGame(NET.name, nAI, guests);
    if (G) { guests.forEach((g, k) => { G.players[k + 1].cid = g.cid; }); if (!guests.length) G.online = false; }
  },

  /* ---- guest side ---- */
  async join(code, name) {
    code = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return NET.showJoin('', 'ใส่รหัสห้องก่อน');
    NET.name = name; NET.saveName(name); NET.code = code;
    NET.role = 'guest';
    statEvent('room-join', 'เข้าห้องเพื่อน');
    NET.status(`กำลังเข้าห้อง ${code}…`);
    try { await NET.loadPeer(); } catch (e) { return NET.fail('โหลดระบบออนไลน์ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', code); }
    const peer = NET.newPeer(); NET.peer = peer;
    let opened = false;
    const timer = setTimeout(() => { if (!opened) NET.fail('เชื่อมต่อห้องไม่สำเร็จ: เจ้าภาพอาจปิดห้องไปแล้ว หรือเครือข่ายบล็อกการเชื่อมต่อ', code); }, 20000);
    peer.on('open', () => {
      const conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
      NET.host = conn;
      conn.on('open', () => { opened = true; clearTimeout(timer); NET.sendConn(conn, { t: 'hello', name, cid: NET.cid() }); NET.status('เชื่อมต่อแล้ว รอเจ้าภาพ…'); });
      conn.on('data', d => { try { NET.guestData(typeof d === 'string' ? JSON.parse(d) : d); } catch (e) { console.warn(e); } });
      conn.on('close', () => NET.hostLost());
      conn.on('error', () => NET.hostLost());
    });
    peer.on('error', e => {
      clearTimeout(timer);
      if (e.type === 'peer-unavailable') NET.fail(`ไม่พบห้อง ${code} ตรวจรหัสอีกครั้ง หรือให้เจ้าภาพสร้างห้องใหม่`, code);
      else if (!opened) NET.fail('เชื่อมต่อไม่สำเร็จ (' + (e.type || e) + ')', code);
    });
  },
  guestData(m) {
    if (m.t === 'lobby') { NET.lobbyNames = m.names; if (!G || !G.players || G.over) NET.showWaiting(); }
    else if (m.t === 'full') { NET.left = true; NET.fail(m.msg, NET.code); NET.close(); }
    else if (m.t === 'seat') { ME = m.seat; $('#modal').hidden = true; $('#m-opts').onclick = null; G = null; }
    else if (m.t === 'state') {
      const old = G; G = NET.unpack(m.s);
      G.prevLoc = old && old.players && old.players.length === G.players.length ? old.prevLoc : null;
      G.animUid = (old && old.animUid) || 0;
      render();
    }
    else if (m.t === 'fx') NET.replay(m.k, m.a);
    else if (m.t === 'ask') {
      const opts = m.opts.map((o, i) => ({ label: o.label, ghost: o.ghost, card: o.card ? NET.unpack(o.card) : null, value: i }));
      localChoose(m.title, opts, m.sub).then(i => NET.send({ t: 'ans', id: m.id, i }));
    }
    else if (m.t === 'finish') { if (G) showFinal(); }
  },
  replay(k, a) {
    if (!G || !G.players) return;
    let args; try { args = a.map(NET.unpackArg); } catch (e) { return; }
    try {
      if (k === 'aud') AUD.play(args[0], args[1] == null ? undefined : args[1]);
      else if (k === 'ev') showEvent(...args);
      else if (k === 'rev') showReveal(...args);
      else if (typeof FX[k] === 'function') { const r = FX[k](...args); if (r && r.catch) r.catch(NOOP); }
    } catch (e) { console.warn('fx', k, e); }
  },
  showWaiting() {
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide'); titleMode(true);
    $('#m-title').textContent = `ห้อง ${NET.code}`;
    $('#m-sub').textContent = 'เข้าห้องแล้ว รอเจ้าภาพเริ่มเกม…';
    $('#m-opts').innerHTML = `<div class="lobby"><div class="sect-label">ผู้เล่นในห้อง (${NET.lobbyNames.length}/5)</div>
      <ol class="lobby-list">${NET.lobbyNames.map((n, i) => `<li>${avatar(n)}<b>${escHTML(n)}</b> ${i === 0 ? '<span class="seattag">เจ้าภาพ</span>' : n === NET.name ? '<span class="seattag">คุณ</span>' : ''}</li>`).join('')}</ol>
      <div class="lob-wait">รอเจ้าภาพเริ่มเกม…</div>
      <div class="lobby-btns"><button class="btn ghost" id="lob-leave">ออกจากห้อง</button></div></div>`;
    $('#m-opts').onclick = e => { if (e.target.id === 'lob-leave') NET.leave(); };
  },
  hostLost() {
    if (NET.role !== 'guest' || NET.left) return;
    NET.left = true;
    const code = NET.code;
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide'); titleMode(true);
    $('#m-title').textContent = 'การเชื่อมต่อหลุด';
    $('#m-sub').textContent = 'ติดต่อเจ้าภาพไม่ได้แล้ว (เจ้าภาพอาจปิดหน้าเกม หรือเน็ตหลุด) ถ้าห้องยังเปิดอยู่ กดเข้าใหม่ได้ ที่นั่งเดิมจะกลับมาเป็นของคุณ';
    $('#m-opts').innerHTML = '<button class="btn" id="re-join">เข้าห้องอีกครั้ง</button> <button class="btn ghost" id="re-home">กลับหน้าแรก</button>';
    $('#m-opts').onclick = e => {
      if (e.target.id === 're-join') { NET.close(); NET.left = false; G = null; render(); NET.join(code, NET.name); }
      if (e.target.id === 're-home') NET.leave();
    };
  },

  /* ---- shared ---- */
  status(msg) {
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide'); titleMode(true);
    $('#m-title').textContent = 'ออนไลน์'; $('#m-sub').textContent = msg;
    $('#m-opts').innerHTML = '<button class="btn ghost" id="st-cancel">ยกเลิก</button>';
    $('#m-opts').onclick = e => { if (e.target.id === 'st-cancel') NET.leave(); };
  },
  fail(msg, code) {
    NET.close();
    if (code != null) return NET.showJoin(code, msg);
    showSetup(msg);
  },
  close() {
    NET.left = true;
    try { if (NET.host) NET.host.close(); } catch (e) {}
    for (const c of NET.conns.values()) try { c.close(); } catch (e) {}
    try { if (NET.peer) NET.peer.destroy(); } catch (e) {}
    NET.peer = null; NET.host = null; NET.conns.clear(); NET.guests = []; NET.asks.clear();
    NET.role = null; NET.phase = 'lobby';
  },
  leave() { // back to the start screen, offline
    NET.close();
    history.replaceState(null, '', location.pathname + location.search);
    location.reload();
  },
  showJoin(code = '', err = '') {
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide'); titleMode(true);
    $('#m-title').textContent = 'เข้าห้องเพื่อน';
    $('#m-sub').innerHTML = err ? `<span class="err">${escHTML(err)}</span>` : 'ใส่ชื่อของคุณ แล้วกดเข้าห้อง';
    $('#m-opts').innerHTML = `<div class="setup-grid" style="width:100%">
      <label class="fld" for="j-name">ชื่อพ่อมดของคุณ<input id="j-name" value="${escHTML(NET.name || NET.savedName() || 'Wizard')}" maxlength="20"></label>
      <label class="fld" for="j-code">รหัสห้อง<input id="j-code" class="codein" value="${escHTML(code)}" maxlength="8" placeholder="K7QXP" autocomplete="off"></label>
      </div>
      <div class="ts-row"><button class="btn xl" id="j-go">เข้าห้อง</button><button class="btn ghost xl" id="j-back">กลับ</button></div>`;
    $('#m-opts').onclick = e => {
      if (e.target.id === 'j-go') { NET.left = false; NET.join($('#j-code').value, $('#j-name').value.trim() || 'Wizard'); }
      if (e.target.id === 'j-back') NET.leave();
    };
    $('#m-opts').onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#j-go').click(); };
  },
};
// a sound only for player p (e.g. your own draw): played here if p is you, sent to p's browser if p is online
function soundFor(p, name) {
  if (!G || !p) return;
  if (p === meP()) AUD.play(name);
  else NET.sendTo(p, { t: 'fx', k: 'aud', a: [name, null] });
}
// the host's page closing ends the room for everyone
addEventListener('pagehide', () => { if (NET.role) NET.close(); });

/* ---------------- dev testing (run from the browser console; see CLAUDE.md) ----------------
   Both helpers switch animations, sound and AI pauses off while they run, then restore them. */
async function withoutFX(fn) {
  const saved = { fx: { ...FX }, play: AUD.play, delay: AI_DELAY };
  for (const k of Object.keys(FX)) if (typeof FX[k] === 'function') FX[k] = () => Promise.resolve();
  AUD.play = () => {}; AI_DELAY = 0;
  try { return await fn(); }
  finally { Object.assign(FX, saved.fx); AUD.play = saved.play; AI_DELAY = saved.delay; }
}

// await simulate(3) → plays 3 all-AI games (2, 3, 4 players…) and reports how each ended plus any errors
// 60 s per game: games got about twice as long on 2026-11-13; a timed-out game keeps running and spoils the next one
async function simulate(games = 3, { maxPlayers = 4, timeoutMs = 60000 } = {}) {
  const errors = [], onRej = e => errors.push(String(e.reason && e.reason.stack || e.reason));
  addEventListener('unhandledrejection', onRej);
  const results = [];
  try {
    await withoutFX(async () => {
      for (let g = 0; g < games; g++) {
        $('#modal').hidden = true;
        newGame('Test', 1 + (g % (maxPlayers - 1)));
        G.players[0].isAI = true;
        G.players.forEach(p => { p.familiar = p.famChoices[0]; });
        const myG = G, t0 = performance.now();
        let timedOut = false, timer;
        await Promise.race([runGame().catch(e => errors.push(e.stack)),
          new Promise(r => { timer = setTimeout(() => { timedOut = true; G = null; r(); }, timeoutMs); })]);
        clearTimeout(timer);
        results.push({ players: myG.players.length, ended: myG.ending || (timedOut ? 'TIMEOUT' : 'unknown'),
          ms: Math.round(performance.now() - t0),
          bought: Object.fromEntries(Object.keys(DEFS).map(id => [id, myG.players.reduce((s, p) => s + [...p.deck, ...p.hand, ...p.discard, ...p.ongoing].filter(c => c.id === id).length, 0)]).filter(([, n]) => n)) });
      }
    });
  } finally { removeEventListener('unhandledrejection', onRej); $('#modal').hidden = true; }
  if (DUP_IDS.length) errors.push('duplicate card ids (later def replaced earlier): ' + DUP_IDS.join(', '));
  return { ok: !errors.length && results.every(r => r.ended !== 'TIMEOUT'), results, errors };
}

// await testCard('sp01', { hp: 10 }) → plays one card for player 1 in a fresh game, returns before/after
async function testCard(id, { hp = 15, oppHp = 15, players = 3, setup } = {}) {
  return withoutFX(async () => {
    $('#modal').hidden = true;
    newGame('Test', players - 1);
    G.players.forEach(p => { p.isAI = true; p.familiar = p.famChoices[0]; p.hp = oppHp; });
    const p = G.players[0]; p.hp = hp; G.cur = 0;
    G.turn = { power: 0, played: [], shown: [], types: {}, attacked: false };
    if (setup) await setup(p, G);
    const snap = () => ({ power: G.turn.power, me: { hp: p.hp, hype: p.hype, highlights: p.highlights, hand: p.hand.length, deck: p.deck.length, discard: p.discard.length, ongoing: p.ongoing.length },
      opps: opps(p).map(o => ({ hp: o.hp, hype: o.hype, hand: o.hand.length, discard: o.discard.length })) });
    const card = make(id); p.hand.push(card);
    const before = snap(); before.me.hand -= 1; // the test card itself doesn't count
    await playCard(p, card);
    return { card: card.name, before, after: snap() };
  });
}

// a room link (…#room=K7QXP) opens straight on the join screen
const ROOM_IN_LINK = (location.hash.match(/room=([A-Za-z0-9]+)/) || [])[1];
if (ROOM_IN_LINK) NET.showJoin(ROOM_IN_LINK.toUpperCase()); else showSetup();

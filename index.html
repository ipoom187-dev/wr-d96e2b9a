<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Wizard Royale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@600&display=swap">
<style>
/* Layout: one-screen battle table — rivals across the top, the market in the middle, your hand at the bottom, battle log on the right */
:root{
  --bg:#141019; --panel:#1f1826; --panel2:#2a2032; --line:#3b2f46;
  --ink:#efe6d6; --mute:#a99bb0; --accent:#ff7a3d; --gold:#f0c35a;
  --hp:#e5485f; --def:#59c2c7; --paper:#efe3c8; --paper-ink:#2a1f1a;
  --felt1:#33203f; --felt2:#160d1c; --wood:#4a2d1c;
  --t-starter:#8a8079; --t-spell:#d4502f; --t-creature:#4f9a4a; --t-treasure:#c99a2e;
  --t-wizard:#6a5bd1; --t-location:#2f8f93; --t-legend:#a3243b; --t-wild:#c23f9a;
  --t-bent:#6b5a45; --t-familiar:#d0679b; --t-chaos:#26202b;
  --f-display:"Pirata One", "Kanit", "Georgia", serif; /* Kanit draws the Thai letters Pirata One lacks */
  --f-body:"Chakra Petch", "Tahoma", "Leelawadee UI", sans-serif;
  --f-thname:"Kanit", "Chakra Petch", "Tahoma", sans-serif; /* Thai card names */
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(ellipse at 50% -20%, #3a1d2e 0%, transparent 60%);}
button{font-family:inherit}
.app{display:flex;flex-direction:column;gap:12px;padding:4px 16px 12px;min-height:100%}
/* settings: a gear on the board's top-right corner opens a small menu (AI speed, sound, music, art, rules, new game) */
.settings{position:fixed;top:6px;right:8px;z-index:48;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:#1a1220e6;color:var(--gold);font-size:19px;line-height:1;
  cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 10px #000a}
.gear:hover,.gear[aria-expanded="true"]{background:var(--gold);color:#2a1d05}
.setmenu{display:flex;flex-direction:column;gap:6px;min-width:190px;padding:10px;border-radius:10px;background:var(--panel);
  border:1px solid var(--gold);box-shadow:0 12px 40px #000c}
.setmenu .btn{text-align:left;width:100%}
.setmenu .vol{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;color:var(--mute);padding:4px 2px 0}
.setmenu .vol span{color:var(--gold);font-variant-numeric:tabular-nums}
.setmenu .vol input{width:100%;accent-color:var(--gold)}
.sm-title{font-family:var(--f-display);font-size:20px;color:var(--gold);line-height:1;margin-bottom:2px}
.btn{background:var(--accent);color:#1a0f0a;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.sect-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
/* tabletop, scrolling layout (phones and small windows): the board, then the rivals' panels, then your mat.
   Desktop screens use the one-screen stage instead: see the "one-screen stage" block at the end of this sheet. */
.table{display:grid;gap:12px;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "seats" "you";align-content:start}
.seats{grid-area:seats;display:flex;flex-wrap:wrap;gap:10px;min-width:0;padding-top:6px}
.seats .rival{flex:1 1 230px;min-width:0;padding:8px 10px;flex-direction:row;align-items:center;gap:10px}
.seats .rival>.turnpill{position:absolute;top:-9px;right:8px;z-index:2}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stage-bg,.you-gap{display:none}
.midrow,.hand-zone .slot,.ong-zone .slot{display:contents}
.chal .ct{margin-right:4px}
.chal .cs{display:none}
/* whose turn it is: that panel lifts, glows and gets a "กำลังร่ายเวท" pill */
.seats .rival{transition:transform .25s,background .25s}
.seats .rival.active{transform:translateY(-6px);border-color:var(--accent);border-width:2px 2px 2px 5px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 24%, var(--panel)), var(--panel) 85%)}
.turnpill{font-size:11px;font-weight:700;color:#1a0f0a;background:var(--accent);border-radius:999px;padding:1px 9px;white-space:nowrap}
.rival .rname{flex-wrap:wrap;align-items:center}
.rival .rbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rival .rbtns .linkbtn{padding:2px 8px}
.ongmark{border:0;border-radius:999px;background:#2f8f93;color:#fff;font:inherit;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer}
.ongmark:hover{background:#3aa9ae}
.seats .rival{position:relative}
/* the token count sits on the panel's top-right corner, half over its border, so it never pushes the name row */
.hprow{display:flex;align-items:center;gap:8px}
.hprow .hpbar{flex:1}
.trait.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rival{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rival.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 0 24px #ff7a3d33}
.seatdir{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rival .ong{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.linkbtn:hover{border-color:var(--gold);color:var(--gold)}
.boardc{grid-area:board;min-width:0;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2));
  border:10px solid var(--wood);box-shadow:0 0 0 2px var(--gold) inset,0 10px 40px #000a}
.arena{border:1px solid color-mix(in srgb, var(--gold) 28%, transparent);border-radius:14px;padding:10px 12px;
  background:radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);transition:box-shadow .3s}
.arena.busy{box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 32px color-mix(in srgb, var(--accent) 22%, transparent)}
.goldbox{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:10px;padding:8px 12px;
  border-radius:12px;border:2px solid var(--gold);background:radial-gradient(ellipse at 30% 30%, #f0c35a33, #1a1220 75%);
  box-shadow:0 0 22px #f0c35a55, 0 0 0 1px #000 inset}
.goldbox .coin{grid-row:1/3;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff6c8, #f0c35a 45%, #a8741c 100%);box-shadow:0 0 0 2px #7a520f inset,0 2px 6px #000a}
.goldbox .arena-pw{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.9;color:var(--gold);text-shadow:0 0 14px #f0c35a99,0 2px 0 #000;
  font-variant-numeric:tabular-nums}
.goldbox small{font-size:11px;letter-spacing:.06em;color:#f3e2b5}
.goldbox.bump{animation:goldbump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes goldbump{0%{transform:scale(1)}40%{transform:scale(1.14);box-shadow:0 0 40px #f0c35acc}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.goldbox.bump{animation:none}}
/* casting arena keeps one fixed size: one row of cards that are all --arena-h tall (long ability text shrinks to fit,
   see fitNames); the ✲ button sits over the bottom of its card; when the row is full the cards overlap instead of wrapping */
.arena{--arena-h:var(--card-h)}
.arena{display:flex;align-items:center;gap:14px}
.arena .cards.played{flex:1;min-width:0;flex-wrap:nowrap;align-items:flex-start;height:var(--arena-h);gap:6px;
  /* the last slot is squeezed to 12px but its card is a full --card-w wide: keep that room inside the row, and clip
     anything beyond it, so stacked cards never spill onto the gold counter, the ✲ buttons or End Turn */
  padding-right:calc(var(--card-w) - 12px);overflow-x:clip;overflow-y:visible}
.arena-actions{flex:none;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:150px;position:relative;z-index:6}
.arena-actions .btn{white-space:normal}
.arena-actions .end-btn{padding:14px 10px;font-size:17px}
.arena .act-wrap{position:relative}
.arena .act-wrap .act-btn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.arena .cards.played>.slot{flex:0 1 var(--card-w);min-width:12px;position:relative}
.arena .cards.played>.slot:hover{z-index:5}
.arena .cards.played>.slot>.card,.arena .cards.played>.slot>.act-wrap{width:var(--card-w)}
.arena .cards.played .card{height:var(--arena-h);min-height:0;overflow:hidden}
.arena .cards.played .card .c-text{overflow:hidden}
.arena .cards.played>.empty{align-self:center}
/* the line between the shop and the arena: arena title (whose turn, power, events) on the left, pile counts on the right */
.boardbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px}
.boardbar .arena-title{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.boardbar .ev-btn{padding-top:2px;padding-bottom:2px;align-self:center}
.ev-btn{background:#3a2a1a;border-color:var(--gold);color:var(--gold);font-weight:700}
.ev-btn:hover{background:var(--gold);color:#2a1d05}
/* events viewer: one block per turn, this turn highlighted */
.ev-turn{border-top:1px solid var(--line);padding-top:10px}
.ev-turn.now h4{color:var(--accent)}
.ev-sub{font-size:11px;letter-spacing:.08em;color:var(--mute);margin:6px 0 4px}
.boardbar .piles{margin:0 0 0 auto;justify-content:flex-end;gap:6px 8px}
.pile-chip,.piles .pile-chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:linear-gradient(#2a1d34f2,#160e1cf2);
  border:1px solid #c8a14a99;color:#f3e7cf;font-size:14px;font-weight:600;line-height:1.3}
.pile-chip b,.piles .pile-chip b{color:var(--gold);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
button.pile-chip{cursor:pointer}
button.pile-chip:hover{border-color:var(--gold);background:linear-gradient(#3a2a44,#20142a)}
/* "what happened" strip: each affected card with a coloured caption */
.cards.events{gap:12px}
.ev{display:flex;flex-direction:column;align-items:center;gap:4px}
.ev-cap{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);max-width:112px;text-align:center;line-height:1.3}
.ev-gain .ev-cap{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.ev-bad .ev-cap{background:#5b2a7a;color:#fff;border-color:#8c4bb8}
.ev-discard .ev-cap{background:#3a3340;color:var(--ink)}
.ev-destroy .ev-cap{background:var(--hp);color:#fff;border-color:var(--hp)}
.ev-reveal .ev-cap,.ev-defend .ev-cap{background:var(--def);color:#06282a;border-color:var(--def)}
.ev-act .ev-cap{background:var(--accent);color:#1a0f0a;border-color:var(--accent)}
/* centre-screen pop-up of the latest affected cards (does not block clicks) */
#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;display:flex;gap:16px;flex-wrap:nowrap;justify-content:center;max-width:96vw}
@media (max-width:760px){
  #pop{gap:8px} #pop .card{width:118px} #pop .card{--nf:14px} #pop .card .c-text{font-size:10px}
  #pop .ev-cap{font-size:11px;max-width:118px} #pop .pop-item:nth-last-child(n+4){display:none} /* latest 3 only */
}
#pop .pop-item{display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .32s cubic-bezier(.2,1.3,.4,1)}
#pop.out .pop-item{animation:popout .3s forwards}
#pop .ev-cap{font-size:15px;max-width:220px;padding:4px 12px;box-shadow:0 4px 14px #000a}
#pop .card{width:200px;box-shadow:0 18px 50px #000d}
#pop .card{--nf:21px}
#pop .card .c-text{font-size:13px}
@keyframes popin{from{transform:scale(.7) translateY(30px)}to{transform:none}} /* no opacity: visible even if animations are paused */
@keyframes popout{to{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#pop .pop-item,#pop.out .pop-item{animation:none}}
/* revealed cards (showReveal): a captioned row per reveal, upper middle of the screen, above the move pop-ups */
#rev{position:fixed;left:2vw;right:2vw;top:9vh;z-index:41;pointer-events:none;display:flex;flex-direction:column;gap:10px;align-items:center}
#rev .rev-group{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);box-shadow:0 0 0 1px var(--def),0 16px 40px #000c;animation:popin .32s cubic-bezier(.2,1.3,.4,1)}
#rev .ev-cap{background:var(--def);color:#06282a;border-color:var(--def);font-size:14px;max-width:none;padding:3px 12px}
#rev .rev-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:92vw}
#rev .card{width:118px}
#rev .rev-cards.many{gap:4px}
#rev .rev-cards.many .card{width:78px}
#rev .rev-cards.many .card .c-text,#rev .rev-cards.many .card .c-cost{display:none} /* many cards: the name is what matters */
#rev.out .rev-group{animation:popout .3s forwards}
@media (max-width:760px){#rev .card{width:92px}#rev .card .c-text{font-size:9px}#rev .rev-cards.many .card{width:62px}}
@media (prefers-reduced-motion:reduce){#rev .rev-group,#rev.out .rev-group{animation:none}}
.arena .card.fresh{animation:deal .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{0%{transform:translateY(-50px) rotate(-8deg) scale(1.3);opacity:0;filter:brightness(2.4)}
  55%{transform:translateY(4px) rotate(1deg) scale(1.03);opacity:1;filter:brightness(1.4);box-shadow:0 0 0 3px var(--gold),0 0 44px var(--band)}
  100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.arena .card.fresh{animation:none}}
/* a new Line-Up card flies over from the main pile, face down, and turns over as it lands (animateLineup) */
.market .card.refill{position:relative;z-index:40;pointer-events:none;animation:linein .7s cubic-bezier(.35,.35,.6,1) backwards}
@keyframes linein{0%{transform:translate(var(--fx),var(--fy)) perspective(800px) rotateY(180deg) scale(.35);opacity:0;filter:brightness(.2)}
  12%{opacity:1}
  58%{transform:translate(0,-16px) perspective(800px) rotateY(90deg) scale(1.08);opacity:1;filter:brightness(.45)}
  80%{transform:translate(0,0) perspective(800px) rotateY(-7deg) scale(1.06);filter:brightness(1.45);box-shadow:0 0 0 3px var(--gold),0 0 36px var(--gold)}
  100%{transform:translate(0,0) perspective(800px) rotateY(0) scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.market .card.refill{animation:none}}
.arena-title{font-family:var(--f-display);font-size:22px;color:var(--gold);margin-bottom:8px}
.arena-title span{font-family:var(--f-body);font-size:13px;color:var(--ink)}
.rival .rname{display:flex;align-items:baseline;gap:8px}
.rival .rname b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--pc,var(--ink))}
.pname{font-weight:600}
.trait{font-size:11px;color:var(--gold)}
.hpbar{height:10px;background:#000a;border-radius:5px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s;position:relative;z-index:1}
.hpbar .hpghost{position:absolute;left:0;top:0;bottom:0;background:#fff4e0;box-shadow:0 0 8px #ffffffaa;animation:hpdrain 1.1s ease-in forwards}
@keyframes hpdrain{0%,35%{width:var(--from)}100%{width:var(--to)}}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px);background:#5a1a26}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
/* market: the board's top row holds every card for sale — 3 Stars and the 5-card Line-Up. The 9 cards
   share the row's width (up to 140px each, at least 96px; below that the row wraps, e.g. on phones) */
.market{container-type:inline-size;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:center;
  --card-w:max(96px, min(140px, calc((100cqw - 100px) / 9)));--card-h:calc(var(--card-w) * 1.8)}
.market .cards{gap:8px}
/* phones: three cards per line instead of two */
@container (max-width:640px){.market .mgroup{--card-w:calc((100cqw - 32px) / 3);--card-h:calc(var(--card-w) * 1.8)}}
.market .card{--nf:clamp(12px, calc(var(--card-w) * 0.12), 17px)} /* narrower cards get a smaller name and header */
/* shop cards drop the footer (its tags repeat the ability text): VP moves to a badge on the picture, leaving the text more room */
.market .card:not(.t-chaos) .c-type{max-width:calc(100% - 40px)}
.mgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.mgroup .cap{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgroup .cap b{color:var(--gold)}
/* the Stars sit on their own tinted tile so they read apart from the Line-Up */
.mg-legend{padding:4px 6px 6px;margin:-4px 0 -6px -6px;border-radius:10px;
  border:1px solid color-mix(in srgb, var(--t-legend) 60%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--t-legend) 26%, transparent), transparent 90%)}
/* pile counts (in .boardbar) */
.piles{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;justify-content:center}
.piles b{color:var(--ink)}
.piles .final-tag{color:#2a1d05;background:var(--gold);border-radius:999px;padding:1px 10px;font-weight:700}
/* cards */
.cards{display:flex;gap:8px;flex-wrap:wrap}
/* every card (hand, market, pop-ups, dialogs, zoom…) has one shape, 1 wide : 1.8 tall, like the zoomed card */
.card{--nf:17px;width:132px;aspect-ratio:1/1.8;min-height:0;overflow:hidden;background:var(--paper);color:var(--paper-ink);border-radius:8px;display:flex;flex-direction:column;
  border:3px solid var(--band,#888);position:relative;cursor:default;user-select:none;transition:transform .12s}
.card .c-head{display:flex;align-items:center;gap:6px;background:var(--band);color:#fff;padding:4px 6px}
/* the header is always two name-lines tall (--nf = the name's font size), so 1- and 2-line names line up */
.card:not(.t-chaos) .c-head{height:calc(var(--nf) * var(--hl, 2.1) + 8px);flex:none}
.card .c-cost{min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1d05;display:grid;place-items:center;font-weight:700;font-size:13px}
.card .c-cost:empty{display:none}
.card .c-name{font-family:var(--f-display);font-size:var(--nf);line-height:1.05}
.card .c-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;color:#6d5c52;border-bottom:1px dashed #c9b894}
.card .c-text{font-size:10.5px;line-height:1.3;padding:5px 6px;flex:1;overflow:hidden;min-height:0;position:relative}
.card .c-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;gap:4px}
/* the square picture carries the type label over its bottom edge, which leaves the ability text more room.
   fitNames() shrinks long ability text, and text that still does not fit ends in an "อ่านเพิ่มเติม" button (opens the zoom) */
.card:not(.t-chaos) .c-art{flex:none}
.card:not(.t-chaos) .c-type{font-size:9px;height:2.1em;line-height:2.1em;margin-top:-2.1em;padding:0 7px;align-self:flex-start;position:relative;z-index:1;
  border:0;border-radius:0 6px 0 0;background:#000b;color:#f3e7cf;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* board cards (Stars, Line-Up, casting arena) share one width */
.boardc{--card-w:140px;--card-h:calc(var(--card-w) * 1.8)}
.boardc .card:not(.t-chaos):not(.mini){width:var(--card-w);height:var(--card-h)}
.card .more-btn{position:absolute;right:0;bottom:0;border:0;padding:1px 6px 0 20px;cursor:zoom-in;
  background:linear-gradient(90deg,transparent,var(--paper) 16px);color:#5a1d14;font:inherit;font-size:10.5px;font-weight:700;text-decoration:underline}
.card .more-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

.avatar .famchip{position:absolute;right:-4px;bottom:2px;z-index:3;width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--pc,var(--gold));

#board.no-bl .you{grid-column-start:1} #board.no-br .you{grid-column-end:-1}
.youbar{display:contents}
.you .avatar{grid-row:1 / 3;grid-column:1;align-self:end;width:min(calc(var(--cw) * 1.4), calc(var(--hand-h) / 1.07))}
.you .you-info{grid-column:2;flex:none}
.you .you-name{font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.you .you-name .hprow{font-family:var(--f-body);font-size:13px;width:150px}
.you .stats{font-size:12px;gap:4px;flex-wrap:nowrap}
.you .stats span{padding:1px 8px}
.you-gap{display:block;grid-column:3}
.youbar .pilebtns{grid-column:4;margin:0;flex-wrap:nowrap}
.you .pilebtns .linkbtn{padding:4px 9px;font-size:12px;white-space:nowrap}
.zones{grid-column:2 / 5;grid-row:2;gap:10px;align-items:end}
.zones .sect-label{display:none}
.zones .card:not(.small){width:var(--card-w);--nf:clamp(12px, calc(var(--card-w) * .12), 17px)}
.zones .card.small{width:calc(var(--card-w) * .8);--nf:clamp(11px, calc(var(--card-w) * .1), 15px)}
.fam-wrap{width:auto;display:grid;grid-template-columns:var(--card-w) auto;grid-auto-rows:min-content;align-content:end;gap:5px 6px}
.fam-wrap>.card{grid-row:1 / span 3}
.fam-wrap>.btn{grid-column:2;padding:5px 7px;font-size:12px;white-space:nowrap}
.you .hand-zone .cards,.ong-zone .cards{flex-wrap:nowrap;gap:6px}
.hand-zone .slot,.ong-zone .slot{display:block;min-width:26px;position:relative}
.hand-zone .slot{flex:0 1 var(--card-w)} .ong-zone .slot{flex:0 1 calc(var(--card-w) * .8)}
.hand-zone .slot:last-child,.ong-zone .slot:last-child{flex-shrink:0}
.hand-zone .slot:hover,.ong-zone .slot:hover{z-index:5}
.ong-zone{max-width:min(30vw, calc(var(--card-w) * 2.6))}
.ong-zone .act-wrap{position:relative}
.ong-zone .act-wrap .act-btn{position:absolute;left:3px;right:3px;bottom:5px;padding:3px 2px;font-size:11px}
}
/* ---------------- UI polish (2026-11-15) ----------------
   One look for every info bit on the table: gold section banners with small number pills (.cp), dark "plates" with a gold
   hairline, stat pills with an icon and a big number (.st, .ptile). Comes last so it wins over both layouts above. */
.table,.dialog{--plate:linear-gradient(180deg,#24182ef2,#120b17f2);--hair:#c8a14a66;--pill:#0d0812c4}
/* section banners: shop groups */
.mgroup .cap{display:flex;align-items:center;gap:5px;font-size:12px;line-height:18px;color:#d9c9e6;overflow:hidden}
.mgroup .cap b{flex:none;font-family:var(--f-thname);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--gold);
  text-shadow:0 1px 0 #000,0 0 10px #f0c35a55;white-space:nowrap}
.cp{flex:none;display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;line-height:1;
  white-space:nowrap;background:var(--pill);border:1px solid #ffffff24;color:#ece2f6;font-variant-numeric:tabular-nums}
.cp-gold{border-color:#f0c35a99;color:#ffe3a0;background:#3a2a10c4}
.cp-hot{border-color:#ff7a3d99;color:#ffb38a}
.cp-host{border-color:var(--pc);color:var(--pc);background:color-mix(in srgb, var(--pc) 16%, #0d0812)}
/* Star challenges: the strip fills with gold as the goal gets closer */
/* Star challenges: a quest tag under each Star: 🎯 seal, the goal, then progress (your turn) or the reward (−3);
   a gold bar along the bottom fills as the goal gets closer, and a met challenge glows gold with ✓ */
.chal{position:relative;display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;
  background:linear-gradient(180deg,#2a1f36f2,#150e1cf2);border:1px solid #8a6fb0aa;border-left:3px solid var(--gold);color:#f4ecfc;
  box-shadow:inset 0 1px 0 #ffffff12,0 3px 8px #0009}
.chal::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);border-radius:0 2px 2px 0;
  background:linear-gradient(90deg,#c48a22,#ffd36a);box-shadow:0 0 6px #f0c35a99}
.chal .ci{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;
  background:radial-gradient(circle at 35% 30%,#fff2c4,#f0c35a 50%,#a8741c);box-shadow:0 0 0 1px #7a520f,0 1px 3px #000a}
.chal .ct{min-width:0;font-weight:600}
.chal b.cn{float:none!important;margin:0!important;padding:0 6px;border-radius:999px;font-size:11px;line-height:16px;font-variant-numeric:tabular-nums;
  background:#0d0812d0;border:1px solid #f0c35a88;color:#ffe3a0}
.chal b.cd{border-color:#7fd88a99;color:#a8f0b2}
.chal.done{border-color:var(--gold);background:linear-gradient(180deg,#5a4214f2,#2a1d08f2);box-shadow:0 0 0 1px #f0c35a88,0 0 14px #f0c35a88}
.chal.done b.cn{background:var(--gold);color:#2a1d05;border-color:#fff2c4}
/* sponsor contracts: a small gold-trimmed plaque */
.sp-tile{background:linear-gradient(180deg,#2c2018f2,#160f0bf2);border:1px solid #c8a14a88;box-shadow:inset 0 1px 0 #ffffff14,0 4px 10px #0008}
.sp-name{font-family:var(--f-thname);font-weight:600;color:#ffd77a}
.sp-text{color:#eee2cc}
.sp-tile .act-btn{background:linear-gradient(#f3c860,#c48a22);color:#2a1a05;border:1px solid #7a520f}
/* buttons that open a viewer */
.linkbtn{background:var(--pill,#0d0812c4);border-color:var(--hair,#c8a14a66);color:#efe2c4}
.linkbtn b{color:var(--gold);font-variant-numeric:tabular-nums}
.linkbtn:hover{background:#2a1d0f;border-color:var(--gold);color:var(--gold)}
/* the casting-arena caption and pile counts */
.arena-title .at-k{font-family:var(--f-thname);font-size:11px;font-weight:500;letter-spacing:.12em;color:#c3aed4}
.arena-title .at-who,.arena-title .at-who .pname{font-family:var(--f-thname);font-size:15px;font-weight:600;color:var(--ink)}
.pile-chip .pi{flex:none;width:18px;font-style:normal;font-size:14px;text-align:center;filter:drop-shadow(0 1px 0 #000)}
.pile-chip>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pile-chip b small{font-size:.68em;font-weight:600;color:#c9b27a}
/* HP bars: a bevelled red gauge */
.hpbar{border:1px solid #000;box-shadow:inset 0 1px 3px #000c}
.hpbar i{background:linear-gradient(180deg,#ff7186,#c4263f 60%,#8d1a2d)}
/* stat pills: icon, big number, label (your mat) */
.stats{align-items:center}
.stats .st{position:relative;display:inline-flex;align-items:baseline;gap:4px;padding:1px 9px 2px 7px;border-radius:999px;background:var(--pill);
  border:1px solid #ffffff1f;color:#cdbfd8;font-size:11.5px;line-height:18px;white-space:nowrap}
.stats .st>i{font-style:normal;font-size:12px}
.stats .st>b{font-size:15px;font-weight:700;color:#fff3dc;font-variant-numeric:tabular-nums}
.stats .st>b small{font-size:.8em;font-weight:700;color:inherit;margin-left:1px}
.stats .st>em{font-style:normal;margin-left:3px}
.stats .st-hype{border-color:#ff9a4a99;background:linear-gradient(#3a1a10d0,#1a0d0ad0);padding-bottom:4px}
.stats .st-hype>b{color:#ffb347;text-shadow:0 0 8px #ff7a3d88}
.st-hype .hmeter{position:absolute;left:9px;right:9px;bottom:2px;height:2px;padding:0!important;border:0!important;border-radius:2px;background:#ffffff1c;overflow:hidden}
.st-hype .hmeter i{display:block;height:100%;background:linear-gradient(90deg,#ff7a3d,#ffd36a)}
.chip{font-size:11.5px;line-height:16px;padding:2px 8px;border-radius:999px;background:var(--pill,#0d0812c4);border:1px solid #ffffff24;color:#ece2f6}
.chip-hl,.chip-star{border-color:#f0c35a99;color:#ffe3a0}
.chip-host{border-color:#3aa9ae;color:#9fe6e9}
.chip-deal{border-color:#c99a2e;color:#f3d59a}
/* School names: in the School's own colour, bold, on a tinted pill */
.schoolbtn[style*="--sc"],.pc-school[style*="--sc"]{color:var(--sc);font-family:var(--f-thname);font-weight:600;
  border-color:color-mix(in srgb, var(--sc) 75%, transparent)!important;background:color-mix(in srgb, var(--sc) 14%, #0d0812e6)!important;
  text-shadow:0 1px 0 #000,0 0 8px color-mix(in srgb, var(--sc) 45%, transparent)}
.schoolbtn[style*="--sc"]:hover,.pc-school[style*="--sc"]:hover{background:color-mix(in srgb, var(--sc) 26%, #0d0812e6)!important;border-color:var(--sc)!important}
.sv-school{color:var(--sc);font-family:var(--f-thname);font-weight:600;font-size:.85em;text-shadow:0 0 10px color-mix(in srgb, var(--sc) 45%, transparent)}
.chip.schoolbtn{margin:0;font-size:12px}
/* rivals: Hype and Highlights as badges at the character's feet (left), across from the familiar chip (right) */
.avatar .rbadges{position:absolute;left:-4px;bottom:2px;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rbadges>span{font-size:11.5px;font-weight:700;line-height:17px;padding:0 6px;border-radius:999px;background:#0b0810e6;
  border:1px solid #ff9a4a99;box-shadow:0 2px 6px #000a;white-space:nowrap;font-variant-numeric:tabular-nums}
.rbadges .hlmark{color:var(--gold);border-color:#f0c35a99}
.rbadges .deathmark{color:#e8e0f0;border-color:#9a8aa8aa;background:#1a1220e6}
.stats .st-death{border-color:#9a8aa899} .stats .st-death>b{color:#e8e0f0}
.pt-death{border-color:#9a8aa888} .pt-death>b{color:#e8e0f0}
/* right-hand rivals: the familiar chip moves to the left of the (mirrored) character, so the badges go right */
.rival.pos-tr .rbadges,.rival.pos-br .rbadges{left:auto;right:-4px;align-items:flex-end}
/* viewer dialogs (player info, School, piles, secrets…) */
#viewer .dialog{border:1px solid #c8a14a99;border-radius:14px;
  background:radial-gradient(ellipse at 50% -10%, #3a2340 0%, transparent 55%), linear-gradient(180deg,#1f1626,#140e19);
  box-shadow:0 0 0 1px #000,0 0 0 4px #2a1d0f,0 0 0 5px #c8a14a55,0 30px 80px #000e}
#viewer .dialog h2{color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px #f0c35a44}
#viewer [data-act="vclose"]{background:transparent;border:1px solid #c8a14a99;color:var(--gold)}
#viewer [data-act="vclose"]:hover{background:var(--gold);color:#2a1d05}
#viewer .msub{color:#c9b9d6}
#viewer .msub:empty{display:none}
.vgroup h4{padding-bottom:3px;border-bottom:1px solid #f0c35a33}
/* player info: a profile card with the character, HP and stat tiles */
.pcard{display:flex;gap:16px;align-items:stretch;width:100%;padding:12px;border-radius:12px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--pc) 22%, #1a1220), #140e19 70%);border:1px solid color-mix(in srgb, var(--pc) 60%, #c8a14a)}
.pc-pic{flex:none;width:120px;display:grid;place-items:end center;border-radius:10px;
  background:radial-gradient(circle at 50% 75%, color-mix(in srgb, var(--pc) 45%, transparent), transparent 70%)}
.pc-pic img{display:block;width:100%;max-height:180px;object-fit:contain;filter:drop-shadow(0 6px 8px #000a)}
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.pc-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:32px;line-height:1.05;color:var(--pc);text-shadow:0 2px 0 #000}
.pc-school{border:1px solid color-mix(in srgb, var(--pc) 70%, transparent);border-radius:999px;background:var(--pill);color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;padding:3px 12px;cursor:pointer}
.pc-school small{color:var(--gold);font-weight:400;margin-left:4px}
.pc-school:hover{border-color:var(--gold)}
.pc-hp{display:flex;align-items:center;gap:8px;width:min(100%, 360px)}
.pc-hp .hpbar{flex:1;height:14px;border-radius:7px}
.pc-hp b{font-size:22px;line-height:1;font-variant-numeric:tabular-nums} .pc-hp small{color:var(--mute)}
.ptiles{align-self:stretch;display:grid;grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));gap:6px}
.ptile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center;padding:6px 9px;
  border-radius:9px;background:var(--pill);border:1px solid #ffffff1c}
.ptile>i{grid-row:1 / 3;font-style:normal;font-size:19px}
.ptile>b{font-size:19px;line-height:1.1;color:#fff3dc;font-variant-numeric:tabular-nums}
.ptile>b small{font-size:.75em;color:inherit;margin-left:1px}
.ptile>span{font-size:11px;color:#b9a9c6}
.pt-hype{border-color:#ff9a4a88} .pt-hype>b{color:#ffb347}
.pt-gold{border-color:#f0c35a77} .pt-gold>b{color:var(--gold)}
@media (max-width:560px){.pcard{flex-direction:column}.pc-pic{width:100%;height:150px}.pc-pic img{height:100%;width:auto}}
/* School viewer: one framed block per player, rules as a starred list */
.schoolview{border:1px solid color-mix(in srgb, var(--pc) 45%, #3b2f46);border-left:4px solid var(--pc);border-radius:10px;padding:10px 14px;background:#ffffff06}
.schoolview.picked{background:color-mix(in srgb, var(--pc) 12%, #1a1220)}
.schoolview{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:start}
.schoolview>h4{grid-column:1 / -1}
.schoolview>.school-rules{grid-column:1;grid-row:2 / 4}
.schoolview>.ev-sub{grid-column:2;grid-row:2;margin-top:4px}
.schoolview>.cards{grid-column:2;grid-row:3}
.schoolview .card{width:118px}
@media (max-width:560px){.schoolview{display:flex}}
.school-rules{list-style:none;padding-left:0;font-size:14px}
.school-rules li{position:relative;padding-left:18px;margin:2px 0}
.school-rules li::before{content:'✦';position:absolute;left:0;color:var(--gold)}
/* the one-screen stage: plates around the left column, your info and the rivals' plates */
@media (min-width:1200px) and (min-height:600px){
.boardbar{padding:7px;border-radius:12px;background:var(--plate);border:1px solid var(--hair);box-shadow:inset 0 1px 0 #ffffff12,0 6px 18px #0009}
.boardbar .arena-title{flex-direction:column;align-items:stretch;gap:1px}
.boardbar .arena-title .waitpill{margin:2px 0 0}
.boardbar .ev-btn{margin-top:3px;align-self:stretch;text-align:center}
.boardbar .pile-chip{gap:6px;padding:3px 8px;border-radius:7px;font-size:12px;background:var(--pill);border-color:#c8a14a55}
.boardbar .pile-chip b{font-size:15px}
.boardbar .secret-chip{border-color:#f0c35a99}
.you .you-name .hprow{width:170px}
.you .hpbar{height:12px}
.you .stats{gap:5px}
.you .stats{min-width:0;overflow:hidden}
.you .stats span.st{padding:1px 9px 2px 7px;line-height:16px}
.you .stats .st-hype{padding-bottom:4px}
.you .stats .chip{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rival .rname{line-height:1.1}
.rival .rname b{font-size:20px}
.you .pilebtns .linkbtn{padding:4px 10px}
.rival .rinfo{background:var(--plate);border:1px solid color-mix(in srgb, var(--pc) 50%, #c8a14a88);border-top:3px solid var(--pc);
  box-shadow:0 6px 16px #000b;padding:3px 6px 5px;gap:3px}
.rival .rname b{text-shadow:0 2px 0 #000,0 0 12px color-mix(in srgb, var(--pc) 50%, transparent)}
.rival .hprow .hpnum{font-size:13px}
.rival .rbtns .schoolbtn{flex:1 1 auto;font-size:11.5px;line-height:17px}
.rival .rbtns .linkbtn{font-size:12px;line-height:17px;padding:0 6px;color:var(--gold)}
}
/* ---------------- turn hints (2026-11-15) ---------------- */
/* shop cards you can't afford on your turn go dark (full colour again on hover) and their price turns red */
.market .card.poor{filter:saturate(.35) brightness(.6);transition:filter .2s}
.market .card.poor:hover{filter:none}
.market .card.poor .c-cost{background:#6b1d28;color:#ffd0d6;box-shadow:0 0 0 2px #ff6b7f88}
/* End Turn glows and breathes when nothing is left to do */
.end-btn.ready{background:linear-gradient(180deg,#ffd36a,#ff9a3d 55%,#e0602f);box-shadow:0 0 0 2px #fff2c4,0 0 26px #ffb454;animation:endready 1.4s ease-in-out infinite}
@keyframes endready{50%{box-shadow:0 0 0 2px #fff2c4,0 0 42px #ffd36a;filter:brightness(1.12)}}
/* 5 HP or less: the bar pulses red */
.hpbar.low{box-shadow:inset 0 1px 3px #000c,0 0 8px #ff3b55aa}
.hpbar.low i{animation:lowhp 1s ease-in-out infinite}
@keyframes lowhp{50%{filter:brightness(1.7);box-shadow:0 0 10px #ff6b7f}}
@media (prefers-reduced-motion:reduce){.end-btn.ready,.hpbar.low i{animation:none}}
/* news strip: the last 3 log lines at the bottom right of the casting arena, behind the played cards */
.news{display:none}
.played-wrap{display:contents}
@media (min-width:1200px) and (min-height:600px){
.played-wrap{flex:1;min-width:0;display:flex;position:relative;align-self:stretch;align-items:center}
.arena .cards.played{position:relative;z-index:1}
.news{display:flex;flex-direction:column;align-items:flex-end;gap:2px;position:absolute;z-index:0;right:4px;bottom:2px;
  max-width:min(60%, 520px);pointer-events:none}
.nw{max-width:100%;padding:2px 10px;border-radius:999px;background:#0b0810b8;border:1px solid #ffffff14;font-size:12px;line-height:17px;color:#cbbcd8;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6}
.nw.new{opacity:1;color:var(--ink);border-color:#f0c35a66;animation:nwin .4s ease-out}
.nw-dmg.new{border-color:#ff6b7f88} .nw-good.new{border-color:#7fd88a88}
@keyframes nwin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.nw.new{animation:none}}
}
/* settings menu: a gold-framed panel, an icon on each row, separators between groups */
.setmenu{min-width:230px;padding:12px;gap:5px;border-radius:12px;background:linear-gradient(180deg,#24182ef7,#120b17f7);
  border:1px solid #c8a14a99;box-shadow:0 0 0 1px #000,0 0 0 4px #2a1d0f,0 0 0 5px #c8a14a44,0 16px 44px #000d}
.sm-title{font-size:24px;text-shadow:0 2px 0 #000,0 0 14px #f0c35a55;padding-bottom:4px;border-bottom:1px solid #f0c35a33;margin-bottom:4px}
.setmenu .btn.ghost{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;background:#0d0812b3;border-color:#ffffff1c;font-weight:600}
.setmenu .btn.ghost:hover{background:#2a1d0f;border-color:var(--gold);color:var(--gold);filter:none}
.setmenu .btn.ghost::before{flex:none;width:20px;text-align:center;font-size:15px}
.setmenu [data-act="speed"]::before{content:'⚡'} .setmenu [data-act="sfx"]::before{content:'🔊'}
.setmenu [data-act="music"]::before{content:'🎵'} .setmenu [data-act="fxlite"]::before{content:'✨'}
.setmenu [data-act="rules"]::before{content:'📖'}
.setmenu [data-act="newgame"]::before{content:'↺';color:var(--accent)}
.setmenu [data-act="newgame"]{border-color:#ff7a3d66}
.sm-sep{height:1px;margin:4px 2px;background:linear-gradient(90deg,transparent,#f0c35a55,transparent)}
.setmenu .vol{padding:2px 2px 0}
/* game-feel pass (2026-11-16): knockout credit, Highlight medallion, final-round mood, score reveal */
.banner .b-by{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:4px 14px;border-radius:999px;font-size:clamp(15px,2.2vw,21px);
  background:#1a0f05e6;border:1px solid var(--gold);color:var(--gold);box-shadow:0 0 18px #f0c35a55;animation:bby .5s .25s cubic-bezier(.2,1.5,.4,1) both}
.banner .b-by b{color:var(--pc,#fff);text-shadow:0 0 10px currentColor}
@keyframes bby{from{transform:scale(.4);opacity:0}}
.banner.ko-me{--bc:#ff2d45;background:linear-gradient(90deg,transparent,#2a0008ee 14%,#2a0008ee 86%,transparent)}
.fx.vig-ko{background:radial-gradient(ellipse at 50% 60%,transparent 18%,#7a0014cc 62%,#1a0004f2)}
.fx.vig-cyan{background:radial-gradient(ellipse at center,transparent 45%,#1fb8ff55)}
.fx.vig-gold{background:radial-gradient(ellipse at center,transparent 35%,#f0c35a44)}
.fx.hlfly{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;color:#2a1d05;
  background:radial-gradient(circle at 40% 32%,#fff8d6,#f0c35a 48%,#a8761a);border:2px solid #fff3c4;box-shadow:0 0 0 3px #7a5212,0 0 26px #ffd27a,0 0 60px #f0c35a88}
.fx.float.kocredit{color:var(--gold);text-shadow:0 0 18px #f0c35a,0 3px 0 #000}
.fx.float.hlgain{color:#ffe39a;text-shadow:0 0 16px #f0c35a,0 3px 0 #000}

<script>
"use strict";
const $ = s => document.querySelector(s);
/* ---------------- two languages (added 2026-11-26)
   Every string a player can see is written LT('ไทย', 'English'). It carries both sides as ⟦th‖en⟧, so text can be
   built, logged, kept in G and sent online in both languages, and each browser shows its own: pickLang(s) keeps
   LANG's side, and the DOM setters below (innerHTML, textContent, title, setAttribute, canvas text …) call it on the
   way in. Code that splits or measures shown text must pickLang first, or use langSplit. Static markup in the HTML
   carries the markers too and is redone by langStatic(). Setting: sb-lang ('th' | 'en'); default from the browser. */
let LANG = (() => { try { return localStorage.getItem('sb-lang'); } catch { return null; } })() || (/^th\b/i.test(navigator.language || '') ? 'th' : 'en');
const LT = (th, en) => `⟦${th}‖${en}⟧`;
const LANG_RE = /⟦([^⟦⟧‖]*)‖([^⟦⟧‖]*)⟧/g;
function pickLang(s, lang = LANG) {
  if (typeof s !== 'string' || !s.includes('⟦')) return s;
  for (let k = 0; k < 8 && s.includes('⟦'); k++) s = s.replace(LANG_RE, (m, th, en) => lang === 'en' ? en : th); // innermost first
  return s;
}
// split a two-language string on sep in each language and pair the pieces up again
const langSplit = (s, sep) => { const th = pickLang(s, 'th').split(sep), en = pickLang(s, 'en').split(sep); return th.map((x, i) => LT(x, en[i] ?? x)); };
(() => {
  const setter = (proto, prop) => { const d = Object.getOwnPropertyDescriptor(proto, prop);
    if (d && d.set) Object.defineProperty(proto, prop, { ...d, set(v) { d.set.call(this, pickLang(v)); } }); };
  [[Element.prototype, 'innerHTML'], [Element.prototype, 'outerHTML'], [Node.prototype, 'textContent'], [Node.prototype, 'nodeValue'],
   [HTMLElement.prototype, 'innerText'], [HTMLElement.prototype, 'title'], [HTMLInputElement.prototype, 'placeholder'],
   [HTMLInputElement.prototype, 'value'], [Document.prototype, 'title']].forEach(([p, k]) => setter(p, k));
  const args = (obj, name, idx) => { const f = obj[name]; if (f) obj[name] = function (...a) { for (const i of idx) a[i] = pickLang(a[i]); return f.apply(this, a); }; };
  args(Element.prototype, 'setAttribute', [1]); args(Element.prototype, 'insertAdjacentHTML', [1]); args(Document.prototype, 'createTextNode', [0]);
  for (const k of ['fillText', 'strokeText', 'measureText']) args(CanvasRenderingContext2D.prototype, k, [0]);
  for (const k of ['append', 'prepend', 'before', 'after', 'replaceWith', 'replaceChildren']) { const f = Element.prototype[k]; Element.prototype[k] = function (...a) { return f.apply(this, a.map(x => pickLang(x))); }; }
  for (const k of ['alert', 'confirm', 'prompt']) args(window, k, [0]);
})();
// the HTML's own markup: remember each marked text node and attribute once, then show it in LANG (again on a switch)
const LANG_STATIC = [];
function langStatic() {
  if (!LANG_STATIC.length) {
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let n = w.currentNode; n; n = w.nextNode()) {
      if (n.nodeType === 3) { if (n.nodeValue.includes('⟦')) LANG_STATIC.push({ n, src: n.nodeValue }); }
      else for (const a of n.attributes) if (a.value.includes('⟦')) LANG_STATIC.push({ n, a: a.name, src: a.value });
    }
  }
  for (const x of LANG_STATIC) if (x.a) x.n.setAttribute(x.a, x.src); else x.n.nodeValue = x.src;
  document.documentElement.lang = LANG;
}
langStatic();
// sleep(0) yields through a MessageChannel instead of setTimeout: a hidden tab clamps timers to ~1 s, which made
// all-AI test games (AI_DELAY 0) crawl; a message tick still lets the page paint between steps
const zeroTick = (() => { const ch = new MessageChannel(), q = []; ch.port1.onmessage = () => q.shift()(); return f => { q.push(f); ch.port2.postMessage(0); }; })();
const sleep = ms => new Promise(r => ms > 0 ? setTimeout(r, ms) : zeroTick(r));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let G = null, uidc = 1, AI_DELAY = 650;
const statEvent = () => {}; // no visitor stats in this build
// ME = the seat this browser shows and controls: 0 offline and for the host of an online room, the guest's own seat otherwise
let ME = 0;
const meP = () => G.players[ME];

// card types: the code keeps its own keys (creature, treasure …); players see these names
const TYPE_TH = { starter:LT('การ์ดเริ่มต้น', 'Starter'), spell:LT('คาถา · Spell', 'Spell'), creature:LT('ปีศาจ · Demon', 'Demon'), treasure:LT('ไอเทมเวท · Magic Item', 'Magic Item'),
  wizard:LT('นักเวท · Mage', 'Mage'), location:LT('สนามประลอง · Arena', 'Arena'), legend:LT('ยอดฝีมือ · Star', 'Star'), familiar:LT('ภูติคู่ใจ · Companion', 'Companion'), chaos:LT('พายุเวท · Live Event', 'Mana Storm') };
const TYPE_SHORT = { starter:LT('เริ่มต้น', 'Starter'), spell:LT('คาถา', 'Spell'), creature:LT('ปีศาจ', 'Demon'), treasure:LT('ไอเทมเวท', 'Magic Item'), wizard:LT('นักเวท', 'Mage'), location:LT('สนามประลอง', 'Arena'),
  legend:LT('ยอดฝีมือ', 'Star'), familiar:LT('ภูติคู่ใจ', 'Companion'), chaos:LT('พายุเวท', 'Mana Storm') };

/* ---------------- card definitions ----------------
   Main-pile cards are all designed. Cards still blank (a picture art/<id>.jpg and a type) use placeholder numbers
   (ยอดฝีมือ 10 / 4 since 2026-11-09, สนามประลอง 3 / 1) so the table runs while their abilities are designed.
   To give a card an ability: add name, text, power / atk / def … and play: async p => {…} to its def. */
const DEFS = {};
const DUP_IDS = []; // a second def() with the same id silently replaces the first card: simulate() reports these
function def(id, o) {
  if (DEFS[id]) DUP_IDS.push(id); DEFS[id] = { id, name: '', cost: 0, vp: 0, text: '', ...o }; }
function make(id) { return { ...DEFS[id], uid: uidc++ }; }
const P = (p, n) => { G.turn.power += n; if (n > 0) G.turn.gold = (G.turn.gold || 0) + n; }; // gold: earned this turn (Star challenges)
// a card's display name: its own name once it has one, otherwise its type and id (logs and prompts only)
const cn = c => !c ? '' : c.name || `${TYPE_SHORT[c.type] || ''} ${c.id}`;

// starting deck (DESIGN.md): 6 fee + 2 rehearse + the 2 cards of the player's School (setSchool swaps them in)
def('fee', { name:LT('เสบียงผู้ท้าชิง', 'Challenger Rations'), type:'starter', power:1, text:LT('+1 ทอง', '+1 Gold') });
// junk: a knocked-out player gets one (kill). Starter type so it never counts as a card type played; unlimited, not in MAIN
def('leak', { name:LT('คลิปหลุด', 'Leaked Clip'), type:'starter', junk:1, vp:-1, typeText:LT('ขยะ · Junk', 'Junk'), text:LT('ไม่มีผล<br>จบเกม -1 VP<br>ทำลายทิ้งได้ด้วยการ์ดที่ทำลาย', 'No effect<br>Game end: -1 VP<br>Can be removed by any card that destroys') });
def('rehearse', { name:LT('อุ่นเครื่องก่อนศึก', 'Warm-Up Bout'), type:'starter', power:1, playFirst:1, text:LT('+1 ทอง<br>ถ้าเป็นการ์ดใบแรกที่คุณเล่นในเทิร์นนี้ +1 ชื่อเสียง', '+1 Gold<br>If this is the first card you played this turn, +1 Fame'),
  play: async p => { if (G.turn.shown.length === 1) addHype(p, 1, cn(DEFS.rehearse)); } });
def('sc_blaze', { name:LT('ซ้อมยิงไฟ', 'Fireball Drill'), type:'starter', power:1, atk:1, school:1, text:LT('+1 ทอง<br><b>โจมตี:</b> คนทางซ้ายรับ 1 ดาเมจ', '+1 Gold<br><b>Attack:</b> The player on your left takes 1 damage'),
  play: async p => attack(p, { to:'left', dmg:1 }) });
def('sc_brew', { name:LT('ต้มยาหม้อเดือด', 'Boiling Pot Brew'), type:'starter', power:1, school:1, text:LT('+1 ทอง<br>ฟื้น 2 HP', '+1 Gold<br>Heal 2 HP'), play: async p => heal(p, 2) });
def('sc_coin', { name:LT('ส่วนแบ่งกำไร', 'Profit Share'), type:'starter', power:1, school:1, playLate:1, text:LT('+1 ทอง<br>ถ้าเทิร์นนี้คุณมีทองอย่างน้อย 6 +1 ทอง', '+1 Gold<br>If you have at least 6 Gold this turn, +1 Gold'),
  play: async p => { if (G.turn.power >= 6) P(p, 1); } }); // threshold 7 → 5 → 6 (2026-11-10): balance runs
def('sc_clown', { name:LT('เบาะผายลมเวท', 'Magic Whoopee Cushion'), type:'starter', power:1, school:1, text:LT('+1 ทอง<br>ทิ้งการ์ดในมือได้ 1 ใบ ถ้าทิ้ง จั่ว 1 ใบ', '+1 Gold<br>You may discard 1 card from your hand. If you do, draw 1 card'),
  play: async p => {
    if (!p.hand.length) return;
    const c = p.isAI ? p.hand.find(x => x.type === 'starter' && !x.parts) || null
      : await humanChoose(p, LT(`${cn(DEFS.sc_clown)}: ทิ้งการ์ด 1 ใบแล้วจั่ว 1?`, `${cn(DEFS.sc_clown)}: Discard 1 card and draw 1?`), [...p.hand.map(x => ({ card: x, value: x })), { label: LT('ไม่ทิ้ง', 'Keep it'), value: null, ghost: true }]);
    if (!c) return;
    p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); log(LT(`${p.name} ทิ้ง ${cn(c)}`, `${p.name} discards ${cn(c)}`)); await draw(p, 1);
  } });
// sc_puppet works on the top of the target's deck, never the hand: a starter card that cut hands from turn 1 was too harsh (2026-11-11)
def('sc_puppet', { name:LT('ด้ายหุ่นเชิด', 'Puppet String'), type:'starter', power:1, atk:1, school:1,
  text:LT('+1 ทอง<br><b>โจมตี:</b> เปิดการ์ดบนสุดของเด็คเป้าหมาย คุณเลือกให้ทิ้งหรือวางคืน ถ้าทิ้งการ์ดเริ่มต้น คุณ +1 ชื่อเสียง ถ้าทิ้งใบอื่น คุณ +1 ทอง', '+1 Gold<br><b>Attack:</b> Reveal the top card of the target\'s deck. You choose: discard it or put it back. If a Starter is discarded, +1 Fame; if any other card, +1 Gold'),
  play: async p => attack(p, { to:'choose', dmgText:LT('เปิดการ์ดบนสุดของเด็ค แล้วอาจถูกทิ้ง', 'Reveals the top card of your deck, which may be discarded'), dmg: async t => {
    const c = revealTop(t); if (!c) return 0;
    const toss = p.isAI ? true : await humanChoose(p, LT(`${cn(DEFS.sc_puppet)}: การ์ดบนสุดของ ${t.name} · ทิ้งไหม?`, `${cn(DEFS.sc_puppet)}: Top card of ${t.name}'s deck · Discard it?`),
      [{ card: c, label: LT('ทิ้ง', 'Discard'), value: 'toss' }, { label: LT('วางคืนบนเด็ค', 'Put it back'), value: 'keep', ghost: true }]) === 'toss';
    if (!toss) { log(LT(`${cn(c)} ถูกวางคืนบนเด็ค ${t.name}`, `${cn(c)} goes back on top of ${t.name}'s deck`)); return 0; }
    t.deck.splice(t.deck.lastIndexOf(c), 1); t.discard.push(c);
    log(LT(`${t.name} ทิ้ง ${cn(c)} จากบนเด็ค`, `${t.name} discards ${cn(c)} from the top of their deck`)); AUD.play('discard');
    if (c.type === 'starter' && !c.parts) addHype(p, 1, cn(DEFS.sc_puppet)); else P(p, 1);
    puppetHype(p, t);
    return 0;
  } }) });
def('sc_tamer', { name:LT('ขนมล่อภูติ', 'Spirit Treat'), type:'starter', power:1, school:1, text:LT('+1 ทอง<br>ถ้าภูติคู่ใจของคุณเลเวล 2 ขึ้นไป +1 ทอง', '+1 Gold<br>If your Companion is level 2 or higher, +1 Gold'),
  play: async p => { if ((p.famLv || 1) >= 2) P(p, 1); } });
// a fused card (Fusion): makeFused() fills in parts, name, text and numbers; playing it plays every part in order,
// then its recipe's bonus (RECIPES; a 'pure' one never explodes)
// An unstable one (EXPLODE_AT+ parts, not 'pure') carries heat (self.heat, 0–heatMax): heat in 6 to explode when played,
// +1 ทอง per heat when it doesn't, then +1 heat. From heat 2 its owner may pay 1 Hype to cool it back to 0 first.
def('fused', { type:'spell', play: async (p, self) => {
  if (unstable(self)) {
    const h = self.heat || 0;
    if (h >= 2 && (p.hype || 0) >= 1) {
      const cool = p.isAI ? h >= 3 || (p.hype || 0) >= 6
        : await humanChoose(p, LT(`🔥 ${cn(self)} ร้อน ${h}/${heatMax(p)}`, `🔥 ${cn(self)} heat ${h}/${heatMax(p)}`), [
          { label: LT(`❄ ระบายความร้อน · จ่าย 1 ชื่อเสียง (ความร้อนกลับเป็น 0 ไม่ระเบิด)`, `❄ Vent the heat · Pay 1 Fame (heat drops to 0, no explosion)`), value: true },

def('st37', { name:LT('ปรมาจารย์ออร์บิต', 'Grandmaster Orbit'), type:'legend', cost:10, vp:4, ch:'cards8', power:1, copies:1,
  text:LT('+1 ทอง<br>เลือกการ์ดในกองทิ้งของคุณ 1 ใบ (ไม่ใช่ยอดฝีมือ สนาม หรือการ์ดต่อเนื่อง) ใช้ผลของมันทันที แล้วการ์ดนั้นอยู่ในกองทิ้งตามเดิม (ใช้กับการ์ดที่ใช้ผลการ์ดอื่นไม่ได้)', '+1 Gold<br>Choose 1 card in your discard pile (not a Star, Arena or Ongoing card) and use its effect right away; the card stays in your discard pile (can\'t copy a card that copies another card\'s effect)'),
  play: async (p, self) => {
    const opts = replayable(p);
    if (!opts.length) { log(LT('ไม่มีการ์ดในกองทิ้งให้ใช้', 'No card in your discard pile to use')); return; }
    const c = p.isAI ? opts.slice().sort((a, b) => aiVal(b) - aiVal(a))[0]
      : await humanChoose(p, LT(`${cn(DEFS.st37)}: ใช้ผลการ์ดใบไหน?`, `${cn(DEFS.st37)}: Use which card's effect?`), opts.map(x => ({ card: x, value: x })));
    log(LT(`${p.name} เรียก ${cn(c)} จากกองทิ้งมาใช้`, `${p.name} calls ${cn(c)} up from the discard pile`), 'good'); showEvent(c, LT(`${p.name} ใช้จากกองทิ้ง`, `${p.name} uses it from the discard pile`), 'act');
    G.curLabel = cn(c); G.curCard = c;
    if (c.power) P(p, c.power);
    if (c.play) await c.play(p, c);
    G.curCard = self;
  } });

const HYPE_MAX = 12;

  if (!p || !n) return;

  if (p.hype === b) return;
  if (p.hype > b && G.turn && p === cur()) G.turn.hypeGain = (G.turn.hypeGain || 0) + p.hype - b; // for sponsor contracts
  log(LT(`${p.name} ${n > 0 ? '+' : ''}${p.hype - b} ชื่อเสียง (${why}) · รวม ${p.hype}`, `${p.name} ${n > 0 ? '+' : ''}${p.hype - b} Fame (${why}) · total ${p.hype}`), n > 0 ? 'good' : 'dmg');
  if (n > 0) AUD.play('power');
  FX.hype(p, p.hype - b);
  // a new sole Hype leader (worth +2 VP at the end) gets a moment, once they have at least 3; G.hypeLead = their seat, -1 for none/tied
  const top = Math.max(...G.players.map(x => x.hype || 0)), leaders = G.players.filter(x => (x.hype || 0) === top);
  const lead = top > 0 && leaders.length === 1 ? G.players.indexOf(leaders[0]) : -1;

}

// Shared Arenas (สนามประลอง): the table has at most one (G.arena; its host is seat G.arenaHost). Buying an Arena, or playing
// one from your hand onto an empty table, makes it the table's Arena with you as host; the old one goes to its host's discard pile. The rule
// works for everyone, the host bonus only for the host; the host counts its VP. An Arena def may give its own rule as
// `arena: {…}`; the rest get one from ARENA_RULES at setup (c.rule, a placeholder). Rule hooks: dmg (+ damage of attacks
// that hit), hand (+ cards drawn at end of turn: a number, or (p, host) => number), cost(p, c, host) (Line-Up discount),
// fuse(p, host) (Fusion discount), koHype (+ Hype for a knockout), start(p, host) (everyone's turn start), hostStart(p)
// (the host's turn start), onPlay(p, card, host) (after the turn player plays a card from hand).
const ARENA_RULES = [

  { id:'open', text:LT('จบเทิร์นจั่ว 6 ใบ', 'Draw 6 cards at the end of turn'), host:LT('ต้นเทิร์น ฟื้น 2 HP', 'Start of turn: heal 2 HP'), hand:1, hostStart: async p => { heal(p, 2); } },
  { id:'market', text:LT('การ์ดใน Line-Up ถูกลง 1 ทอง (ต่ำสุด 1)', 'Cards in the Line-Up cost 1 less Gold (min 1)'), host:LT('ถูกลงอีก 1 ทอง', '1 more Gold off'), cost: (p, c, host) => host ? 2 : 1 },
  { id:'clinic', text:LT('ต้นเทิร์น ฟื้น 1 HP', 'Start of turn: heal 1 HP'), host:LT('ฟื้นเพิ่มอีก 1 HP', 'Heals 1 more HP'), start: async (p, host) => { heal(p, host ? 2 : 1); } },
  { id:'forge', text:LT('หลอมถูกลง 1 ทอง', 'Fusing costs 1 less Gold'), host:LT('หลอมฟรี', 'Fusing is free'), fuse: (p, host) => host ? 99 : 1 },
  { id:'stage', text:LT('น็อกเอาต์ได้ชื่อเสียงเพิ่ม +2', 'Knockouts give +2 extra Fame'), host:LT('ต้นเทิร์น จั่วเพิ่ม 1 ใบ', 'Start of turn: draw 1 extra card'), koHype:2, hostStart: async p => { await draw(p, 1); } },
];
const ruleOf = c => c && (DEFS[c.id].arena || ARENA_RULES.find(r => r.id === c.rule));
const arenaRule = () => ruleOf(G.arena) || {};
const arenaHost = () => G.arena ? G.players[G.arenaHost] : null;
const isHost = p => !!p && arenaHost() === p;
const arenaText = c => { const r = ruleOf(c); return r ? LT(`<b>ทุกคน:</b> ${r.text}<br><b>เจ้าบ้าน:</b> ${r.host}`, `<b>Everyone:</b> ${r.text}<br><b>Host:</b> ${r.host}`) : ''; };
Object.values(DEFS).filter(d => d.arena).forEach(d => { d.text = arenaText(d); }); // designed Arenas (defArena)
function setArena(p, c) {
  clearArena(null);
  G.arena = c; G.arenaHost = G.players.indexOf(p);
  log(LT(`🏟 ${p.name} เปิดสนาม ${cn(c)} และเป็นเจ้าบ้าน · ${ruleOf(c).text}`, `🏟 ${p.name} opens the ${cn(c)} Arena and becomes its host · ${ruleOf(c).text}`), 'sys');

// the Arena leaves the table to its host's discard pile (why = the log reason; null when a new Arena replaces it)
function clearArena(why) {
  const old = G.arena, h = arenaHost();
  if (!old) return;
  G.arena = null; G.arenaHost = null;

  render();
}

// Sponsors (พันธสัญญา): a side pile, the first SPONSOR_SHOW face up, SPONSOR_COST ทอง each. Buying one gives its effect now

// pay `fine` and lose the contract. Finishing it gives +1 Hype. One contract at a time; a knockout cancels it. A sponsor
// card returns to the bottom of the pile when its contract ends. ok(p) is checked at end of turn; aiOk(p) = AI will sign.
const SPONSOR_COST = 2, SPONSOR_SHOW = 2, CONTRACT_TURNS = 3;
const SPONSORS = [

    deal:LT('จบเทิร์นด้วย HP 10 ขึ้นไป', 'End your turn with 10 HP or more'), ok: p => p.hp >= 10, fine:LT('เสีย 2 ชื่อเสียง', 'Lose 2 Fame'), penalty: async p => { addHype(p, -2, LT('ผิดสัญญา', 'Broke the pact')); },
    aiOk: p => p.hp >= 14 },
  { id:'channel', name:LT('หอเกียรติยศ', 'Hall of Fame'), now:LT('+2 ชื่อเสียง', '+2 Fame'), run: async p => { addHype(p, 2, LT('พันธสัญญา', 'Pact')); },
    deal:LT('เล่นคาถาอย่างน้อย 1 ใบ', 'Play at least 1 Spell'), ok: () => (G.turn.types.spell || 0) > 0, fine:LT('เสีย 3 ชื่อเสียง', 'Lose 3 Fame'), penalty: async p => { addHype(p, -3, LT('ผิดสัญญา', 'Broke the pact')); },
    aiOk: p => allCards(p).filter(c => isType(c, 'spell')).length >= 4 },
  { id:'hardcore', name:LT('ผู้สนับสนุนสายโหด', 'Ruthless Backer'), now:LT('<b>โจมตี:</b> เป้าหมายรับ 2 ดาเมจ', '<b>Attack:</b> The target takes 2 damage'), run: async p => { await attack(p, { to:'choose', dmg:2 }); },
    deal:LT('ทำดาเมจศัตรู', 'Damage an enemy'), ok: () => (G.turn.dmgDealt || 0) > 0, fine:LT('เทิร์นหน้าจั่วน้อยลง 1 ใบ', 'Draw 1 fewer card next turn'), penalty: async p => { p.drawPenalty = 1; },
    aiOk: p => allCards(p).filter(c => c.atk).length >= 3 },
  { id:'potion', name:LT('แบรนด์ยาฟื้นพลัง', 'Recovery Potion Brand'), now:LT('ฟื้น 3 HP', 'Heal 3 HP'), run: async p => { heal(p, 3); },
    deal:LT('เล่นการ์ด 6 ใบขึ้นไป', 'Play 6 or more cards'), ok: () => (G.turn.nPlayed || 0) >= 6, fine:LT('เสีย 2 HP', 'Lose 2 HP'), penalty: async p => { await loseHP(p, 2); },
    aiOk: p => p.hp <= 12 },
  { id:'gossip', name:LT('เครือข่ายสายลับ', 'Spy Network Deal'), now:LT('+1 ทอง +1 ชื่อเสียง', '+1 Gold +1 Fame'), run: async p => { P(p, 1); addHype(p, 1, LT('พันธสัญญา', 'Pact')); },
    deal:LT('ได้ชื่อเสียงอย่างน้อย 1', 'Gain at least 1 Fame'), ok: () => (G.turn.hypeGain || 0) > 0, fine:LT('เสีย 2 ชื่อเสียง', 'Lose 2 Fame'), penalty: async p => { addHype(p, -2, LT('ผิดสัญญา', 'Broke the pact')); },
    aiOk: p => p.deck.concat(p.discard, p.hand).filter(c => c.id === 'rehearse').length >= 2 },
  { id:'mascot', name:LT('ภูตเก็บกวาดสนาม', 'Arena Cleanup Spirit'), now:LT('ทำลายการ์ดในมือได้ 1 ใบ', 'You may destroy 1 card from your hand'), run: async p => { await destroyFromHand(p, 1); },
    deal:LT('ได้ทองรวม 7 ขึ้นไป', 'Gain 7 or more total Gold'), ok: () => (G.turn.gold || 0) >= 7, fine:LT('เสีย 2 HP', 'Lose 2 HP'), penalty: async p => { await loseHP(p, 2); },
    aiOk: p => allCards(p).length >= 16 },
];
const sponsorOf = id => SPONSORS.find(s => s.id === id);
const sponsorText = s => LT(`<b>ทันที:</b> ${s.now}<br><b>สัญญา ${CONTRACT_TURNS} เทิร์น:</b> ${s.deal}<br><b>ผิดสัญญา:</b> ${s.fine}`, `<b>Now:</b> ${s.now}<br><b>Pact, ${CONTRACT_TURNS} turns:</b> ${s.deal}<br><b>If broken:</b> ${s.fine}`);
const canSponsor = (p, i) => p === cur() && !p.contract && i < Math.min(SPONSOR_SHOW, G.sponsors.length) && G.turn.power >= SPONSOR_COST;
async function signSponsor(p, i) {
  if (!canSponsor(p, i)) return false;
  const s = sponsorOf(G.sponsors.splice(i, 1)[0]);
  G.turn.power -= SPONSOR_COST;
  p.contract = { id: s.id, left: CONTRACT_TURNS, fresh: true }; // fresh: the signing turn isn't checked
  log(LT(`📜 ${p.name} เซ็นสัญญากับ ${s.name} (${SPONSOR_COST} ทอง)`, `📜 ${p.name} signs a Pact with ${s.name} (${SPONSOR_COST} Gold)`), 'sys');
  AUD.play('buy'); render();
  await s.run(p);
  render();
  return true;
}
function endContract(p, why) {
  if (!p.contract) return;
  const s = sponsorOf(p.contract.id);
  p.contract = null; G.sponsors.push(s.id);
  if (why) log(LT(`สัญญา ${s.name} ของ ${p.name} ถูกยกเลิก (${why})`, `${p.name}'s Pact ${s.name} is cancelled (${why})`));
}
// end of p's turn, before cleanup (this turn's counters are still there)
async function checkContract(p) {
  const k = p.contract; if (!k) return;
  if (k.fresh) { k.fresh = false; return; }
  const s = sponsorOf(k.id);
  if (s.ok(p)) {
    if (--k.left > 0) { log(LT(`📜 ${p.name} ทำตามสัญญา ${s.name} (เหลือ ${k.left} เทิร์น)`, `📜 ${p.name} keeps the ${s.name} Pact (${k.left} turns left)`)); return; }
    endContract(p); log(LT(`📜 ${p.name} ทำสัญญา ${s.name} ครบ!`, `📜 ${p.name} completes the ${s.name} Pact!`), 'good'); addHype(p, 1, LT('ทำสัญญาครบ', 'Pact completed'));
  } else {
    endContract(p); log(LT(`📜 ${p.name} ผิดสัญญา ${s.name}: ${s.fine}`, `📜 ${p.name} breaks the ${s.name} Pact: ${s.fine}`), 'dmg');
    await s.penalty(p);
  }
}

// a Live Event vote: everyone at once (humans in their own dialog), each vote weighs 1 + 1 per 4 Hype; a tie goes the
// way the turn player voted
const voteWeight = p => 1 + Math.floor((p.hype || 0) / 4) + (inSchool(p, 'puppet') ? 1 : 0);
// the vote dialog dressed as a live broadcast: a LIVE badge, the event name as the headline, A and B as two game-show
// podiums (.vote-pick in the sub switches the dialog's look, on guests' screens too)
function voteSub(p) {
  const h = Math.floor((p.hype || 0) / 4), why = ['1', h ? LT(`${h} จากชื่อเสียง`, `${h} from Fame`) : '', inSchool(p, 'puppet') ? LT('1 หุ่นเชิด', '1 puppet') : ''].filter(Boolean).join(' + ');
  return `<div class="vote-pick"><div class="vp-kick">${LT('พายุเวท · ทุกคนเลือกทางพร้อมกัน', 'Mana Storm · everyone chooses at once')}</div>
    <div class="vp-weight">${LT('เสียงของคุณ', 'Your vote')} <b>×${voteWeight(p)}</b> <small>(${why} · ${LT('ทุก 4 ชื่อเสียง +1 เสียง', '+1 vote per 4 Fame')})</small></div></div>`;
}
const voteOpt = (k, text) => `<span class="vo-letter">${k}</span><span class="vo-text">${text}</span><span class="vo-go">${LT('เลือก', 'Choose')} ${k}</span>`;
async function liveEvent(id) {
  const ev = EVENTS[id];
  const votes = await Promise.all(G.players.map(async p => {
    if (p.isAI) return ev.a.ai(p) >= ev.b.ai(p) ? 'a' : 'b';
    if (TUT.on) TUT.event('vote');
    const v = await humanChoose(p, ev.name, [{ label: voteOpt('A', ev.a.text), value:'a' }, { label: voteOpt('B', ev.b.text), value:'b' }], voteSub(p));
    return v || (ev.a.ai(p) >= ev.b.ai(p) ? 'a' : 'b'); // a guest who left votes like the AI
  }));
  if (!G) return;
  const sum = k => G.players.reduce((s, p, i) => s + (votes[i] === k ? voteWeight(p) : 0), 0);
  const sa = sum('a'), sb = sum('b'), win = sa > sb ? 'a' : sb > sa ? 'b' : votes[G.cur];
  const opt = ev[win];
  log(LT(`🌪 เลือกทาง ${ev.name}: A ${sa} · B ${sb} → ${win.toUpperCase()} · ${opt.text}`, `🌪 Choose ${ev.name}: A ${sa} · B ${sb} → ${win.toUpperCase()} · ${opt.text}`), 'sys');
  await FX.vote({ name: ev.name, a: ev.a.text, b: ev.b.text, sa, sb, win, tie: sa === sb,
    voters: G.players.map((p, i) => ({ n: p.name, c: p.color, v: votes[i], w: voteWeight(p) })) });
  G.curLabel = ev.name;
  await opt.run();
  render();
}

/* ---------------- audio: every sound is synthesized with Web Audio, no files ----------------
   AUD.play(name) for SFX · background music is a procedural war-film score (see musicStep) */
const AUD = (() => {
  const KEY = 'wizardroyale-audio', LEVEL = { sfx: 1, mus: .5 };
  const st = { sfx: true, music: true, vsfx: 1, vmus: 1 }; // vsfx / vmus: the settings sliders (0–1)
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  let ctx = null, noiseBuf = null, timer = null, nextT = 0, step = 0;
  const bus = {}, wet = {};
  const N = m => 440 * Math.pow(2, (m - 69) / 12);
  const lvl = b => LEVEL[b] * (b === 'sfx' ? st.vsfx : st.vmus); // base level × the player's slider

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .3;
    comp.connect(ctx.destination);
    // synthesized hall reverb
    const verb = ctx.createConvolver(), len = Math.floor(ctx.sampleRate * 2.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir; verb.connect(comp);
    for (const [b, on] of [['sfx', st.sfx], ['mus', st.music]]) {
      bus[b] = ctx.createGain(); bus[b].gain.value = on ? lvl(b) : 0; bus[b].connect(comp);
      wet[b] = ctx.createGain(); wet[b].gain.value = on ? lvl(b) * .5 : 0; wet[b].connect(verb);
    }
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return true;
  }
  function voice(src, { t, a = .005, d = .3, v = .2, b = 'sfx', w = .25, filter, f0, f1, q = 1 }) {
    let node = src;
    if (filter) {
      const fl = ctx.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
      fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + a + d);
      node.connect(fl); node = fl;
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    node.connect(g); g.connect(bus[b]);
    if (w) { const s = ctx.createGain(); s.gain.value = w; g.connect(s); s.connect(wet[b]); }
    src.start(t); src.stop(t + a + d + .05);
    return src;
  }
  function tone(type, f, o) {
    const s = ctx.createOscillator(); s.type = type; s.frequency.setValueAtTime(f, o.t);
    if (o.to) s.frequency.exponentialRampToValueAtTime(o.to, o.t + (o.a || .005) + (o.d || .3));
    if (o.detune) s.detune.value = o.detune;
    return voice(s, o);
  }
  function noise(o) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return voice(s, o); }
  function lfo(param, rate, depth, t, dur) {
    const l = ctx.createOscillator(), g = ctx.createGain(); l.frequency.value = rate; g.gain.value = depth;
    l.connect(g); g.connect(param); l.start(t); l.stop(t + dur);
  }
  function drum(t, v, b = 'sfx') {
    tone('sine', 120, { t, to: 42, d: .55, v, b, w: .35 });
    noise({ t, d: .18, v: v * .5, filter: 'lowpass', f0: 900, f1: 90, b, w: .3 });
  }
  function cymbal(t, v, b = 'sfx') { noise({ t, a: .002, d: 1.8, v, filter: 'highpass', f0: 5500, b, w: .6 }); }
  function brass(ms, t, d, v, b = 'sfx') {
    const k = v / Math.sqrt(ms.length);
    ms.forEach(m => [-9, 9].forEach(dt => tone('sawtooth', N(m), { t, a: .07, d, v: k, detune: dt, filter: 'lowpass', f0: 500, f1: 2400, q: 1.5, b, w: .5 })));
  }
  function choir(ms, t, d, v, b = 'sfx') {
    const k = v / Math.sqrt(ms.length);
    ms.forEach(m => [-14, 0, 14].forEach(dt => {
      const o = tone('sawtooth', N(m), { t, a: Math.min(.5, d * .3), d, v: k, detune: dt, filter: 'lowpass', f0: 900, f1: 700, b, w: .8 });
      lfo(o.detune, 5, 6, t, d + .6);
    }));
  }
  function impact(t, n) {
    tone('sine', 150, { t, to: 38, d: .35 + n * .06, v: Math.min(.9, .45 + n * .08), w: .2 });
    noise({ t, d: .25 + n * .04, v: .5, filter: 'lowpass', f0: 2400, f1: 120, w: .35 });
    if (n >= 4) { tone('sine', 70, { t, to: 28, d: 1.2, v: .6, w: .5 }); noise({ t: t + .02, d: 1.4, v: .25, filter: 'lowpass', f0: 600, f1: 60, w: .7 }); }
  }
  const S = {
    card: t => noise({ t, d: .14, v: .22, filter: 'bandpass', f0: 1200, f1: 4200, q: 1.2, w: .1 }),
    draw: t => noise({ t, d: .05, v: .08, filter: 'highpass', f0: 3500, w: 0 }),
    power: t => { tone('sine', N(84), { t, d: .35, v: .06, w: .4 }); tone('sine', N(91), { t: t + .05, d: .4, v: .045, w: .4 }); },
    cast: t => {
      tone('sawtooth', 160, { t, to: 1100, a: .02, d: .28, v: .09, filter: 'lowpass', f0: 800, f1: 5000, w: .3 });
      noise({ t, a: .03, d: .3, v: .18, filter: 'bandpass', f0: 600, f1: 4000, q: 2, w: .3 });
    },
    // a hit scaled by damage; 6+ adds a bone-crunch crack on top
    impact: (t, n = 2) => {
      impact(t, n);
      if (n >= 6) {
        noise({ t, a: .001, d: .12, v: .5, filter: 'bandpass', f0: 1400, f1: 500, q: 1.4, w: .2 });
        tone('square', 110, { t, to: 36, d: .28, v: .09, filter: 'lowpass', f0: 900, f1: 200, w: .2 });
      }
    },
    // attack styles (FX.strike): each shot has its own sound
    zap: t => {                                             // spell orb: sparkling rising chime + airy whoosh
      [79, 84, 88, 91, 96].forEach((m, i) => tone('sine', N(m), { t: t + i * .045, d: .25, v: .05, w: .7 }));
      noise({ t, a: .05, d: .35, v: .12, filter: 'bandpass', f0: 2000, f1: 7000, q: 3, w: .4 });
    },
    slash: t => [0, .07, .14].forEach((dt, i) => {          // creature claws: three quick swipes
      noise({ t: t + dt, a: .004, d: .09, v: .35, filter: 'bandpass', f0: 4200 - i * 700, f1: 900, q: 2.5, w: .15 });
      tone('sawtooth', 700 - i * 90, { t: t + dt, to: 180, d: .08, v: .05, filter: 'lowpass', f0: 2500, w: .1 });

  // full-screen storm canvas: slanted rain + branching lightning strikes (each with thunder + flash); returns stop()
  function storm() {
    const cv = document.createElement('canvas');
    cv.className = 'fx storm-cv'; cv.width = innerWidth; cv.height = innerHeight;
    $('#fx').appendChild(cv);
    const g = cv.getContext('2d'), W = cv.width, H = cv.height;
    const rain = Array.from({ length: 180 }, () => ({ x: Math.random() * W * 1.2, y: Math.random() * H, l: 14 + Math.random() * 18, v: 16 + Math.random() * 12 }));
    const bolts = [];
    // midpoint displacement gives the jagged lightning shape
    function path(x0, y0, x1, y1, spread) {
      let pts = [[x0, y0], [x1, y1]];
      for (let gen = 0; gen < 6; gen++, spread /= 2) {
        const n = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          n.push([(ax + bx) / 2 + (Math.random() - .5) * spread, (ay + by) / 2 + (Math.random() - .5) * spread * .3], pts[i]);
        }
        pts = n;
      }
      return pts;
    }
    function strike(now) {
      // half the strikes land around the showcased card in the middle
      const near = Math.random() < .5;
      const x0 = Math.random() * W, x1 = near ? W / 2 + (Math.random() - .5) * Math.min(W * .5, 420) : Math.random() * W;
      const y1 = near ? H * (.3 + Math.random() * .4) : H * (.65 + Math.random() * .35);
      const main = path(x0, -10, x1, y1, Math.min(260, W * .25));
      const lines = [main];
      for (let b = 0; b < 1 + Math.floor(Math.random() * 3); b++) {
        const [sx, sy] = main[8 + Math.floor(Math.random() * (main.length - 16))];
        lines.push(path(sx, sy, sx + (Math.random() - .5) * 320, sy + 80 + Math.random() * 180, 90));
      }
      bolts.push({ lines, born: now, life: 380 });
      AUD.play('thunder', near);
      screen('flash', [{ opacity: 0 }, { opacity: near ? .45 : .28, offset: .1 }, { opacity: 0 }], 260);
      if (near) shake(7);
    }
    let next = performance.now() + 150, stopping = 0, raf;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!stopping && now >= next) { strike(now); next = now + 220 + Math.random() * 520; }
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(190,180,255,.28)'; g.lineWidth = 1.2; g.beginPath();
      for (const d of rain) {
        d.y += d.v; d.x -= d.v * .25;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * W * 1.2; }
        g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .25, d.y - d.l);
      }
      g.stroke();
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i], age = now - b.born;
        if (age > b.life) { bolts.splice(i, 1); continue; }
        const a = (1 - age / b.life) * (age < 70 || Math.random() > .35 ? 1 : .35); // flicker
        b.lines.forEach((pts, k) => {
          for (const [w, col] of [[k ? 5 : 10, `rgba(170,110,255,${a * .35})`], [k ? 1.2 : 2.6, `rgba(255,255,255,${a})`]]) {
            g.lineWidth = w; g.strokeStyle = col; g.shadowColor = '#c9a0ff'; g.shadowBlur = 24;
            g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          }
        });
        g.shadowBlur = 0;
      }
    }
    raf = requestAnimationFrame(frame);
    return () => {
      stopping = 1;
      cv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => { cancelAnimationFrame(raf); cv.remove(); };
      setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 900);
    };
  }

  // --- attack styles for FX.strike (from: {x,y}, to: {x,y}, t: the target player) ---
  // a player's attack looks like their School's magic; attacks with no attacker (Stars, Live Events) keep the meteor / lightning

  // the shared hit: white-hot flash, a shockwave ring, streaking sparks and a few soft glows (k scales it)
  function impact(b, col, hot = '#fff3c4', k = 1) {
    VFX.flash(b.x, b.y, 70 * k, col, .32); VFX.flash(b.x, b.y, 28 * k, '#ffffff', .16);
    VFX.ring(b.x, b.y, { r0: 10, r1: 95 * k, color: col, width: 6 * k, life: .45 });

  // part of a quadratic curve a → c → b, from 0 to k, as points (wobble: a shiver in px)
  const qPts = (a, c, b, k, wob = 0, t = 0) => Array.from({ length: 25 }, (_, j) => {
    const u = j / 24 * k, s = Math.sin(j * .9 + t * 40) * wob * Math.sin(Math.PI * j / 24);
    return [(1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * c.x + u * u * b.x + s, (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * c.y + u * u * b.y + s];
  });
  const stroke = (g, pts, col, w) => {
    for (const [lw, c] of [[w * 3, rgba(col, .3)], [w, rgba(col, 1)], [w * .35, '#fff']]) {
      g.lineWidth = lw; g.strokeStyle = c; g.lineCap = g.lineJoin = 'round';

  }

  // --- game-feel helpers (knockout, heavy hits, Highlights) ---

  function recoil(p, k, bright) {

    const r = el.getBoundingClientRect(), dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2, L = Math.hypot(dx, dy) || 1;
    const ox = dx / L * k, oy = dy / L * k * .6, f = bright ? 'brightness(2.2) saturate(.4)' : 'none';
    el.animate([{ transform: 'none', filter: 'none' }, { transform: `translate(${ox}px,${oy}px) rotate(${ox > 0 ? 3 : -3}deg)`, filter: f, offset: .18 },
      { transform: `translate(${-ox * .25}px,${-oy * .25}px)`, filter: 'none', offset: .55 }, { transform: 'none', filter: 'none' }],
      { duration: 380, easing: 'ease-out', composite: 'add' });
